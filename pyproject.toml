[project]
name = "qq-digest"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[project.scripts]
qq-digest = "qq_digest.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

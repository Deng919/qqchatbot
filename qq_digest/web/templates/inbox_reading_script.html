<script>
  var inboxItems=[],inboxSelectedKey=null,inboxQuery='',inboxMobileOpen=false,inboxGroupButtons=[],inboxReadRevision=0;
  var inboxDashboardActive=false,inboxDashboardRevision=0,inboxDashboardCards=[],inboxDashboardButtons=[];
  function inboxN(id){return document.getElementById(id);}
  function inboxMobile(){return window.matchMedia('(max-width: 900px)').matches;}
  function inboxTextParts(item){var text=summaryCleanText(item.text),match=text.match(/^([^\n：。！？]{1,48})[：。！？\n]/);return {title:match?match[1]:text.slice(0,48),body:match?text.slice(match[0].length)||text:text};}
  function inboxApplyView(){
    var dashboard=inboxDashboardActive&&summaryView==='points',dashboardDetail=dashboard&&(summaryDetailActive||inboxMobileOpen);
    inboxN('summary-reading-controls').hidden=(dashboard||inboxMobile())&&(summaryDetailActive||inboxMobileOpen);
    inboxN('summary-reading-section').hidden=summaryView==='manage';
    inboxN('summary-points').hidden=summaryView!=='points';inboxN('summary-groups').hidden=summaryView!=='groups';
    inboxN('inbox-page-query').parentElement && (inboxN('inbox-page-query').parentElement.hidden=summaryView!=='points');
    inboxN('inbox-point-detail').hidden=summaryDetailActive||summaryView!=='points'||!inboxSelectedKey||(dashboard&&!inboxMobileOpen);
    inboxN('inbox-placeholder').hidden=dashboard||summaryDetailActive||summaryView==='manage'||!!inboxSelectedKey;
    inboxN('inbox-workspace').classList.toggle('inbox-detail-open',summaryDetailActive||inboxMobileOpen);
    inboxN('inbox-workspace').classList.toggle('inbox-manage-open',summaryView==='manage');
    inboxN('inbox-workspace').classList.toggle('inbox-list-only',!summaryDetailActive&&(summaryView==='groups'||(summaryView==='points'&&(dashboard?!inboxMobileOpen:!inboxSelectedKey))));
    inboxN('inbox-workspace').classList.toggle('inbox-dashboard-mode',dashboard);
    inboxN('inbox-workspace').classList.toggle('inbox-dashboard-detail',dashboardDetail);
    inboxGroupButtons.forEach(function(entry){entry.button.setAttribute('aria-pressed',String(inboxN('report-group').value===entry.value));});
  }
  function inboxClearSelection(){inboxReadRevision++;inboxDashboardRevision++;summaryPointReference=null;inboxSelectedKey=null;inboxItems=[];inboxQuery='';inboxMobileOpen=false;inboxDashboardActive=false;inboxN('inbox-page-query').value='';inboxN('summary-points').textContent='正在读取讨论…';inboxApplyView();}
  function inboxBackToList(){if(summaryBackInScope())return;summaryPointReference=null;inboxMobileOpen=false;inboxApplyView();inboxDashboardCards.forEach(function(entry){entry.restorePosition();});if(inboxMobile()||inboxDashboardActive)inboxN('summary-points').focus();if(inboxDashboardActive&&typeof summaryScrollTo==='function')summaryScrollTo(summaryBrowseScroll);summarySave();}
  function inboxSelectPoint(key,explicit){
    var item=inboxItems.find(function(point){return point.key===key;});if(!item)return;
    if(explicit){if(!inboxMobileOpen||inboxSelectedKey!==key){summarySave();summaryHistoryPush();}if(typeof summaryScrollPosition==='function')summaryBrowseScroll=summaryScrollPosition();inboxDashboardCards.forEach(function(entry){entry.rememberPosition();});closeReport();inboxMobileOpen=true;summaryPointReference={key:item.key,group_id:item.group_id,report_kind:item.report_kind||'daily',report_id:Number(item.report_id)};}inboxSelectedKey=key;
    var parts=inboxTextParts(item);inboxN('inbox-detail-section').textContent=item.section;
    inboxN('inbox-detail-meta').textContent=item.group_name+' · '+(item.date_label||item.report_date)+' · '+(item.read?'已读':'未读');
    inboxN('inbox-detail-title').textContent=parts.title;inboxN('inbox-detail-body').textContent=parts.body;
    var actions=inboxN('inbox-detail-actions');actions.textContent='';
    if(item.status==='cited'&&item.source_ids.length)actions.appendChild(summaryButton('查看原消息',function(){summaryOpenSource(item,this);}));
    else actions.appendChild(summaryNode('span','header-meta',item.status==='legacy'?'旧报告未记录逐条来源':'这条要点未提供有效来源'));
    actions.appendChild(summaryButton('完整摘要',function(){viewReport(item.report_kind||'daily',Number(item.report_id));}));
    appendBookmarkAction(actions,{kind:'report',report_kind:item.report_kind||'daily',report_id:Number(item.report_id),point_key:item.key});
    var read=summaryButton(item.read?'标为未读':'标为已读',function(){
      var revision=inboxReadRevision,nextRead=!item.read;read.disabled=true;
      api('POST','/api/summary-reading/read',{key:item.key,read:nextRead}).then(function(){
        if(revision!==inboxReadRevision)return;
        item.read=nextRead;var currentItem=inboxItems.find(function(point){return point.key===item.key;});if(currentItem)currentItem.read=nextRead;
        if(inboxSelectedKey===item.key)inboxSelectPoint(item.key,false);else inboxRenderRows();
        summaryLoadPoints(true);
      }).catch(function(e){read.disabled=false;summaryShowResult('已读状态保存失败：'+e.message,'failed');});
    });actions.appendChild(read);
    inboxRenderRows();inboxApplyView();if(explicit){summarySave();var mobile=inboxMobile();inboxN('inbox-detail-title').focus({preventScroll:!mobile});if(!mobile)inboxN('inbox-point-detail').parentElement.scrollTop=0;}
  }
  function inboxVisibleItems(){var query=inboxQuery.trim().toLocaleLowerCase();return inboxItems.filter(function(item){return !query||(item.group_name+' '+item.section+' '+summaryCleanText(item.text)).toLocaleLowerCase().includes(query);});}
  function inboxRenderRows(){
    if(inboxDashboardActive){inboxDashboardButtons.forEach(function(entry){entry.button.setAttribute('aria-pressed',String(entry.key===inboxSelectedKey));});return inboxItems;}
    var host=inboxN('summary-points');host.textContent='';var visible=inboxVisibleItems();
    if(!visible.length){if(inboxItems.length)host.appendChild(summaryNode('p','summary-empty','本页没有匹配的讨论'));else summaryEmpty(host,inboxN('summary-read-filter').value!=='all');}
    visible.forEach(function(item){var parts=inboxTextParts(item),row=summaryButton('',function(){inboxSelectPoint(item.key,true);},'inbox-row'+(item.read?'':' is-unread'));
      row.dataset.key=item.key;row.setAttribute('aria-pressed',String(item.key===inboxSelectedKey));
      row.appendChild(summaryNode('span','inbox-row-meta',item.group_name+' · '+(item.date_label||item.report_date)));
      row.appendChild(summaryNode('strong','inbox-row-title',parts.title));row.appendChild(summaryNode('span','inbox-row-preview',parts.body));row.appendChild(summaryNode('span','inbox-row-section',item.section));host.appendChild(row);
    });return visible;
  }
  function inboxRenderPoints(items){
    inboxDashboardActive=false;
    inboxItems=items;var visible=inboxVisibleItems();
    if(!visible.some(function(item){return item.key===inboxSelectedKey;})){inboxSelectedKey=null;inboxMobileOpen=false;}
    if(!inboxSelectedKey&&!inboxMobile()&&visible.length)inboxSelectedKey=visible[0].key;
    if(inboxSelectedKey)inboxSelectPoint(inboxSelectedKey,false);else{inboxRenderRows();inboxApplyView();}
  }
  function inboxFilterPage(value){inboxQuery=value;if(inboxDashboardActive){inboxFilterDashboard();return;}var visible=inboxVisibleItems();if(!visible.some(function(item){return item.key===inboxSelectedKey;})){inboxSelectedKey=null;inboxMobileOpen=false;}inboxRenderRows();inboxApplyView();}
  function inboxBeginDashboard(){inboxDashboardActive=true;inboxApplyView();}
  function inboxFilterDashboard(){var query=inboxQuery.trim().toLocaleLowerCase(),visible=0;inboxDashboardCards.forEach(function(entry){entry.card.hidden=!!query&&!entry.name.toLocaleLowerCase().includes(query);if(!entry.card.hidden)visible++;});var note=inboxN('inbox-dashboard-no-match');if(note)note.hidden=visible>0||!inboxDashboardCards.length;}
  function inboxRenderDashboard(data){
    var positions=new Map();if(inboxDashboardActive)inboxDashboardCards.forEach(function(entry){entry.rememberPosition();positions.set(entry.card.dataset.groupId,entry.scrollTop);});
    inboxDashboardActive=true;var selected=inboxItems.find(function(item){return item.key===inboxSelectedKey;}),revision=++inboxDashboardRevision,host=inboxN('summary-points');host.textContent='';inboxDashboardCards=[];inboxDashboardButtons=[];inboxItems=(inboxMobileOpen||summaryPointReference)&&selected?[selected]:[];
    var overview=summaryNode('div','summary-dashboard-overview');[['群聊',data.total],['摘要要点',data.point_total],['范围内未读',data.unread]].forEach(function(pair){var metric=summaryNode('div','summary-dashboard-metric');metric.appendChild(summaryNode('strong','',String(pair[1])));metric.appendChild(summaryNode('span','',pair[0]));overview.appendChild(metric);});host.appendChild(overview);
    var grid=summaryNode('div','summary-dashboard-grid');host.appendChild(grid);
    if(!data.items.length)summaryEmpty(grid,inboxN('summary-read-filter').value!=='all');
    data.items.forEach(function(group){
      var card=summaryNode('details','summary-group-stack'),heading=summaryNode('summary','summary-group-cover'),meta=summaryNode('div','summary-group-meta');card.dataset.groupId=String(group.group_id);
      meta.appendChild(summaryNode('span','summary-group-icon','群'));meta.appendChild(summaryNode('span','',group.unread?'有 '+group.unread+' 条未读':'全部已读'));heading.appendChild(meta);
      heading.appendChild(summaryNode('h2','summary-group-title',group.group_name));heading.appendChild(summaryNode('p','summary-group-preview',summaryCleanText((group.preview||[])[0]||'展开查看这个群的摘要要点')));
      var footer=summaryNode('div','summary-group-footer');footer.appendChild(summaryNode('span','',group.report_count+' 份摘要 · '+group.total+' 条要点'));var hint=summaryNode('span','summary-group-toggle');hint.setAttribute('aria-hidden','true');footer.appendChild(hint);heading.appendChild(footer);card.appendChild(heading);
      var body=summaryNode('div','summary-group-content');body.hidden=true;card.appendChild(body);grid.appendChild(card);var entry={card:card,name:group.group_name,scrollTop:positions.get(String(group.group_id))||0,rememberPosition:rememberPosition,restorePosition:restorePosition};inboxDashboardCards.push(entry);
      var loaded=false,loading=false,page=0,loadedItems=[],total=group.total,restoreScroll=positions.get(String(group.group_id));
      function current(){return revision===inboxDashboardRevision&&summaryView==='points';}
      function rememberPosition(){var list=body.children[0];if(list&&list.className==='summary-group-points'&&list.clientHeight>0)entry.scrollTop=list.scrollTop;}
      function restorePosition(){var list=body.children[0];if(restoreScroll!==undefined&&list&&list.className==='summary-group-points'&&list.clientHeight>0){list.scrollTop=restoreScroll;if(list.scrollTop>=restoreScroll)restoreScroll=undefined;}rememberPosition();}
      function renderContent(total){
        var list=body.children[0];
        if(!list||list.className!=='summary-group-points'){body.textContent='';list=summaryNode('div','summary-group-points');list.tabIndex=0;list.setAttribute('role','region');list.setAttribute('aria-label','本群摘要要点，可滚动查看更多');body.appendChild(list);}
        while(body.children.length>1)body.children[body.children.length-1].remove();
        loadedItems.slice(list.children.length).forEach(function(item){var parts=inboxTextParts(item),button=summaryButton('',function(){inboxSelectPoint(item.key,true);},'inbox-row');button.dataset.key=item.key;button.appendChild(summaryNode('span','inbox-row-meta',(item.date_label||item.report_date)+' · '+item.section+' · '+(item.read?'已读':'未读')));button.appendChild(summaryNode('strong','inbox-row-title',parts.title));button.appendChild(summaryNode('span','inbox-row-preview',parts.body));list.appendChild(button);inboxDashboardButtons.push({key:item.key,button:button});});
        restorePosition();
        if(!loadedItems.length)body.appendChild(summaryNode('p','header-meta','这个群暂无符合当前筛选的要点。'));
      }
      function load(next){
        if(loading||!current())return;loading=true;var advance=false;
        while(body.children.length&&body.children[body.children.length-1].className!=='summary-group-points')body.children[body.children.length-1].remove();
        var state=summaryValues(),params=new URLSearchParams({read_filter:state.read,group_id:String(group.group_id),page:String(next),page_size:'30'});if(!state.from&&!state.to)params.set('all_dates','true');else{params.set('date_from',state.from);params.set('date_to',state.to);}summaryReportKeyParams(params);if(summarySince)params.set('since',summarySince);
        var status=summaryNode('p','summary-group-load-status','正在读取本群要点…');body.appendChild(status);
        api('GET','/api/summary-reading?'+params).then(function(result){if(!current())return;var count=loadedItems.length,seen=new Set(loadedItems.map(function(item){return item.key;}));result.items.forEach(function(item){if(!seen.has(item.key)){seen.add(item.key);loadedItems.push(item);var at=inboxItems.findIndex(function(point){return point.key===item.key;});if(at<0)inboxItems.push(item);else inboxItems[at]=item;}});if(loadedItems.length===count&&loadedItems.length<result.total)throw new Error('本群要点发生变化，请重试或刷新筛选');loaded=true;page=result.page;total=result.total;renderContent(total);advance=loadedItems.length<total;}).catch(function(error){if(!current())return;status.textContent='读取失败：'+error.message;status.appendChild(summaryButton('重试',function(){status.remove();load(next);}));}).finally(function(){loading=false;if(advance&&current()&&card.open)load(page+1);});
      }
      card.addEventListener('toggle',function(){if(!current())return;body.hidden=!card.open;summaryExpanded['group:'+group.group_id]=card.open;summarySave();if(card.open&&!loading&&(!loaded||loadedItems.length<total))load(page+1);});
      if(summaryExpanded['group:'+group.group_id]){card.open=true;body.hidden=false;load(1);}
    });
    var noMatch=summaryNode('p','summary-dashboard-no-match','本页没有匹配的群聊。');noMatch.id='inbox-dashboard-no-match';noMatch.hidden=true;host.appendChild(noMatch);inboxFilterDashboard();inboxApplyView();
  }
  function inboxRenderGroups(groups){
    var host=inboxN('inbox-group-list');host.textContent='';inboxGroupButtons=[];
    [{group_id:'',name:'全部群聊'}].concat(groups).forEach(function(group){var value=String(group.group_id),button=summaryButton(group.name+(group.enabled===false?' · 已停用':''),function(){if(inboxN('report-group').value===value&&!summaryDetailActive&&!summaryPointReference)return;summarySelectGroups(value?[value]:[]);filterReports();},'inbox-group-button');
      host.appendChild(button);inboxGroupButtons.push({value:value,button:button});
    });inboxApplyView();
  }
  var inboxViewport=window.matchMedia('(max-width: 900px)');
  if(inboxViewport.addEventListener)inboxViewport.addEventListener('change',inboxApplyView);
</script>

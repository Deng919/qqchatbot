{% include "message_context_script.html" %}
<dialog id="attachment-dialog" aria-labelledby="attachment-title">
  <div class="card-header"><span id="attachment-title">群聊附件</span><button class="btn btn-sm" type="button" onclick="attachmentClose()">关闭</button></div>
  <p id="attachment-status" class="header-meta" role="status"></p>
  <div class="actions"><button id="attachment-read" class="btn btn-primary" type="button" onclick="attachmentRead()">读取待处理附件</button></div>
  <p class="header-meta">最近 200 条附件消息，每次最多读取 20 个。未下载的附件，请先在 QQ 下载。</p>
  <div id="attachment-items"></div>
</dialog>
<style>
#attachment-dialog{width:min(760px,calc(100vw - 32px));max-height:85vh;box-sizing:border-box;border:1px solid var(--border);border-radius:12px;background:var(--surface,#fff);color:var(--text);padding:24px;overflow-y:auto}#attachment-dialog::backdrop{background:#142b2760}.attachment-item{padding:18px 0;border-top:1px solid var(--border);overflow-wrap:anywhere}.attachment-item h3{font-size:15px;margin:0 0 8px}.attachment-item pre{font:inherit;white-space:pre-wrap;line-height:1.7}.attachment-item summary{cursor:pointer;color:var(--primary)}
@media(max-width:600px){ #attachment-dialog{padding:16px}.attachment-item h3{font-size:14px}}
</style>
<script>
var attachmentGroup=null,attachmentEpoch=0,attachmentBusy=false,attachmentReturn=null,attachmentContexts=[];
var attachmentLabels={success:'已读取',partial:'已读取 · 部分内容',pending:'待处理',missing:'需在 QQ 下载',unsupported:'暂不支持',error:'读取失败',disabled:'未开启',budget_paused:'调用已达上限'};
function attachmentNode(tag,text,cls){var n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;}
function attachmentClearContexts(){attachmentContexts.forEach(destroyMessageContext);attachmentContexts=[];}
function attachmentClose(){attachmentClearContexts();attachmentEpoch++;attachmentGroup=null;document.getElementById('attachment-dialog').close();if(attachmentReturn)attachmentReturn.focus();}
function attachmentRender(data){
  var c=data.counts||{};document.getElementById('attachment-status').textContent='已读取 '+((c.success||0)+(c.partial||0))+' · 待处理 '+(c.pending||0)+' · 需下载 '+(c.missing||0)+' · 失败 '+(c.error||0)+(c.budget_paused?' · 调用上限暂停 '+c.budget_paused:'')+(data.limited?' · 仅显示前 100 个':'');
  document.getElementById('attachment-read').disabled=attachmentBusy||!(data.read_images||data.read_files);
  attachmentClearContexts();var host=document.getElementById('attachment-items');host.textContent='';
  if(!data.items.length){host.appendChild(attachmentNode('p','暂无附件','header-meta'));return;}
  data.items.forEach(function(item){var card=attachmentNode('article',undefined,'attachment-item');card.appendChild(attachmentNode('h3',item.name));card.appendChild(attachmentNode('p',(item.kind==='image'?'图片':'文件')+' · '+(attachmentLabels[item.status]||'待处理')+' · '+new Date(item.at).toLocaleString('zh-CN'),'header-meta'));if(item.error)card.appendChild(attachmentNode('p',item.error,'header-meta'));if(item.text){var details=attachmentNode('details');details.appendChild(attachmentNode('summary','查看读取内容'));details.appendChild(attachmentNode('pre',item.text));card.appendChild(details);}var source=attachmentNode('button','关联的消息','btn btn-sm'),context=attachmentNode('div');source.type='button';context.hidden=true;var gid=attachmentGroup,epoch=attachmentEpoch;source.onclick=function(){context.hidden=!context.hidden;if(!context.hidden&&!context._messageContext){attachmentContexts.push(context);mountMessageContext(context,{groupId:gid,citedId:item.msg_id,url:'/api/search/messages/'+gid+'/'+encodeURIComponent(item.msg_id)+'/context',isCurrent:function(){return epoch===attachmentEpoch;}});}};card.appendChild(source);card.appendChild(context);host.appendChild(card);});
}
function attachmentOpen(id){
  if(!id)return;attachmentClearContexts();attachmentReturn=document.activeElement;attachmentGroup=id;var epoch=++attachmentEpoch,dialog=document.getElementById('attachment-dialog');if(!dialog.open)dialog.showModal();var g=configuredGroups.find(function(g){return g.group_id===id;});document.getElementById('attachment-title').textContent=(g?g.name:'群聊')+' · 附件';document.getElementById('attachment-items').textContent='';document.getElementById('attachment-status').textContent='正在加载…';document.getElementById('attachment-read').disabled=true;
  return api('GET','/api/groups/'+id+'/attachments').then(function(data){if(epoch===attachmentEpoch)attachmentRender(data);}).catch(function(e){if(epoch===attachmentEpoch)document.getElementById('attachment-status').textContent='加载失败：'+e.message;});
}
function attachmentRead(){
  if(attachmentBusy||!attachmentGroup)return;attachmentBusy=true;var id=attachmentGroup,epoch=attachmentEpoch;document.getElementById('attachment-read').disabled=true;document.getElementById('attachment-status').textContent='正在读取…';
  return api('POST','/api/groups/'+id+'/attachments/read',{}).then(function(data){if(epoch===attachmentEpoch){attachmentBusy=false;attachmentRender(data);}}).catch(function(e){if(epoch===attachmentEpoch){document.getElementById('attachment-status').textContent='读取失败：'+e.message;document.getElementById('attachment-read').disabled=false;}}).finally(function(){attachmentBusy=false;if(epoch!==attachmentEpoch&&attachmentGroup)attachmentOpen(attachmentGroup);});
}
document.getElementById('attachment-dialog').addEventListener('cancel',function(e){e.preventDefault();attachmentClose();});
</script>

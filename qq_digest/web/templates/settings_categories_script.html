<script>
  function showSettingsCategory(section,updateUrl) {
    if(!['ai','automatic','features','storage','backup'].includes(section))section='ai';
    document.querySelectorAll('[data-settings-panel]').forEach(function(panel){panel.hidden=panel.dataset.settingsPanel!==section;});
    document.querySelectorAll('[data-settings-section]').forEach(function(link){var selected=link.dataset.settingsSection===section;link.classList.toggle('active',selected);if(selected)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');});
    document.getElementById('desktop-required').hidden=!['automatic','storage','backup'].includes(section)||!document.getElementById('desktop-required').dataset.unavailable;
    if(updateUrl)history.replaceState(null,'','/settings?section='+section);
  }
  document.querySelectorAll('[data-settings-section]').forEach(function(link){link.addEventListener('click',function(event){if(link.dataset.settingsSection==='records'||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;event.preventDefault();showSettingsCategory(link.dataset.settingsSection,true);});});
  var settingsParams=new URLSearchParams(location.search);
  showSettingsCategory(settingsParams.has('feature')||settingsParams.get('saved')==='features'?'features':settingsParams.get('section')||'ai',false);
</script>

<script>
var topicsToken=0,topicsPageNumber=1,topicsDetailPageNumber=1,topicsCurrentId=null,topicsCurrent=null,topicsBusy=false,topicsRefreshing=false,topicsSourceToken=0,topicsEditToken=0,topicsEditContext=null,topicsTargetPage=1,topicsTargetsById={},topicsScroll=0;
function topicsEl(id){return document.getElementById(id);}
function topicsNode(tag,cls,text){var node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;}
function topicsButton(text,action){var node=topicsNode('button','btn btn-sm',text);node.type='button';node.onclick=action;return node;}
function topicsParams(){var p=new URLSearchParams({page:String(topicsPageNumber)});[['q','topics-q'],['group_id','topics-group'],['date_from','topics-from'],['date_to','topics-to'],['status','topics-filter-status']].forEach(function(pair){var value=topicsEl(pair[1]).value.trim();if(value)p.set(pair[0],value);});return p;}
function topicsUrl(){var p=topicsParams();if(topicsCurrentId!==null){p.set('topic_id',topicsCurrentId);p.set('discussion_page',topicsDetailPageNumber);}history.replaceState(null,'','/topics?'+p.toString());}
function topicsGroupNames(topic){return (topic.groups||[]).map(function(g){return g.name;}).join('、')||'来源群不可用';}
function topicsLoad(){
 var token=++topicsToken;topicsCurrentId=null;topicsCurrent=null;topicsCloseSource();topicsEl('topics-browse').hidden=false;topicsEl('topics-detail').hidden=true;topicsUrl();topicsEl('topics-count').textContent='正在读取话题…';
 return api('GET','/api/topics?'+topicsParams().toString()).then(function(data){if(token!==topicsToken)return;topicsPageNumber=data.page;topicsUrl();var host=topicsEl('topics-list');host.textContent='';topicsEl('topics-count').textContent='共 '+data.total+' 个话题';
 if(!data.topics.length){var empty=topicsNode('article','card topic-card');empty.appendChild(topicsNode('h2','','尚无符合条件的话题'));empty.appendChild(topicsNode('p','header-meta','先生成摘要，再点击“更新话题”；也可以清空筛选查看已有记录。'));host.appendChild(empty);}
 data.topics.forEach(function(topic){var card=topicsNode('article','card topic-card');card.appendChild(topicsNode('span','badge badge-dim',topic.status==='archived'?'已归档':'跟踪中'));card.appendChild(topicsNode('h2','',topic.title));card.appendChild(topicsNode('p','header-meta',topicsGroupNames(topic)+' · '+topic.first_date+' 至 '+topic.last_date+' · '+topic.discussion_count+' 次讨论'));card.appendChild(topicsNode('p','topic-progress',topic.latest_progress||'暂无当前版本的进展'));card.appendChild(topicsButton('查看进展',function(){topicsShow(topic.topic_id);}));host.appendChild(card);});topicsPagination('topics',data);
 }).catch(function(error){if(token!==topicsToken)return;topicsEl('topics-count').textContent='读取失败：'+error.message;topicsEl('topics-pages').hidden=true;});
}
function topicsPagination(prefix,data){var max=Math.max(1,Math.ceil(data.total/data.page_size));topicsEl(prefix+'-pages').hidden=max<=1;topicsEl(prefix+'-page-label').textContent='第 '+data.page+' / '+max+' 页';topicsEl(prefix+'-prev').disabled=data.page<=1;topicsEl(prefix+'-next').disabled=data.page>=max;}
function topicsFilter(event){event.preventDefault();topicsPageNumber=1;topicsLoad();}
function topicsPage(step){topicsPageNumber=Math.max(1,topicsPageNumber+step);topicsLoad();}
function topicsDetailPage(step){topicsShow(topicsCurrentId,Math.max(1,topicsDetailPageNumber+step));}
function topicsReturn(){topicsLoad();requestAnimationFrame(function(){window.scrollTo({top:topicsScroll,behavior:'instant'});});}
function topicsStatements(id,items,empty){var host=topicsEl(id);host.textContent='';if(!items.length){host.appendChild(topicsNode('p','header-meta',empty));return;}items.forEach(function(item){var p=topicsNode('p','topic-progress',item.text);host.appendChild(p);host.appendChild(topicsNode('p','header-meta',(item.group_name||'来源群')+' · '+(item.date_label||'对应摘要范围')));(item.source_ids||[]).forEach(function(msg,index){p.appendChild(topicsButton('原消息 '+(index+1),function(){topicsSource({discussion_id:item.discussion_id,group_id:item.group_id,group_name:item.group_name,date_label:item.date_label},msg);}));});});}
function topicsShow(id,page){
 var token=++topicsToken;if(topicsCurrentId===null)topicsScroll=window.scrollY;topicsCurrentId=id;topicsCurrent=null;topicsDetailPageNumber=page||1;topicsCloseSource();topicsEl('topics-browse').hidden=true;topicsEl('topics-detail').hidden=false;topicsEl('topics-title').textContent='正在读取…';topicsEl('topics-meta').textContent='';topicsEl('topics-timeline').textContent='';topicsEl('topics-actions').textContent='';topicsEl('topics-conclusions').textContent='';topicsEl('topics-questions').textContent='';topicsEl('topics-detail-pages').hidden=true;topicsUrl();
 return api('GET','/api/topics/'+id+'?page='+topicsDetailPageNumber).then(function(topic){if(token!==topicsToken)return;topicsCurrent=topic;topicsDetailPageNumber=topic.page;topicsUrl();topicsEl('topics-title').textContent=topic.title;topicsEl('topics-meta').textContent=topicsGroupNames(topic)+' · '+topic.discussion_count+' 条讨论记录 · '+(topic.status==='archived'?'已归档':'跟踪中');var actions=topicsEl('topics-actions');actions.appendChild(topicsButton('更名',function(){topicsOpenEdit('rename');}));actions.appendChild(topicsButton('合并到其他话题',function(){topicsOpenEdit('merge');}));actions.appendChild(topicsButton(topic.status==='archived'?'重新跟踪':'归档话题',topicsSetStatus));
 topicsStatements('topics-conclusions',topic.latest_conclusions||[],'暂无可核实的结论');topicsStatements('topics-questions',topic.open_questions||[],'暂无有来源的问题记录');var timeline=topicsEl('topics-timeline');if(!topic.discussions.length)timeline.appendChild(topicsNode('p','header-meta','暂无讨论记录'));
 topic.discussions.forEach(function(d){var card=topicsNode('article','card topics-timeline-item'+(d.is_current?'':' is-history'));card.appendChild(topicsNode('p','header-meta',d.group_name+' · '+d.date_label+' · '+(d.evidence_status==='unavailable'?'来源不可核实':d.is_current?'当前摘要':'旧版记录')+' · '+(d.link_mode==='manual'?'人工关联':'自动关联')));card.appendChild(topicsNode('h3','',d.title));card.appendChild(topicsNode('p','topic-progress',d.summary));var controls=topicsNode('div','topics-actions');var report=topicsNode('a','btn btn-sm',d.is_current?'打开摘要':'打开当前摘要');report.href='/reports?'+new URLSearchParams({kind:d.report_kind,id:d.report_id}).toString();controls.appendChild(report);(d.source_ids||[]).forEach(function(msg,index){controls.appendChild(topicsButton('原消息 '+(index+1),function(){topicsSource(d,msg);}));});if(!(d.source_ids||[]).length)card.appendChild(topicsNode('p','header-meta',d.evidence_status==='legacy'?'旧摘要未记录逐条来源':'来源待核实'));controls.appendChild(topicsButton('关联到其他话题',function(){topicsOpenEdit('move',d);}));controls.appendChild(topicsButton('拆为新话题',function(){topicsOpenEdit('split',d);}));card.appendChild(controls);timeline.appendChild(card);});topicsPagination('topics-detail',topic);
 }).catch(function(error){if(token!==topicsToken)return;topicsEl('topics-title').textContent='话题暂时无法打开';topicsEl('topics-meta').textContent=error.message;topicsEl('topics-actions').appendChild(topicsButton('重试',function(){topicsShow(id,page);}));});
}
function topicsRefresh(){
 if(topicsRefreshing||topicsBusy)return;topicsRefreshing=true;topicsEl('topics-refresh').disabled=true;topicsEl('topics-status').textContent='正在整理本地摘要，请稍候…';var token=topicsToken;
 return api('POST','/api/topics/refresh').then(function(data){topicsEl('topics-status').textContent='已检查 '+data.reports_processed+' 份摘要'+(data.skipped_reports?'；'+data.skipped_reports+' 份无法读取，保留旧记录并标记不可核实':'')+'。';if(token!==topicsToken)return;if(topicsCurrentId!==null)return topicsShow(topicsCurrentId,topicsDetailPageNumber);return topicsLoad();}).catch(function(error){topicsEl('topics-status').textContent='话题更新失败：'+error.message+'；已保存内容保留，可再次点击更新。';}).finally(function(){topicsRefreshing=false;topicsEl('topics-refresh').disabled=false;});
}
function topicsSource(d,msg){var token=++topicsSourceToken;topicsEl('topics-source-scope').textContent=(d.group_name||'原消息来源')+' · '+(d.date_label||'对应讨论范围')+'；上下文可超出摘要日期。';var dialog=topicsEl('topics-source-dialog');if(!dialog.open)dialog.showModal();mountMessageContext(topicsEl('topics-source-body'),{groupId:d.group_id,citedId:msg,url:'/api/topic-discussions/'+d.discussion_id+'/sources/'+encodeURIComponent(msg),isCurrent:function(){return token===topicsSourceToken&&dialog.open;}});}
function topicsCloseSource(){topicsSourceToken++;var dialog=topicsEl('topics-source-dialog');destroyMessageContext(topicsEl('topics-source-body'));topicsEl('topics-source-body').textContent='';if(dialog.open)dialog.close();}
function topicsCloseEdit(){topicsEditToken++;if(topicsEl('topics-edit-dialog').open)topicsEl('topics-edit-dialog').close();}
function topicsOpenEdit(kind,discussion){
 if(topicsBusy||!topicsCurrent)return;topicsEditToken++;topicsEditContext={kind:kind,topic:topicsCurrent,discussion:discussion,viewToken:topicsToken};topicsTargetsById={};topicsTargetPage=1;topicsEl('topics-edit-error').textContent='';topicsEl('topics-edit-submit').disabled=false;topicsEl('topics-edit-title').value=kind==='split'?discussion.title:topicsCurrent.title;topicsEl('topics-target-query').value='';topicsEl('topics-target').textContent='';topicsEl('topics-suggestions').textContent='';topicsEl('topics-edit-title-field').hidden=kind==='merge'||kind==='move';topicsEl('topics-target-field').hidden=kind==='rename'||kind==='split';topicsEl('topics-edit-heading').textContent={rename:'更改话题名称',merge:'合并话题',move:'重新关联讨论',split:'拆为新话题'}[kind];topicsEl('topics-edit-note').textContent=kind==='merge'?'此话题的全部讨论将移到目标话题，目标保留名称和跟踪状态。':kind==='move'||kind==='split'?'仅移动这条讨论；以后的更新保留你的纠正。':'名称变更保留全部来源和进展。';var dialog=topicsEl('topics-edit-dialog');if(!dialog.open)dialog.showModal();
 if(kind==='merge'||kind==='move')topicsTargets(1);if(kind==='move'){var token=topicsEditToken;api('GET','/api/topic-discussions/'+discussion.discussion_id+'/suggestions').then(function(data){if(token!==topicsEditToken)return;var host=topicsEl('topics-suggestions');if(!data.suggestions.length){host.textContent='没有高相似度建议，也可自行选择。';return;}host.textContent='可能相关，请核对后选择：';data.suggestions.forEach(function(topic){host.appendChild(topicsButton(topic.title,function(){topicsTargetsById[topic.topic_id]=topic;var option=topicsNode('option','',topic.title);option.value=String(topic.topic_id);topicsEl('topics-target').appendChild(option);topicsEl('topics-target').value=String(topic.topic_id);}));});}).catch(function(error){if(token===topicsEditToken)topicsEl('topics-suggestions').textContent='建议读取失败：'+error.message;});}
}
function topicsTargets(page){
 if(topicsBusy||!topicsEditContext)return;var token=++topicsEditToken;topicsTargetsById={};topicsTargetPage=Math.max(1,page);topicsEl('topics-target').disabled=true;topicsEl('topics-edit-submit').disabled=true;var p=new URLSearchParams({page:topicsTargetPage,page_size:100,q:topicsEl('topics-target-query').value.trim()});
 return api('GET','/api/topics?'+p.toString()).then(function(data){if(token!==topicsEditToken)return;topicsTargetPage=data.page;topicsTargetsById={};var select=topicsEl('topics-target');select.textContent='';data.topics.filter(function(topic){return topic.topic_id!==topicsEditContext.topic.topic_id;}).forEach(function(topic){topicsTargetsById[topic.topic_id]=topic;var option=topicsNode('option','',topic.title+' · '+topic.discussion_count+' 次讨论');option.value=String(topic.topic_id);select.appendChild(option);});if(select.options.length)select.value=select.options[0].value;var max=Math.max(1,Math.ceil(data.total/data.page_size));topicsEl('topics-target-page-label').textContent='第 '+data.page+' / '+max+' 页';topicsEl('topics-target-prev').disabled=data.page<=1;topicsEl('topics-target-next').disabled=data.page>=max;topicsEl('topics-edit-submit').disabled=!select.options.length;select.disabled=false;topicsEl('topics-edit-error').textContent=select.options.length?'':'本页没有其他话题，请查找或翻页。';}).catch(function(error){if(token!==topicsEditToken)return;topicsEl('topics-edit-error').textContent='目标读取失败：'+error.message+'；可再次查找重试。';});
}
function topicsSubmit(event){
 event.preventDefault();if(topicsBusy||!topicsEditContext||topicsEl('topics-edit-submit').disabled)return;var ctx=topicsEditContext,kind=ctx.kind,body,url,method=kind==='merge'?'POST':'PATCH';
 if(kind==='rename'){body={title:topicsEl('topics-edit-title').value.trim(),expected_revision:ctx.topic.revision};url='/api/topics/'+ctx.topic.topic_id;if(!body.title){topicsEl('topics-edit-error').textContent='请填写话题名称';return;}}
 else if(kind==='split'){body={new_title:topicsEl('topics-edit-title').value.trim(),expected_revision:ctx.discussion.revision};url='/api/topic-discussions/'+ctx.discussion.discussion_id;if(!body.new_title){topicsEl('topics-edit-error').textContent='请填写新话题名称';return;}}
 else {var target=topicsTargetsById[topicsEl('topics-target').value];if(!target){topicsEl('topics-edit-error').textContent='请选择目标话题';return;}body={target_topic_id:target.topic_id,expected_revision:kind==='merge'?ctx.topic.revision:ctx.discussion.revision};if(kind==='merge')body.target_revision=target.revision;url=kind==='merge'?'/api/topics/'+ctx.topic.topic_id+'/merge':'/api/topic-discussions/'+ctx.discussion.discussion_id;}
 topicsBusy=true;topicsEl('topics-edit-submit').disabled=true;topicsEl('topics-edit-error').textContent='正在保存…';return api(method,url,body).then(function(data){topicsCloseEdit();topicsEl('topics-status').textContent='已保存，后续更新保留这次修改。';if(ctx.viewToken===topicsToken)topicsShow(data.topic_id||ctx.topic.topic_id);}).catch(function(error){topicsEl('topics-edit-error').textContent=error.message+(error.status===409?'；请关闭编辑，重新打开进展后再操作。':'；输入已保留，可重试。');}).finally(function(){topicsBusy=false;topicsEl('topics-edit-submit').disabled=false;});
}
function topicsSetStatus(){if(topicsBusy||!topicsCurrent)return;var ctx=topicsCurrent,token=topicsToken;topicsBusy=true;return api('PATCH','/api/topics/'+ctx.topic_id,{status:ctx.status==='archived'?'tracking':'archived',expected_revision:ctx.revision}).then(function(data){topicsEl('topics-status').textContent=data.status==='archived'?'话题已归档，记录继续保留。':'已重新跟踪。';if(token===topicsToken)topicsShow(ctx.topic_id);}).catch(function(error){topicsEl('topics-status').textContent='保存失败：'+error.message;}).finally(function(){topicsBusy=false;});}
(function(){var p=new URLSearchParams(location.search);topicsPageNumber=Math.max(1,Number(p.get('page'))||1);[['q','topics-q'],['date_from','topics-from'],['date_to','topics-to'],['status','topics-filter-status']].forEach(function(pair){if(p.has(pair[0]))topicsEl(pair[1]).value=p.get(pair[0]);});var group=p.get('group_id');if(group){var option=topicsNode('option','','群 '+group);option.value=group;topicsEl('topics-group').appendChild(option);topicsEl('topics-group').value=group;}var id=Number(p.get('topic_id'));if(Number.isInteger(id)&&id>0){topicsCurrentId=id;topicsDetailPageNumber=Math.max(1,Number(p.get('discussion_page'))||1);}api('GET','/api/groups').then(function(data){var select=topicsEl('topics-group');data.groups.forEach(function(g){var option=Array.from(select.options).find(function(o){return o.value===String(g.group_id);});if(!option){option=topicsNode('option','',g.name);option.value=String(g.group_id);select.appendChild(option);}option.textContent=g.name;});}).catch(function(){});topicsEl('topics-source-dialog').addEventListener('cancel',function(e){e.preventDefault();topicsCloseSource();});topicsEl('topics-edit-dialog').addEventListener('cancel',function(e){e.preventDefault();topicsCloseEdit();});topicsRefresh();})();
</script>

{% extends "base.html" %}
{% block title %}全局搜索 - QQ Digest{% endblock %}
{% block page_title %}全局搜索{% endblock %}
{% block page_description %}在归档消息、摘要报告和已入库知识中查找，并查看消息原文。{% endblock %}
{% block content %}
<form class="filter-toolbar search-toolbar" id="search-form" onsubmit="submitSearch(event)">
  <div class="field search-query"><label for="search-q">搜索内容</label><input class="input" id="search-q" type="search" minlength="2" maxlength="100" placeholder="输入至少两个字" required></div>
  <div class="field"><label for="search-kind">范围</label><select id="search-kind"><option value="all">全部内容</option><option value="message">聊天消息</option><option value="report">摘要报告</option><option value="knowledge">已入库知识</option></select></div>
  <div class="field"><label for="search-group">来源群</label><select id="search-group"><option value="">全部群</option></select></div>
  <div class="field"><label for="search-from">开始日期</label><input class="input" id="search-from" type="date"></div>
  <div class="field"><label for="search-to">结束日期</label><input class="input" id="search-to" type="date"></div>
  <button class="btn btn-primary" type="submit">搜索</button>
</form>
<section class="card search-card" aria-live="polite">
  <div class="card-header">搜索结果 <span class="header-meta" id="search-count">输入关键词开始搜索</span></div>
  <div id="search-results"><div class="empty">可搜索本地归档的聊天消息、报告正文和已确认的知识条目。</div></div>
  <div class="search-pages" id="search-pages" hidden><button class="btn btn-sm" id="search-prev" type="button" onclick="searchPage(-1)">上一页</button><span id="search-page-label"></span><button class="btn btn-sm" id="search-next" type="button" onclick="searchPage(1)">下一页</button></div>
</section>
<style>
  .search-toolbar { grid-template-columns: minmax(240px, 2fr) repeat(4, minmax(130px, 1fr)) auto; align-items: end; }
  .search-card { min-height: 280px; }
  .search-result { padding: 17px 0; border-bottom: 1px solid var(--border); }
  .search-result:last-child { border-bottom: 0; }
  .search-result-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .search-result-title { color: var(--text); font-weight: 700; text-decoration: none; }
  .search-result-title:hover { color: var(--primary); text-decoration: underline; }
  .search-result-meta { margin-top: 5px; color: var(--text-dim); font-size: 12px; }
  .search-result-snippet { margin: 11px 0; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
  .search-context { margin-top: 12px; padding: 10px 14px; background: var(--surface-subtle); border: 1px solid var(--border); border-radius: 9px; }
  .search-context-row { padding: 9px 0; border-bottom: 1px solid var(--border); }
  .search-context-row:last-child { border: 0; }
  .search-context-row.is-match { padding-left: 10px; border-left: 3px solid var(--primary); }
  .search-context-meta { margin-bottom: 3px; color: var(--text-dim); font-size: 11px; }
  .search-context-text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .search-pages { display: flex; gap: 12px; align-items: center; justify-content: flex-end; margin-top: 16px; color: var(--text-soft); font-size: 12px; }
  @media(max-width: 1080px) { .search-toolbar { grid-template-columns: repeat(3, minmax(0, 1fr)); } .search-query { grid-column: span 2; } }
  @media(max-width: 700px) { .search-toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); } .search-query { grid-column: 1 / -1; } .search-toolbar button { grid-column: 1 / -1; } }
</style>
<script>
  var currentSearchPage = 1, searchToken = 0;
  function searchParams() {
    var p = new URLSearchParams();
    p.set('q', document.getElementById('search-q').value.trim());
    p.set('kind', document.getElementById('search-kind').value);
    var values = {group_id: 'search-group', date_from: 'search-from', date_to: 'search-to'};
    Object.keys(values).forEach(function(key) { var value = document.getElementById(values[key]).value; if (value) p.set(key, value); });
    p.set('page', currentSearchPage); return p;
  }
  function submitSearch(event) { event.preventDefault(); currentSearchPage = 1; loadSearch(); }
  function searchPage(step) { currentSearchPage += step; loadSearch(); window.scrollTo({top: 0, behavior: 'smooth'}); }
  function renderSearchResult(item) {
    var labels = {message: '消息', report: '报告', knowledge: '知识'};
    var reviewHidden = featureFlags.review === false && item.kind === 'knowledge';
    var heading = item.url && !reviewHidden ? '<a class="search-result-title" href="' + escapeHtml(item.url) + '">' + escapeHtml(item.title) + '</a>' : '<strong class="search-result-title">' + escapeHtml(item.title) + '</strong>';
    var taskHref = '/tasks?' + new URLSearchParams({group_id: String(Number(item.group_id)), msg_id: String(item.id)}).toString();
    var action = item.kind === 'message' ? '<button class="btn btn-sm" type="button" data-group="' + Number(item.group_id) + '" data-message="' + escapeHtml(item.id) + '" onclick="showSearchContext(this)">查看上下文</button> <a class="btn btn-sm" href="' + escapeHtml(taskHref) + '">加入待办</a>' : '<a class="btn btn-sm" href="' + escapeHtml(item.url) + '">查看详情</a>';
    if (featureFlags.tasks === false) action = action.replace(/ <a class="btn btn-sm"[^>]*>加入待办<\/a>/, '');
    if (reviewHidden) action = '<span class="header-meta">知识记录已保留；如需整理，可在设置中开启审核。</span>';
    return '<article class="search-result"><div class="search-result-head"><span class="badge badge-dim">' + labels[item.kind] + '</span>' + heading + '</div><div class="search-result-meta">' + escapeHtml(item.group_name) + ' · ' + escapeHtml(item.date) + '</div><p class="search-result-snippet">' + escapeHtml(item.snippet) + '</p>' + action + '<div class="search-context" hidden></div></article>';
  }
  function loadSearch() {
    var params = searchParams(), q = params.get('q');
    if (q.length < 2) { toast('请输入至少两个字', 'error'); return; }
    var token = ++searchToken;
    document.getElementById('search-count').textContent = '搜索中...';
    api('GET', '/api/search?' + params.toString()).then(function(data) {
      if (token !== searchToken) return;
      document.getElementById('search-count').textContent = '共 ' + formatNumber(data.total) + ' 条';
      document.getElementById('search-results').innerHTML = data.results.length ? data.results.map(renderSearchResult).join('') : '<div class="empty">没有找到匹配内容，可调整关键词或筛选范围。</div>';
      var pages = document.getElementById('search-pages'); pages.hidden = data.total <= data.page_size;
      document.getElementById('search-page-label').textContent = '第 ' + data.page + ' / ' + Math.max(1, Math.ceil(data.total / data.page_size)) + ' 页';
      document.getElementById('search-prev').disabled = data.page <= 1;
      document.getElementById('search-next').disabled = data.page * data.page_size >= data.total;
      history.replaceState(null, '', '/search?' + params.toString());
    }).catch(function(error) { document.getElementById('search-count').textContent = '搜索失败'; toast(error.message, 'error'); });
  }
  function showSearchContext(button) {
    var host = button.closest('.search-result').querySelector('.search-context');
    if (!host.hidden) { host.hidden = true; button.textContent = '查看上下文'; return; }
    button.disabled = true;
    api('GET', '/api/search/messages/' + button.dataset.group + '/' + encodeURIComponent(button.dataset.message) + '/context').then(function(data) {
      host.innerHTML = data.messages.map(function(row) { return '<div class="search-context-row' + (row.msg_id === button.dataset.message ? ' is-match' : '') + '"><div class="search-context-meta">' + escapeHtml(new Date(row.timestamp).toLocaleString('zh-CN')) + ' · ' + escapeHtml(row.sender_qq || '未知发送者') + '</div><div class="search-context-text">' + escapeHtml(row.text) + '</div></div>'; }).join('');
      host.hidden = false; button.textContent = '收起上下文';
    }).catch(function(error) { toast('读取上下文失败：' + error.message, 'error'); }).finally(function() { button.disabled = false; });
  }
  (function restoreSearch() {
    var p = new URLSearchParams(location.search);
    var fields = {q: 'search-q', kind: 'search-kind', date_from: 'search-from', date_to: 'search-to'};
    Object.keys(fields).forEach(function(key) { if (p.has(key)) document.getElementById(fields[key]).value = p.get(key); });
    currentSearchPage = Math.max(1, Number(p.get('page')) || 1);
    api('GET', '/api/groups').then(function(data) {
      var select = document.getElementById('search-group');
      data.groups.forEach(function(group) { var option = document.createElement('option'); option.value = group.group_id; option.textContent = group.name; select.appendChild(option); });
      if (p.has('group_id')) select.value = p.get('group_id');
    }).catch(function() {}).finally(function() { if ((p.get('q') || '').trim().length >= 2) loadSearch(); });
  })();
</script>
{% endblock %}

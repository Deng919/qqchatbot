<script>
var knowledgeToken=0,knowledgePageNumber=1,knowledgeItemId=null,knowledgeScroll=0,knowledgeSourceToken=0;
function knowledgeNode(tag,cls,text){var n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function knowledgeButton(text,action){var b=knowledgeNode('button','btn btn-sm',text);b.type='button';b.onclick=action;return b;}
function knowledgeParams(){var p=new URLSearchParams({page:String(knowledgePageNumber)});[['q','knowledge-q'],['group_id','knowledge-group'],['item_type','knowledge-type']].forEach(function(pair){var value=document.getElementById(pair[1]).value.trim();if(value)p.set(pair[0],value);});return p;}
function knowledgeUrl(){var p=knowledgeParams();if(knowledgeItemId!==null)p.set('item_id',knowledgeItemId);history.replaceState(null,'','/knowledge?'+p.toString());}
function knowledgeCancelSource(){knowledgeSourceToken++;destroyMessageContext(document.getElementById('knowledge-source-body'));document.getElementById('knowledge-source-body').textContent='';}
function knowledgeFilter(event){event.preventDefault();knowledgePageNumber=1;knowledgeLoad();}
function knowledgePage(step){knowledgePageNumber+=step;knowledgeLoad();}
function knowledgeLoad(){
 var token=++knowledgeToken;knowledgeItemId=null;knowledgeCancelSource();document.getElementById('knowledge-browse').hidden=false;document.getElementById('knowledge-detail').hidden=true;knowledgeUrl();var host=document.getElementById('knowledge-list');host.setAttribute('aria-busy','true');document.getElementById('knowledge-count').textContent='正在读取知识库…';
 return api('GET','/api/knowledge?'+knowledgeParams().toString()).then(function(data){if(token!==knowledgeToken)return;var max=Math.max(1,Math.ceil(data.total/data.page_size));if(knowledgePageNumber>max){knowledgePageNumber=max;return knowledgeLoad();}host.textContent='';document.getElementById('knowledge-count').textContent='共 '+data.total+' 条已入库知识';
 if(!data.items.length){var empty=knowledgeNode('div','knowledge-item');empty.appendChild(knowledgeNode('h2','','暂无匹配条目'));empty.appendChild(knowledgeButton('清空筛选',function(){['knowledge-q','knowledge-group','knowledge-type'].forEach(function(id){document.getElementById(id).value='';});knowledgePageNumber=1;knowledgeLoad();}));host.appendChild(empty);}
 data.items.forEach(function(item){var card=knowledgeNode('article','knowledge-item');card.appendChild(knowledgeNode('span','badge badge-dim',item.item_type==='resource'?'资源':'经验'));card.appendChild(knowledgeNode('h2','',item.title));card.appendChild(knowledgeNode('p','header-meta',item.group_name+' · 原消息日期 '+item.date+' · 保存于 '+new Date(item.saved_at).toLocaleString('zh-CN')));card.appendChild(knowledgeNode('p','knowledge-preview',item.preview));card.appendChild(knowledgeButton('查看知识',function(){knowledgeShow(item.item_id);}));host.appendChild(card);});document.getElementById('knowledge-pages').hidden=data.total<=data.page_size;document.getElementById('knowledge-page-label').textContent='第 '+data.page+' / '+max+' 页';document.getElementById('knowledge-prev').disabled=data.page<=1;document.getElementById('knowledge-next').disabled=data.page>=max;
 }).catch(function(e){if(token!==knowledgeToken)return;host.textContent='读取失败：'+e.message;host.appendChild(knowledgeButton('重试',knowledgeLoad));document.getElementById('knowledge-pages').hidden=true;document.getElementById('knowledge-count').textContent='知识库读取失败';}).finally(function(){if(token===knowledgeToken)host.removeAttribute('aria-busy');});
}
function knowledgeShow(id){
 var token=++knowledgeToken;if(knowledgeItemId===null)knowledgeScroll=window.scrollY;knowledgeItemId=id;knowledgeCancelSource();knowledgeUrl();document.getElementById('knowledge-browse').hidden=true;var detail=document.getElementById('knowledge-detail');detail.hidden=false;detail.setAttribute('aria-busy','true');document.getElementById('knowledge-title').textContent='正在读取…';document.getElementById('knowledge-meta').textContent='';document.getElementById('knowledge-body').textContent='';document.getElementById('knowledge-sources').hidden=true;
 return api('GET','/api/knowledge/'+id).then(function(item){if(token!==knowledgeToken)return;document.getElementById('knowledge-title').textContent=item.title;document.getElementById('knowledge-meta').textContent=(item.item_type==='resource'?'资源':'经验')+' · '+item.group_name+' · '+item.date;var body=document.getElementById('knowledge-body');if(item.reason)body.appendChild(knowledgeNode('p','knowledge-content','保存说明：'+item.reason));if(item.link&&/^https?:\/\//.test(item.link)){var link=knowledgeNode('a','',item.link);link.href=item.link;link.target='_blank';link.rel='noopener noreferrer';body.appendChild(link);}body.appendChild(knowledgeNode('div','knowledge-content',item.content||item.excerpt||'这条旧知识没有记录完整正文，可查看原消息。'));
 document.getElementById('knowledge-sources').hidden=false;var cited=item.source_context.filter(function(row){return row.is_cited;});document.getElementById('knowledge-source-note').textContent=item.missing_source_count?item.missing_source_count+' 条来源不可用；已保存内容保留。':'本地原消息';var choices=document.getElementById('knowledge-source-choices');choices.textContent='';cited.forEach(function(row,index){choices.appendChild(knowledgeButton('来源 '+(index+1),function(){knowledgeSource(item,row.msg_id);}));});if(cited.length)knowledgeSource(item,cited[0].msg_id);detail.scrollIntoView({block:'start',behavior:'instant'});
 }).catch(function(e){if(token!==knowledgeToken)return;document.getElementById('knowledge-title').textContent='知识暂时无法打开';var body=document.getElementById('knowledge-body');body.textContent=e.message;body.appendChild(knowledgeButton('重试',function(){knowledgeShow(id);}));}).finally(function(){if(token===knowledgeToken)detail.removeAttribute('aria-busy');});
}
function knowledgeSource(item,msgId){var token=++knowledgeSourceToken;mountMessageContext(document.getElementById('knowledge-source-body'),{groupId:item.group_id,citedId:msgId,url:'/api/knowledge/'+item.item_id+'/sources/'+encodeURIComponent(msgId),isCurrent:function(){return token===knowledgeSourceToken&&knowledgeItemId===item.item_id;}});}
function knowledgeReturn(){knowledgeLoad();requestAnimationFrame(function(){window.scrollTo({top:knowledgeScroll,behavior:'instant'});});}
(function(){var p=new URLSearchParams(location.search);knowledgePageNumber=Math.max(1,Number(p.get('page'))||1);[['q','knowledge-q'],['item_type','knowledge-type']].forEach(function(pair){if(p.has(pair[0]))document.getElementById(pair[1]).value=p.get(pair[0]);});var group=p.get('group_id');if(group){var option=knowledgeNode('option','','群 '+group);option.value=group;document.getElementById('knowledge-group').appendChild(option);document.getElementById('knowledge-group').value=group;}
 api('GET','/api/groups').then(function(data){var select=document.getElementById('knowledge-group');data.groups.forEach(function(g){var option=Array.from(select.options).find(function(o){return o.value===String(g.group_id);});if(!option){option=knowledgeNode('option','',g.name);option.value=g.group_id;select.appendChild(option);}option.textContent=g.name;});}).catch(function(){});var id=Number(p.get('item_id'));if(Number.isInteger(id)&&id>0)knowledgeShow(id);else knowledgeLoad();})();
</script>

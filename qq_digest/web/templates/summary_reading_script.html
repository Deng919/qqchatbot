<script>
  var summaryView='points', summaryPointPage=1, summaryPointToken=0, summarySince;
  var summaryExpanded={}, summaryBrowseScroll=0, summaryPendingScroll=null, summarySourceToken=0, summarySourceOpener=null;
  var summarySaved=null, summaryStorageKey='qq-digest-summary-reading-v1',summaryDetailActive=false,summaryReportOpener=null,summaryPointReference=null;
  var summaryPreviousReading=null,summaryGeneratedReading=null,summaryNavigationToken=0,summarySinceRevision=0;
  function summaryNode(tag,cls,text) { var n=document.createElement(tag); if(cls)n.className=cls; if(text!==undefined)n.textContent=text; return n; }
  function summaryCleanText(text) {
    return String(text||'').replace(/\s*(?:〔原消息\s*[：:][^〕]*〕|\[原消息\s*[：:][^\]]*\]|【原消息\s*[：:][^】]*】)/g,'').replace(/\*\*([^\n]+?)\*\*/g,'$1').replace(/\[([^\]\n]+)\]\(((?:[^()\s]|\([^()\s]*\))+)\)/g,'$1 ($2)').trim();
  }
  function summaryButton(text,action,cls) { var b=summaryNode('button',cls||'btn btn-sm',text); b.type='button'; b.onclick=action; return b; }
  function summarySelectGroups(ids){var value=ids.join(','),select=document.getElementById('report-group');if(value&&!Array.from(select.options).some(function(option){return option.value===value;})){var option=summaryNode('option','',value==='__empty__'?'请选择摘要群聊':ids.length>1?'已选 '+ids.length+' 个群':'群 '+value);option.value=value;select.appendChild(option);}select.value=value;}
  function summaryReportKeyParams(params){if(summaryGeneratedReading&&summaryGeneratedReading.keys){var state=summaryValues();if(state.group===summaryGeneratedReading.group&&state.from===summaryGeneratedReading.from&&state.to===summaryGeneratedReading.to)summaryGeneratedReading.keys.forEach(function(key){params.append('report_keys',key);});}}
  function summaryGroupParams(params,value){if(value==='__empty__'){params.set('group_ids','__empty__');return;}if(!value)return;if(value.includes(','))value.split(',').forEach(function(id){params.append('group_ids',id);});else params.set('group_id',value);}
  function summaryScrollHost(){return window.matchMedia&&window.matchMedia('(min-width: 901px)').matches?document.getElementById(summaryView==='manage'?'report-layout':'summary-reading-section').parentElement:null;}
  function summaryScrollPosition(){var host=summaryScrollHost();return host?(host.clientHeight===0?summaryBrowseScroll:host.scrollTop):window.scrollY;}
  function summaryScrollTo(top){var host=summaryScrollHost();if(host)host.scrollTop=top;else window.scrollTo({top:top,behavior:'instant'});}
  function summaryValues() { return {point:summaryPointReference,view:summaryView,group:document.getElementById('report-group').value,from:document.getElementById('report-from').value,to:document.getElementById('report-to').value,kind:document.getElementById('report-kind').value,read:document.getElementById('summary-read-filter').value,pointPage:summaryPointPage,reportPage:reportPage,since:summarySince,expanded:summaryExpanded,scroll:summaryPendingScroll!==null?summaryPendingScroll:document.getElementById('report-detail').hidden?summaryScrollPosition():summaryBrowseScroll}; }
  function summarySave() {
    if(window.workspaceHistoryRestoring)return;
    var state=summaryValues(); try { sessionStorage.setItem(summaryStorageKey,JSON.stringify(Object.assign({},state,{previousReading:summaryPreviousReading,generatedReading:summaryGeneratedReading}))); } catch(e) {}
    var url=new URL(location.href); [['view',state.view],['date_from',state.from],['date_to',state.to],['report_kind',state.kind],['read',state.read]].forEach(function(pair){if(pair[1])url.searchParams.set(pair[0],pair[1]);else url.searchParams.delete(pair[0]);});
    if(!state.from&&!state.to)url.searchParams.set('all_dates','true');else url.searchParams.delete('all_dates');
    url.searchParams.delete('group_id');url.searchParams.delete('group_ids');summaryGroupParams(url.searchParams,state.group);history.replaceState(Object.assign({},history.state,{qqDigestReading:Object.assign({},state,{previousReading:summaryPreviousReading,generatedReading:summaryGeneratedReading})}),'',url.pathname+url.search);
  }
  function summaryHistoryPush(){if(typeof workspaceHistoryPush==='function')workspaceHistoryPush();}
  function summaryBackInScope(){
    if(typeof workspaceHistoryTarget!=='function'||typeof workspaceGo!=='function')return false;
    var entry=workspaceHistoryTarget(-1);if(!entry)return false;
    var previous=new URL(entry.url),current=new URL(location.href),fields=['view','group_id','group_ids','date_from','date_to','report_kind','read','all_dates'];
    if(previous.pathname!==current.pathname||fields.some(function(key){return previous.searchParams.getAll(key).join(',')!==current.searchParams.getAll(key).join(',');}))return false;
    workspaceGo(-1);return true;
  }
  function summaryBackFromReport(){if(summaryBackInScope())return;closeReport();if(summaryPointReference&&inboxItems.some(function(item){return item.key===summaryPointReference.key;})){inboxMobileOpen=true;inboxSelectPoint(summaryPointReference.key,false);summarySave();}else inboxBackToList();}
  function summaryRestorePoint(open){
    var reference=summaryPointReference;if(!reference||typeof inboxReadRevision==='undefined')return Promise.resolve();
    var revision=inboxReadRevision;
    function current(){return revision===inboxReadRevision&&summaryPointReference===reference;}
    function load(page){
      var params=new URLSearchParams({all_dates:'true',read_filter:'all',group_id:String(reference.group_id),report_keys:reference.report_kind+':'+reference.report_id,page:String(page),page_size:'100'});
      return api('GET','/api/summary-reading?'+params).then(function(data){
        if(!current())return;
        var item=data.items.find(function(point){return point.key===reference.key;});
        if(!item){if(data.items.length&&data.page*data.page_size<data.total)return load(page+1);throw new Error('这条要点已不存在或暂时不可用');}
        var at=inboxItems.findIndex(function(point){return point.key===item.key;});if(at<0)inboxItems.push(item);else inboxItems[at]=item;
        inboxMobileOpen=open;inboxSelectPoint(item.key,false,open&&!summaryDetailActive);summarySave();
      });
    }
    return load(1).catch(function(error){if(!current())return;summaryShowResult('要点恢复失败：'+error.message,'failed');document.getElementById('summary-run-actions').appendChild(summaryButton('重试',function(){summaryRestorePoint(open);}));});
  }
  function summaryApplyView() {
    document.getElementById('summary-reading-controls').hidden=summaryDetailActive;
    ['points','groups','manage'].forEach(function(view){var button=document.getElementById('summary-'+view+'-tab');button.classList.toggle('active',summaryView===view);button.setAttribute('aria-pressed',String(summaryView===view));});
    document.getElementById('summary-kind-field').hidden=summaryView==='points';
    document.getElementById('summary-all-dates').hidden=false;
    document.getElementById('summary-return-reading').hidden=!summaryPreviousReading;
    document.getElementById('summary-feed-tools').hidden=summaryView!=='points';
    document.getElementById('summary-points').hidden=summaryDetailActive||summaryView!=='points';
    document.getElementById('summary-groups').hidden=summaryDetailActive||summaryView!=='groups';
    document.getElementById('summary-reading-section').hidden=summaryDetailActive||summaryView==='manage';
    document.getElementById('report-table-card').hidden=summaryDetailActive||summaryView!=='manage';
    var dates=recentWeekDates(),from=document.getElementById('report-from').value,to=document.getElementById('report-to').value;
    var select=document.getElementById('report-group'),group=select.value,ids=group?group.split(','):[],option=Array.from(select.options).find(function(item){return item.value===group;});
    var groupLabel=!group?'全部群聊':group==='__empty__'?'请选择群聊':ids.length>1?'已选 '+ids.length+' 个群':option?option.textContent:'群 '+group;
    document.getElementById('summary-scope-label').textContent='群聊与日期 · '+groupLabel+' · '+(!from&&!to?'全部日期':from===to?from:(from||'不限')+' 至 '+(to||'不限'));
    document.querySelectorAll('[data-summary-days]').forEach(function(b){var active=b.dataset.summaryDays==='today'?from===dates.end&&to===dates.end:from===dates.start&&to===dates.end;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});

  function summaryCancelDetail(){if(typeof inboxClearSelection==='function')inboxClearSelection(true);summaryNavigationToken++;summaryPointToken++;reportLoadToken++;closeReport();if(!document.getElementById('summary-source-panel').hidden)summaryCloseSource();}
  function summarySetView(view) { if(!['points','groups','manage'].includes(view))return; if(view!==summaryView||summaryDetailActive||summaryPointReference)summaryHistoryPush();summaryCancelDetail();summaryView=view; summaryPointToken++;reportLoadToken++;summaryPendingScroll=null;summaryApplyView();summarySave();loadReports(); }
  function summarySetDates(mode) { var d=recentWeekDates(),from=mode==='today'?d.end:d.start;if(!summaryDetailActive&&!summaryPointReference&&document.getElementById('report-from').value===from&&document.getElementById('report-to').value===d.end)return;document.getElementById('report-from').value=from;document.getElementById('report-to').value=d.end;refreshDateHints();filterReports(); }
  function summaryChangeDate(changed) {
    var from=document.getElementById('report-from'),to=document.getElementById('report-to');
    if(from.value&&to.value&&from.value>to.value){if(changed==='from')to.value=from.value;else from.value=to.value;}
    refreshDateHints();filterReports();
  }
  function summaryAllDates() { document.getElementById('report-from').value='';document.getElementById('report-to').value='';refreshDateHints();filterReports(); }
  function summaryReturnToReading(){
    if(!summaryPreviousReading)return;summaryHistoryPush();var saved=summaryPreviousReading;summaryCancelDetail();summaryPreviousReading=null;summaryGeneratedReading=null;
    summaryView=['points','groups','manage'].includes(saved.view)?saved.view:'points';summarySelectGroups(saved.group?saved.group.split(','):[]);
    document.getElementById('report-from').value=saved.from;document.getElementById('report-to').value=saved.to;document.getElementById('report-kind').value=saved.kind;document.getElementById('summary-read-filter').value=saved.read;
    summaryPointPage=saved.pointPage;reportPage=saved.reportPage;summarySinceRevision++;summarySince=saved.since;summaryExpanded=saved.expanded||{};summaryPendingScroll=saved.scroll;summaryPointToken++;reportLoadToken++;refreshDateHints();summaryApplyView();summarySave();loadReports();
  }
  function summaryFilterPoints() { summaryHistoryPush();summaryCancelDetail();summaryPointPage=1;summarySave();summaryLoadPoints(); }
  function summaryChangePage(step) { summaryHistoryPush();summaryCancelDetail();if(summaryView==='points'){summaryPointPage+=step;summaryLoadPoints();}else{reportPage+=step;loadReports();}summarySave(); }
  function summaryPages(data) {
    var page=data.page,total=data.total,limit=data.page_size,max=Math.max(1,Math.ceil(total/limit));
    document.getElementById('summary-reading-pages').hidden=total<=limit;
    document.getElementById('summary-reading-page-label').textContent='第 '+page+' / '+max+' 页';
    document.getElementById('summary-reading-prev').disabled=page<=1;document.getElementById('summary-reading-next').disabled=page>=max;
  }
  function summaryRestoreScroll() { if(summaryPendingScroll!==null&&!summaryDetailActive){var y=summaryPendingScroll;summaryPendingScroll=null;requestAnimationFrame(function(){summaryScrollTo(y);});} }
  function summaryEmpty(host,filtered) {
    var box=summaryNode('div','summary-empty');box.appendChild(summaryNode('h2','',filtered?'没有匹配的要点':'当前范围暂无摘要'));
    var actions=summaryNode('div','actions');
    if(filtered)actions.appendChild(summaryButton('查看全部要点',function(){document.getElementById('summary-read-filter').value='all';summaryFilterPoints();}));
    else actions.appendChild(summaryButton('选择范围并生成',function(){openRangeSummary();},'btn btn-primary'));
    actions.appendChild(summaryButton('查看最近七天',function(){summarySetDates('week');}));
    if(summaryView==='points')actions.appendChild(summaryButton('按群阅读',function(){summarySetView('groups');}));
    box.appendChild(actions);host.appendChild(box);
  }
  function summaryEmptySelection(){
    if(document.getElementById('report-group').value!=='__empty__')return false;
    summaryPointToken++;reportLoadToken++;
    if(typeof inboxClearSelection==='function')inboxClearSelection();
    ['summary-points','summary-groups'].forEach(function(id){var host=document.getElementById(id);host.textContent='';var box=summaryNode('div','summary-empty');box.appendChild(summaryNode('p','','所选群不在普通摘要范围，请重新选择群聊。'));box.appendChild(summaryButton('选择全部摘要群',function(){summarySelectGroups([]);filterReports();}));host.appendChild(box);});
    document.getElementById('report-list').innerHTML='<tr><td colspan="7" class="empty">所选群不在普通摘要范围，请重新选择群聊。</td></tr>';
    ['summary-reading-pages','report-pages','summary-reading-warning'].forEach(function(id){document.getElementById(id).hidden=true;});
    document.getElementById('summary-reading-count').textContent='请选择摘要群聊';document.getElementById('report-count').textContent='0 份';
    summarySave();return true;
  }
  function summaryLoadPoints(keepScroll) {
    if(summaryEmptySelection())return;
    var token=++summaryPointToken,host=document.getElementById('summary-points'),state=summaryValues();
    if((!!state.from!==!!state.to)||state.from>state.to){summaryShowResult('请选择完整的日期范围，开始日期不能晚于结束日期。','failed');if(!host.children.length)host.textContent='请选择有效日期后重试。';document.getElementById('summary-reading-pages').hidden=true;return;}
    if(keepScroll)summaryPendingScroll=summaryScrollPosition();
    host.setAttribute('aria-busy','true');
    if(typeof inboxBeginDashboard==='function')inboxBeginDashboard();
    var p=new URLSearchParams({read_filter:state.read,page:String(summaryPointPage),grouped:'true'});if(!state.from&&!state.to)p.set('all_dates','true');else{p.set('date_from',state.from);p.set('date_to',state.to);}summaryGroupParams(p,state.group);summaryReportKeyParams(p);if(summarySince)p.set('since',summarySince);
    api('GET','/api/summary-reading?'+p.toString()).then(function(data){
      if(token!==summaryPointToken||summaryView!=='points')return;
      if(keepScroll)summaryPendingScroll=summaryScrollPosition();
      var last=Math.max(1,Math.ceil(data.total/data.page_size));if(summaryPointPage>last){summaryPointPage=last;return summaryLoadPoints(keepScroll);}
      document.getElementById('summary-reading-count').textContent=data.grouped?'当前筛选 '+data.total+' 个群 · '+data.point_total+' 条要点':'当前筛选 '+data.total+' 条要点 · 此日期和群范围有 '+data.unread+' 条未读';
      var warning=document.getElementById('summary-reading-warning');warning.hidden=!data.skipped_reports;warning.textContent=data.skipped_reports+' 份摘要文件缺失或无法读取，未纳入阅读。';
      if(data.grouped&&typeof inboxRenderDashboard==='function'){inboxRenderDashboard(data);summaryPages(data);summarySave();summaryRestoreScroll();return;}
      host.textContent='';
      if(typeof inboxRenderPoints==='function'){inboxRenderPoints(data.items);summaryPages(data);summarySave();summaryRestoreScroll();return;}
      if(!data.items.length)summaryEmpty(host,state.read!=='all');
      data.items.forEach(function(item){
        var card=summaryNode('article','summary-item'+(item.read?' is-read':''));card.dataset.key=item.key;
        var meta=summaryNode('div','summary-item-meta');meta.appendChild(summaryNode('strong','',item.group_name));meta.appendChild(summaryNode('span','',item.date_label||item.report_date));meta.appendChild(summaryNode('span','badge badge-dim',item.section));meta.appendChild(summaryNode('span','badge '+(item.read?'badge-dim':'badge-blue'),item.read?'已读':'未读'));card.appendChild(meta);
        var cleanText=summaryCleanText(item.text),split=cleanText.match(/^([^\n：。！？]{1,48})[：。！？\n]/),title=split?split[1]:cleanText.slice(0,48),body=split?cleanText.slice(split[0].length):cleanText;
        card.appendChild(summaryNode('h2','',title));var text=summaryNode('p','summary-item-body',body||cleanText);var long=cleanText.length>160||cleanText.split('\n').length>4;
        if(long&&!summaryExpanded[item.key])text.classList.add('is-collapsed');if(body||!split)card.appendChild(text);
        if(long){var expand=summaryButton(summaryExpanded[item.key]?'收起':'展开全文',function(){var open=!summaryExpanded[item.key];summaryExpanded[item.key]=open;text.classList.toggle('is-collapsed',!open);expand.textContent=open?'收起':'展开全文';summarySave();});expand.setAttribute('aria-expanded',String(!!summaryExpanded[item.key]));expand.addEventListener('click',function(){expand.setAttribute('aria-expanded',String(!!summaryExpanded[item.key]));});card.appendChild(expand);}
        var footer=summaryNode('div','summary-item-footer');if(item.status==='cited'&&item.source_ids.length)footer.appendChild(summaryButton('关联的消息',function(){summaryOpenSource(item,this);}));else footer.appendChild(summaryNode('span','header-meta',item.status==='legacy'?'旧报告未记录逐条来源':'这条要点未提供有效来源'));
        footer.appendChild(summaryButton('完整摘要',function(){viewReport(item.report_kind||'daily',Number(item.report_id));}));
        appendBookmarkAction(footer,{kind:'report',report_kind:item.report_kind||'daily',report_id:Number(item.report_id),point_key:item.key});
        var read=summaryButton(item.read?'标为未读':'标为已读',function(){read.disabled=true;api('POST','/api/summary-reading/read',{key:item.key,read:!item.read}).then(function(){summaryLoadPoints(true);}).catch(function(e){read.disabled=false;summaryShowResult('已读状态保存失败：'+e.message,'failed');});},'btn btn-sm summary-read-button');footer.appendChild(read);card.appendChild(footer);host.appendChild(card);
      });summaryPages(data);summarySave();summaryRestoreScroll();
    }).catch(function(e){if(token!==summaryPointToken)return;summaryShowResult('要点读取失败：'+e.message+(host.children.length?'；已保留上次结果。':''),'failed');if(!host.children.length)host.textContent='要点暂时无法读取。';document.getElementById('summary-run-actions').appendChild(summaryButton('重试',function(){summaryLoadPoints();}));document.getElementById('summary-reading-pages').hidden=true;}).finally(function(){if(token===summaryPointToken)host.removeAttribute('aria-busy');});
  }
  function summaryRenderGroups(data) {
    if(summaryView!=='groups')return;var host=document.getElementById('summary-groups');host.textContent='';
    document.getElementById('summary-reading-count').textContent='共 '+data.total+' 份摘要 · 按群和日期阅读';document.getElementById('summary-reading-warning').hidden=true;
    if(!data.reports.length)summaryEmpty(host,false);
    data.reports.forEach(function(report){var card=summaryNode('article','summary-item');var meta=summaryNode('div','summary-item-meta');meta.appendChild(summaryNode('strong','',report.group_name));card.appendChild(meta);
      card.appendChild(summaryNode('h2','',report.window_start_date===report.window_end_date?report.window_start_date:report.window_start_date+' 至 '+report.window_end_date));
      var preview=report.preview||{};var body=summaryNode('p','summary-item-body is-collapsed',preview.available?(summaryCleanText(preview.overview)||'这份摘要未记录概览，请阅读下方要点或打开完整摘要。'):'预览不可用，请打开完整摘要。');card.appendChild(body);
      var list=null;if(preview.available&&preview.points&&preview.points.length){list=summaryNode('ul','summary-preview-points is-collapsed');preview.points.forEach(function(point){list.appendChild(summaryNode('li','',summaryCleanText(point)));});card.appendChild(list);}
      if(String(preview.overview||'').length>160||String(preview.overview||'').split('\n').length>4||(preview.points||[]).some(function(point){return point.length>120||point.split('\n').length>2;})){var expand=summaryButton('展开预览',function(){var collapsed=body.classList.toggle('is-collapsed');if(list)list.classList.toggle('is-collapsed',collapsed);expand.textContent=collapsed?'展开预览':'收起预览';expand.setAttribute('aria-expanded',String(!collapsed));});expand.setAttribute('aria-expanded','false');card.appendChild(expand);}
      var footer=summaryNode('div','summary-item-footer');footer.appendChild(summaryNode('span','header-meta','更新于 '+new Date(report.created_at).toLocaleString('zh-CN')));footer.appendChild(summaryButton('阅读完整摘要',function(){viewReport(report.report_kind,Number(report.report_id));}));card.appendChild(footer);host.appendChild(card);
    });summaryPages(data);summarySave();summaryRestoreScroll();
  }
  function summaryEnterDetail(data,kind,id) {
    if(window.workspaceHistoryRestoring)return;
    var current=new URLSearchParams(location.search);if(current.get('kind')!==kind||current.get('id')!==String(id))summaryHistoryPush();
    summaryDetailActive=true;summarySave();summaryApplyView();
    document.getElementById('summary-report-title').textContent=data.group_name+' · '+data.window_start_date+(data.window_start_date===data.window_end_date?'':' 至 '+data.window_end_date);
    var url=new URL(location.href);url.searchParams.set('kind',kind);url.searchParams.set('id',id);history.replaceState(history.state,'',url.pathname+url.search);document.getElementById('report-detail').scrollIntoView({block:'start',behavior:'instant'});
  }
  function summaryLeaveDetail() {
    if(window.workspaceHistoryRestoring)return;
    summaryDetailActive=false;document.getElementById('summary-reading-controls').hidden=false;summaryApplyView();var url=new URL(location.href);url.searchParams.delete('kind');url.searchParams.delete('id');history.replaceState(history.state,'',url.pathname+url.search);requestAnimationFrame(function(){if(summaryReportOpener&&summaryReportOpener.isConnected)summaryReportOpener.focus({preventScroll:true});summaryScrollTo(summaryBrowseScroll);summarySave();});
  }
  function summaryOpenSource(item,opener) {
    summarySourceOpener=opener;document.getElementById('summary-source-panel').hidden=false;document.getElementById('summary-source-backdrop').hidden=false;
    document.getElementById('summary-source-scope').textContent=item.group_name+' · '+(item.date_label||item.report_date);
    document.getElementById('summary-source-choices').textContent='';
    var token=++summarySourceToken,host=document.getElementById('summary-source-messages');
    mountRelatedMessages(host,{groupId:item.group_id,sourceIds:item.source_ids,version:item.current_version,
      url:'/api/reports/'+(item.report_kind||'daily')+'/'+item.report_id+'/related-messages',
      isCurrent:function(){return token===summarySourceToken&&!document.getElementById('summary-source-panel').hidden;}});
    document.getElementById('summary-source-close').focus();
  }
  function summaryCloseSource() { summarySourceToken++;destroyMessageContext(document.getElementById('summary-source-messages'));document.getElementById('summary-source-panel').hidden=true;document.getElementById('summary-source-backdrop').hidden=true;if(summarySourceOpener&&summarySourceOpener.isConnected)summarySourceOpener.focus(); }
  function summaryShowResult(message,status,action) { var result=document.getElementById('summary-run-result');result.hidden=false;result.dataset.status=status||'success';document.getElementById('summary-run-message').textContent=message;var actions=document.getElementById('summary-run-actions');actions.textContent='';if(action)actions.appendChild(summaryButton('阅读新摘要',action,'btn btn-primary')); }
  function summaryRenderMarkdown(markdown) {
    var host=document.getElementById('report-content');host.textContent='';var paragraph=[],list=null,code=null;
    function flush(){if(paragraph.length){host.appendChild(summaryNode('p','',paragraph.join('\n')));paragraph=[];}list=null;}
    String(markdown||'').split('\n').forEach(function(line){
      if(line.trim().startsWith('```')){flush();if(code){code=null;}else{code=summaryNode('pre','');host.appendChild(code);}return;}
      if(code){code.textContent+=line+'\n';return;}
      line=summaryCleanText(line);
      var heading=line.match(/^(#{1,6})\s+(.+)$/);if(heading){flush();host.appendChild(summaryNode('h'+Math.min(heading[1].length+1,6),'',heading[2]));return;}
      var bullet=line.match(/^\s*[-*]\s+(.+)$/);if(bullet){if(paragraph.length)flush();if(!list){list=summaryNode('ul','');host.appendChild(list);}list.appendChild(summaryNode('li','',bullet[1]));return;}
      if(!line.trim()){flush();return;}if(list)list=null;paragraph.push(line);
    });flush();
  }
  function summaryReadDailyResults(data) { closeReport();document.getElementById('summary-read-filter').value='all';document.getElementById('report-group').value='';var day=data.report_date;if(/^\d{4}-\d{2}-\d{2}$/.test(day||'')){document.getElementById('report-from').value=day;document.getElementById('report-to').value=day;refreshDateHints();}else{var dates=recentWeekDates();document.getElementById('report-from').value=dates.start;document.getElementById('report-to').value=dates.end;refreshDateHints();}summarySetView('points');filterReports();document.getElementById('summary-points').scrollIntoView({block:'start',behavior:'instant'}); }
  function summaryReadRangeResults(start,end,groups,keys) { if(!Array.isArray(keys)||!keys.length||keys.some(function(key){return !/^(daily|range):[1-9][0-9]*$/.test(key);})){summaryShowResult('本次摘要标识不可用，请从运行记录核对。','failed');return;} var before=summaryValues();if(!summaryPreviousReading||!summaryGeneratedReading||before.group!==summaryGeneratedReading.group||before.from!==summaryGeneratedReading.from||before.to!==summaryGeneratedReading.to){summaryPreviousReading=JSON.parse(JSON.stringify(before));}summaryGeneratedReading={group:groups.join(','),from:start,to:end,keys:Array.from(new Set(keys))};document.getElementById('report-kind').value='all';document.getElementById('summary-read-filter').value='all';document.getElementById('report-from').value=start;document.getElementById('report-to').value=end;summarySelectGroups(groups.map(String));summaryView='points';refreshDateHints();filterReports(true);closeRangeSummary(); }
  function summaryRefreshGroups(){
    return api('GET','/api/groups?scope=summary').then(function(data){
      var select=document.getElementById('report-group'),current=select.value,eligible=new Set(data.groups.map(function(g){return String(g.group_id);}));
      function normalizeGroup(value){if(!value)return '';var selected=value.split(',').filter(function(id){return eligible.has(id);});return selected.length?selected.join(','):'__empty__';}
      Array.from(select.options).forEach(function(option){if(option.value&&option.value!=='__empty__'&&String(option.value).split(',').some(function(id){return !eligible.has(id);}))option.remove();});
      data.groups.forEach(function(g){var option=Array.from(select.options).find(function(option){return option.value===String(g.group_id);});if(option)option.textContent=g.name;else{option=summaryNode('option','',g.name);option.value=String(g.group_id);select.appendChild(option);}});
      current=normalizeGroup(current);summarySelectGroups(current?current.split(','):[]);
      if(summaryPreviousReading)summaryPreviousReading.group=normalizeGroup(summaryPreviousReading.group);
      if(summaryGeneratedReading)summaryGeneratedReading.group=normalizeGroup(summaryGeneratedReading.group);
      summaryApplyView();summarySave();
      if(typeof inboxRenderGroups==='function')inboxRenderGroups(data.groups);
    }).catch(function(){summaryShowResult('群聊筛选加载失败，请刷新重试。','failed');});
  }
  function summaryInit() {
    try{summarySaved=JSON.parse(sessionStorage.getItem(summaryStorageKey)||'null');}catch(e){}
    var saved=(history.state&&history.state.qqDigestReading)||summarySaved||{},url=new URLSearchParams(location.search),dates=recentWeekDates(),navigationToken=summaryNavigationToken,sinceRevision=summarySinceRevision;
    summaryPreviousReading=saved.previousReading||null;summaryGeneratedReading=saved.generatedReading||null;var point=saved.point;summaryPointReference=point&&typeof point.key==='string'&&Number.isSafeInteger(Number(point.group_id))&&Number(point.group_id)>0&&['daily','range'].includes(point.report_kind)&&Number.isSafeInteger(Number(point.report_id))&&Number(point.report_id)>0?{key:point.key,group_id:Number(point.group_id),report_kind:point.report_kind,report_id:Number(point.report_id)}:null;
    summaryView=url.get('view')||saved.view||'points';if(!['points','groups','manage'].includes(summaryView))summaryView='points';
    document.getElementById('report-from').value=url.has('date_from')?url.get('date_from'):(saved.from!==undefined?saved.from:dates.end);document.getElementById('report-to').value=url.has('date_to')?url.get('date_to'):(saved.to!==undefined?saved.to:dates.end);
    if(url.get('all_dates')==='true'){document.getElementById('report-from').value='';document.getElementById('report-to').value='';}
    document.getElementById('report-kind').value=url.get('report_kind')||saved.kind||'all';document.getElementById('summary-read-filter').value=url.get('read')||saved.read||'all';if(!document.getElementById('summary-read-filter').value)document.getElementById('summary-read-filter').value='all';
    summaryPointPage=Number.isInteger(saved.pointPage)&&saved.pointPage>0?saved.pointPage:1;reportPage=Number.isInteger(saved.reportPage)&&saved.reportPage>0?saved.reportPage:1;summaryExpanded=saved.expanded&&typeof saved.expanded==='object'?saved.expanded:{};summaryPendingScroll=Number.isFinite(saved.scroll)?saved.scroll:null;summaryBrowseScroll=summaryPendingScroll||0;
    var group=url.has('group_ids')?url.getAll('group_ids').join(','):url.has('group_id')?url.get('group_id'):saved.group||'';summarySelectGroups(group?group.split(','):[]);
    if(summaryPointReference){var scope=summaryValues(),differentScope=summaryView!=='points'||['group','from','to','kind','read'].some(function(key){return String(scope[key]||'')!==String(saved[key]||'');}),differentReport=url.has('kind')&&(url.get('kind')!==summaryPointReference.report_kind||Number(url.get('id'))!==summaryPointReference.report_id);if(differentScope||differentReport)summaryPointReference=null;}
    refreshDateHints();summaryApplyView();
    var groups=summaryRefreshGroups();
    var navigation=performance.getEntriesByType('navigation')[0],restoreVisit=((history.state&&history.state.qqDigestReading)||(navigation&&navigation.type==='reload'))&&saved.since!==undefined;
    if(restoreVisit)summarySince=saved.since;
    var newOption=document.getElementById('summary-read-filter').querySelector('option[value="new"]'),waitForVisit=document.getElementById('summary-read-filter').value==='new';newOption.disabled=!restoreVisit;
    var visitPending=null,visitAcquired=false;
    function readVisit(){if(visitAcquired)return Promise.resolve(true);if(visitPending)return visitPending;visitPending=api('GET','/api/summary-reading/visit',undefined,{retryBusy:true}).then(function(data){
      if(sinceRevision!==summarySinceRevision)return false;
      if(!data||!Object.prototype.hasOwnProperty.call(data,'previous_viewed_at'))throw new Error('上次打开时间响应无效');
      summarySince=restoreVisit?saved.since:data.previous_viewed_at;visitAcquired=true;newOption.disabled=false;summarySave();
      // Recording this opening is optional for the current read and may wait for maintenance.
      api('POST','/api/summary-reading/visit',{viewed_at:data.viewed_at},{retryBusy:true}).catch(function(){});
      if(document.getElementById('summary-run-message').textContent==='新增筛选暂不可用'){document.getElementById('summary-run-result').hidden=true;document.getElementById('summary-run-actions').textContent='';}
      if(navigationToken!==summaryNavigationToken&&summaryView==='points'&&document.getElementById('summary-read-filter').value==='new')summaryLoadPoints();return true;
    }).catch(function(error){
      if(sinceRevision!==summarySinceRevision){newOption.disabled=false;return false;}
      if(restoreVisit){visitAcquired=true;newOption.disabled=false;return true;}
      if(error.status===401)return false;
      if(document.getElementById('summary-read-filter').value==='new')document.getElementById('summary-read-filter').value='all';summaryShowResult('新增筛选暂不可用','failed');
      document.getElementById('summary-run-actions').appendChild(summaryButton('重试',function(){if(this.disabled)return;var button=this;button.disabled=true;var reopen=waitForVisit&&document.getElementById('summary-read-filter').value==='all';readVisit().then(function(ready){if(ready&&reopen&&summaryView==='points'){document.getElementById('summary-read-filter').value='new';summaryFilterPoints();}}).finally(function(){button.disabled=false;});}));return false;
    }).finally(function(){visitPending=null;});return visitPending;}
    var visit=readVisit();
    return Promise.all([groups,waitForVisit?visit:Promise.resolve()]).then(function(){if(navigationToken!==summaryNavigationToken)return;loadReports();var kind=url.get('kind'),id=Number(url.get('id'));var full=['daily','range'].includes(kind)&&Number.isInteger(id)&&id>0;if(full)viewReport(kind,id);else if(url.get('generate')==='1')openRangeSummary();if(summaryView==='points'&&summaryPointReference)summaryRestorePoint(!full);});
  }
  window.addEventListener('qq-digest-workspace-restore',function(){summaryCancelDetail();summaryDetailActive=false;summarySinceRevision++;summaryInit();});
  window.addEventListener('pagehide',summarySave);document.addEventListener('keydown',function(event){if(event.key==='Escape'&&!document.getElementById('summary-source-panel').hidden)summaryCloseSource();});
  summaryInit();
</script>

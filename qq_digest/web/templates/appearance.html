<script id="appearance-init">
(function(){
  var key='qq-digest-theme',choices=['system','light','dark'],preference='dark';
  var system=window.matchMedia('(prefers-color-scheme: dark)');
  try{var saved=localStorage.getItem(key);if(choices.includes(saved))preference=saved;}catch(error){}
  function apply(value,persist){
    preference=choices.includes(value)?value:'dark';
    var resolved=preference==='system'?(system.matches?'dark':'light'):preference;
    document.documentElement.dataset.theme=resolved;
    document.documentElement.style.colorScheme=resolved;
    document.querySelectorAll('[data-theme-choice]').forEach(function(input){input.checked=input.value===preference;});
    if(persist){try{localStorage.setItem(key,preference);}catch(error){}}
  }
  apply(preference,false);
  document.addEventListener('DOMContentLoaded',function(){
    document.querySelectorAll('[data-theme-choice]').forEach(function(input){
      input.checked=input.value===preference;input.addEventListener('change',function(){if(input.checked)apply(input.value,true);});
    });
  });
  system.addEventListener('change',function(){if(preference==='system')apply(preference,false);});
  window.addEventListener('storage',function(event){if(event.key===key||event.key===null)apply(event.newValue,false);});
})();
</script>

<script>
(function(){
  'use strict';
  var state=null,busy=true,groups=[],viewToken=0,pollTimer=null;
  function el(id){return document.getElementById('setup-'+id);}
  function node(tag,text,cls){var n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n;}
  function notice(text,error){el('status').textContent=text;el('status').toggleAttribute('data-error',!!error);el('reload').hidden=!error;}
  function setBusy(value){busy=value;el('fields').disabled=value||!state||!state.available;el('root').setAttribute('aria-busy',String(value));document.querySelectorAll('[data-setup-step]').forEach(function(b){b.disabled=value;});}
  function apply(data,fill){state=data;el('pause').hidden=!data.active;el('finish').hidden=data.completed;el('open-reports').hidden=!data.completed;el('open-search').hidden=!data.completed;
    el('key-status').textContent=data.ai.key_configured?'已保存密钥':'';el('bridge-note').textContent=data.ai.bridge_available?'已找到本机桥接程序':'本机桥接程序未找到，可使用兼容 API';
    if(fill){el('source').value=data.ntqq.db_dir;el('qq').value=data.ntqq.qq_number||'';el('start').value=data.start_date;el('end').value=data.end_date;el('provider').value=data.ai.provider;el('url').value=data.ai.base_url;el('model').value=data.ai.provider==='chatgpt_bridge'?(data.ai.bridge_model||''):data.ai.model;el('interval').value=data.schedule.interval_minutes;el('time').value=String(data.schedule.hour).padStart(2,'0')+':'+String(data.schedule.minute).padStart(2,'0');el('auto-collect').checked=data.schedule.auto_collection&&data.ntqq.qq_number>0;el('auto-daily').checked=data.schedule.auto_daily&&data.ai_ready;el('existing').open=!!data.ntqq.db_dir;}
    providerOptions();renderImports();
  }
  function providerOptions(){var bridge=el('provider').value==='chatgpt_bridge';el('api-options').hidden=bridge;el('bridge-note').hidden=!bridge;el('model').placeholder=bridge?'留空自动选择':'填写服务支持的模型名称';}
  async function run(action,message){if(busy)return false;setBusy(true);notice(message||'正在处理…');try{await action();if(el('status').textContent===(message||'正在处理…'))notice('已读取。');return true;}catch(error){notice(error.message,true);return false;}finally{setBusy(false);}}
  async function write(action,payload){var data=await api('POST','/api/setup/'+action,Object.assign({expected_revision:state.revision},payload||{}));apply(data,false);return data;}
  async function show(next){var token=++viewToken;document.querySelectorAll('[data-setup-panel]').forEach(function(p){p.hidden=Number(p.dataset.setupPanel)!==next;});document.querySelectorAll('[data-setup-step]').forEach(function(b){if(Number(b.dataset.setupStep)===next)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
    if(next===2){var data=await api('GET','/api/setup/groups');if(token!==viewToken)return;groups=data.groups;renderGroups();}
    if(next===5){el('auto-collect').disabled=state.ntqq.qq_number<=0;el('auto-daily').disabled=!state.ai_ready;if(el('auto-collect').disabled)el('auto-collect').checked=false;if(el('auto-daily').disabled)el('auto-daily').checked=false;el('schedule-note').textContent='程序运行时执行。'+(state.ntqq.qq_number<=0?' 自动采集需填写 QQ 账号。':'')+(!state.ai_ready?' 自动日报需先通过 AI 连接测试。':'');}
    if(next===6){var preview=await api('GET','/api/setup/preview');if(token===viewToken)renderPreview(preview);}
  }
  function renderGroups(){var host=el('group-list'),query=el('group-filter').value.toLowerCase();var selected=new Set(Array.from(host.querySelectorAll('input:checked')).map(function(i){return Number(i.value);}));if(!host.children.length)state.selected_groups.forEach(function(id){selected.add(id);});host.textContent='';groups.forEach(function(g){var label=node('label','','setup-group-row');label.hidden=!(g.name+' '+g.group_id).toLowerCase().includes(query);var input=document.createElement('input');input.type='checkbox';input.value=g.group_id;input.checked=selected.has(g.group_id);label.appendChild(input);label.appendChild(node('span',g.name+' · '+g.group_id));label.appendChild(node('small','近 30 天 '+g.message_count_30d+' 条'));host.appendChild(label);});if(!groups.length)host.appendChild(node('p','没有找到群聊，请重新读取 QQ 数据。'));}
  function groupName(id){var g=groups.find(function(g){return g.group_id===id;});return g?g.name:((state.group_names||{})[String(id)]||String(id));}
  function renderImports(){var host=el('import-list');host.textContent='';if(!state)return;state.selected_groups.forEach(function(id){var r=state.imports[String(id)]||{},row=node('div','','setup-result-row');row.appendChild(node('strong',groupName(id)));row.appendChild(node('span',r.status==='success'?r.total+' 条 · 新增 '+r.inserted+' 条':r.status==='failed'?r.error:r.status==='running'?'处理中或上次中断，可重试':'尚未导入'));if(r.status==='failed'||r.status==='running'){var b=node('button','重试','btn btn-sm');b.type='button';b.onclick=function(){run(function(){return importIds([id]);},'正在重试…');};row.appendChild(b);}host.appendChild(row);});}
  async function importIds(ids){var start=el('start').value,end=el('end').value;if(!start||!end)throw new Error('请选择导入日期');for(var i=0;i<ids.length;i++){notice('正在导入 '+groupName(ids[i])+' · '+(i+1)+' / '+ids.length);await write('import',{group_id:ids[i],start_date:start,end_date:end});}if(state.selected_groups.length&&state.selected_groups.every(function(id){return (state.imports[String(id)]||{}).status==='success';})){notice('导入完成');await show(4);}else notice('部分群导入失败，可以重试。',true);}
  function renderPreview(data){el('preview-scope').textContent=data.start_date+' 至 '+data.end_date+' · '+data.timezone+' · '+data.total_messages+' 条消息';var host=el('preview-groups');host.textContent='';data.groups.forEach(function(g){host.appendChild(node('p',g.name+' · '+g.message_count+' 条'));});host=el('preview-samples');host.textContent='';data.samples.forEach(function(s){var block=node('div','','setup-sample'),link=node('a',s.group_name+' · '+new Date(s.timestamp).toLocaleString('zh-CN'));link.href='/search?'+new URLSearchParams({group_id:s.group_id,q:s.text.slice(0,30),date_from:data.start_date,date_to:data.end_date});block.appendChild(link);block.appendChild(node('span',s.text));host.appendChild(block);});}
  async function load(){clearTimeout(pollTimer);setBusy(true);notice('正在读取设置…');try{var data=await api('GET','/api/setup');apply(data,true);if(!data.available){notice('当前服务未提供配置位置，请从桌面版或 serve 命令启动',true);return;}if(data.busy){notice('任务仍在处理，稍后自动更新。');pollTimer=setTimeout(load,1500);return;}await show(data.step||1);notice(data.completed?'设置已完成，可重新调整。':data.active?'继续上次设置':'选择数据源开始。');}catch(error){notice(error.message,true);}finally{if(!state||!state.busy)setBusy(false);}}
  document.querySelectorAll('[data-setup-step]').forEach(function(b){b.onclick=function(){run(function(){return show(Number(b.dataset.setupStep));});};});el('reload').onclick=load;
  el('provider').onchange=function(){providerOptions();el('model').value=el('provider').value==='chatgpt_bridge'?(state.ai.bridge_model||''):state.ai.model;};el('accounts').onchange=function(){if(el('accounts').value)el('qq').value=el('accounts').value;};
  el('detect').onclick=function(){run(async function(){var data=await api('GET','/api/setup/detect');el('accounts').textContent='';var option=node('option','选择账号');option.value='';el('accounts').appendChild(option);data.accounts.forEach(function(a){var o=node('option',String(a.qq_number));o.value=a.qq_number;el('accounts').appendChild(o);});notice(data.accounts.length?'选择要读取的账号。':'未找到 QQ 账号目录，可手动填写账号或使用已有解密库。');},'正在检测 QQ…');};
  function qqNumber(){var raw=el('qq').value.trim();if(!raw)return 0;var value=Number(raw);if(!/^\d+$/.test(raw)||!Number.isSafeInteger(value)||value<1)throw new Error('请填写有效 QQ 账号');return value;}
  el('refresh').onclick=function(){run(async function(){var account=qqNumber();if(!account)throw new Error('请填写已登录的 QQ 账号');await write('refresh',{qq_number:account});el('source').value=state.ntqq.db_dir;await show(2);notice('数据源已连接。');},'正在读取 QQ，可能需要一点时间…');};
  el('save-source').onclick=function(){run(async function(){await write('source',{db_dir:el('source').value.trim(),qq_number:qqNumber()});await show(2);notice('数据源已连接。');},'正在检查数据源…');};el('scan').onclick=function(){run(async function(){el('group-list').textContent='';await show(2);notice('扫描完成。');},'正在扫描群聊…');};el('group-filter').oninput=renderGroups;
  el('save-groups').onclick=function(){run(async function(){var ids=Array.from(el('group-list').querySelectorAll('input:checked')).map(function(i){return Number(i.value);});if(!ids.length)throw new Error('请至少选择一个群聊');await write('groups',{group_ids:ids});await show(3);notice('选择日期后导入。');});};el('import').onclick=function(){run(function(){return importIds(state.selected_groups);},'正在导入…');};el('import-next').onclick=function(){run(async function(){if(!state.selected_groups.length||!state.selected_groups.every(function(id){return (state.imports[String(id)]||{}).status==='success';}))throw new Error('请先完成所选群的导入');await show(4);notice('设置 AI，或暂不配置。');});};
  function aiPayload(){return {provider:el('provider').value,base_url:el('url').value.trim(),model:el('model').value.trim(),api_key:el('provider').value==='compatible'?el('key').value:''};}
  el('save-ai').onclick=function(){run(async function(){await write('ai',aiPayload());el('key').value='';notice('已保存，点击测试连接后继续。');});};el('test-ai').onclick=function(){run(async function(){await write('ai',aiPayload());el('key').value='';notice('正在测试连接…');await write('ai-test');await show(5);notice('连接正常。');},'正在保存 AI 设置…');};el('skip-ai').onclick=function(){run(async function(){await write('ai-skip');await show(5);notice('可先采集和查找消息。');});};
  el('save-schedule').onclick=function(){run(async function(){var parts=el('time').value.split(':');if(parts.length!==2)throw new Error('请选择生成时间');await write('schedule',{auto_collection:el('auto-collect').checked,auto_daily:el('auto-daily').checked,interval_minutes:Number(el('interval').value),hour:Number(parts[0]),minute:Number(parts[1]),features_revision:state.features_revision});await show(6);notice('计划已保存。');});};el('finish').onclick=function(){run(async function(){await write('finish');notice('设置完成。');});};load();
})();
</script>

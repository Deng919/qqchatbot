<script>
var currentSearchPage=1,searchToken=0,findContextToken=0,findContextOpener=null,findContextTarget=null,findQuery='',findSubmitted=null,findGroupsFailed=false;
var findKindLabels={message:'聊天消息',report:'摘要',knowledge:'知识',all:'全部内容'};
function findNode(id){return document.getElementById(id);}
function findDay(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function findScope(p){var group=findNode('search-group'),option=Array.from(group.options).find(function(o){return o.value===p.get('group_id');});return (option?option.textContent:'全部群')+' · '+(p.get('date_from')||'最早')+' 至 '+(p.get('date_to')||'现在');}
function searchParams(){var p=new URLSearchParams({q:findNode('search-q').value.trim(),kind:findNode('search-kind').value,page:currentSearchPage});[['group_id','search-group'],['date_from','search-from'],['date_to','search-to']].forEach(function(pair){var value=findNode(pair[1]).value;if(value)p.set(pair[0],value);});return p;}
function updateFindControls(){var kind=findNode('search-kind').value;document.querySelectorAll('[data-kind]').forEach(function(button){button.setAttribute('aria-pressed',String(button.dataset.kind===kind));});findNode('find-filter-hint').textContent=findScope(searchParams())+(findGroupsFailed?' · 群列表读取失败，已保留指定范围':'');}
function setFindKind(kind){findNode('search-kind').value=kind;updateFindControls();currentSearchPage=1;if(findNode('search-q').value.trim().length>=2)loadSearch();else findNode('search-q').focus();}
function setMessageDates(mode){var end=new Date(),start=new Date();if(mode==='week')start.setDate(start.getDate()-6);findNode('search-from').value=mode==='all'?'':findDay(start);findNode('search-to').value=mode==='all'?'':findDay(end);refreshDateHints();updateFindControls();}
function renderFindRecent(){var values=findReadRecent(),host=findNode('find-recent');host.textContent='';findNode('find-clear-recent').hidden=!values.length;if(!values.length){host.textContent='还没有最近搜索。';return;}values.forEach(function(q){var b=document.createElement('button');b.type='button';b.className='btn btn-sm';b.textContent=q;b.onclick=function(){findNode('search-q').value=q;currentSearchPage=1;loadSearch();};host.appendChild(b);});}
function clearFindRecent(){try{localStorage.removeItem(findRecentKey);}catch(error){}renderFindRecent();}
function submitSearch(event){event.preventDefault();currentSearchPage=1;loadSearch();}
function searchPage(step){currentSearchPage+=step;loadSearch(findSubmitted);findNode('find-results-card').scrollIntoView({block:'start',behavior:'smooth'});}
function findHitMarkup(item,q){var time=item.timestamp?new Date(item.timestamp).toLocaleString('zh-CN'):item.date,body=item.snippet||item.text||'',full=item.text||'';
  return '<div class="find-hit"><div class="find-hit-meta">'+escapeHtml(item.sender_qq||'未知发送者')+' · '+escapeHtml(time)+'</div><p class="find-hit-snippet">'+findHighlight(body,q)+'</p>'
    +(full.length>body.length?'<details><summary>展开完整消息</summary><p class="find-hit-snippet">'+findHighlight(full,q)+'</p></details>':'')
    +'<button class="btn btn-sm" type="button" data-group="'+Number(item.group_id)+'" data-message="'+escapeHtml(item.id)+'" data-name="'+escapeHtml(item.group_name)+'" onclick="showSearchContext(this)">查看原文</button></div>';
}
function renderFindGroup(group,q){var first=group.items[0];if(group.kind==='message'){var initial=group.items.slice(0,3).map(function(item){return findHitMarkup(item,q);}).join(''),extra=group.items.slice(3);return '<article class="find-result"><div class="find-result-heading"><strong>'+escapeHtml(first.group_name)+'</strong>'+(group.items.length>1?'<span class="badge badge-dim">'+group.items.length+' 条匹配</span>':'')+'</div>'+(group.items.length>1?'<p class="find-result-meta">同群五分钟内的本页匹配 · 不代表完整讨论</p>':'')+initial+(extra.length?'<details class="find-extra"><summary>展开其余 '+extra.length+' 条匹配</summary>'+extra.map(function(item){return findHitMarkup(item,q);}).join('')+'</details>':'')+'</article>';}
  var hidden=false;
  return '<article class="find-result"><div class="find-result-heading"><span class="badge badge-dim">'+findKindLabels[group.kind]+'</span>'+(hidden?'<strong>'+findHighlight(first.title,q)+'</strong>':'<a class="find-result-title" href="'+escapeHtml(first.url)+'">'+findHighlight(first.title,q)+'</a>')+'</div><p class="find-result-meta">'+escapeHtml(first.group_name)+' · '+escapeHtml(first.date)+'</p><p class="find-hit-snippet">'+findHighlight(first.snippet,q)+'</p>'+(hidden?'<span class="header-meta">知识已保留；整理入口可在设置中开启。</span>':'<a class="btn btn-sm" href="'+escapeHtml(first.url)+'">查看详情</a>')+'</article>';
}
function loadSearch(submitted){
  var token=++searchToken,p=submitted?new URLSearchParams(submitted):searchParams();p.set('page',currentSearchPage);var q=p.get('q')||'',validation=findNode('find-validation');validation.hidden=true;closeFindContext();
  if(q.length<2||q.length>100){findNode('find-home').hidden=false;findNode('find-results-card').hidden=true;findNode('find-results-card').setAttribute('aria-busy','false');if(q){validation.textContent='请输入至少两个字符再查找。';validation.hidden=false;}else history.replaceState(null,'','/search?'+p.toString());return Promise.resolve();}
  if(p.get('date_from')&&p.get('date_to')&&p.get('date_from')>p.get('date_to')){validation.textContent='开始日期不能晚于结束日期。';validation.hidden=false;findNode('find-results-card').setAttribute('aria-busy','false');findNode('find-results-card').hidden=true;findNode('find-home').hidden=false;return Promise.resolve();}
  findSubmitted=p.toString();findQuery=q;findSaveRecent(q);renderFindRecent();findNode('find-home').hidden=true;findNode('find-results-card').hidden=false;findNode('find-results-card').setAttribute('aria-busy','true');findNode('search-result-title').textContent='“'+q+'” · '+findKindLabels[p.get('kind')];findNode('find-result-scope').textContent=findScope(p)+' · 按时间从新到旧';findNode('search-count').textContent='正在查找…';findNode('search-results').textContent='正在读取匹配内容…';findNode('search-pages').hidden=true;
  return api('GET','/api/search?'+p.toString()).then(function(data){if(token!==searchToken)return;var groups=findGroupHits(data.results);findNode('search-count').textContent='共 '+formatNumber(data.total)+' 条匹配';findNode('search-results').innerHTML=groups.length?groups.map(function(group){return renderFindGroup(group,q);}).join(''):'<div class="empty">没有找到匹配内容。可以换个关键词、扩大日期范围或切换内容类型。</div>';findNode('search-pages').hidden=data.total<=data.page_size;findNode('search-page-label').textContent='第 '+data.page+' / '+Math.max(1,Math.ceil(data.total/data.page_size))+' 页';findNode('search-prev').disabled=data.page<=1;findNode('search-next').disabled=data.page*data.page_size>=data.total;history.replaceState(null,'','/search?'+p.toString());
  }).catch(function(error){if(token!==searchToken)return;findNode('search-count').textContent='查找失败';findNode('search-results').textContent=error.message+'；请点击“查找”重试。';}).finally(function(){if(token===searchToken)findNode('find-results-card').setAttribute('aria-busy','false');});
}
function closeFindContext(){++findContextToken;destroyMessageContext(findNode('find-context-body'));findNode('find-context').hidden=true;findNode('find-context-overlay').hidden=true;document.body.style.overflow=findOriginalOverflow; if(findContextOpener&&findContextOpener.isConnected)findContextOpener.focus({preventScroll:true});findContextOpener=null;}
var findOriginalOverflow=document.body.style.overflow;
function showSearchContext(button){findContextOpener=button;findContextTarget={group:button.dataset.group,id:button.dataset.message,name:button.dataset.name};if(findNode('find-context').hidden)findOriginalOverflow=document.body.style.overflow;findNode('find-context').hidden=false;findNode('find-context-overlay').hidden=false;document.body.style.overflow='hidden';findNode('find-context-close').focus();return loadFindContext();}
function loadFindContext(){var token=++findContextToken,target=findContextTarget,q=findQuery,body=findNode('find-context-body');findNode('find-context-meta').textContent=target.name;findNode('find-context-actions').textContent='';
  return mountMessageContext(body,{groupId:target.group,citedId:target.id,url:'/api/search/messages/'+encodeURIComponent(target.group)+'/'+encodeURIComponent(target.id)+'/context',
    isCurrent:function(){return token===findContextToken&&!findNode('find-context').hidden;},highlight:function(text){return findHighlight(text,q);},
    onLoaded:function(){findNode('find-context-actions').textContent='';if(featureFlags.tasks!==false){var a=document.createElement('a');a.className='btn btn-sm';a.textContent='加入待办';a.href='/tasks?'+new URLSearchParams({group_id:target.group,msg_id:target.id});findNode('find-context-actions').appendChild(a);}}}).ready;
}
document.addEventListener('keydown',function(event){var panel=findNode('find-context');if(panel.hidden)return;if(event.key==='Escape'){event.preventDefault();closeFindContext();}else if(event.key==='Tab'){var nodes=Array.from(panel.querySelectorAll('button,a[href],input,select,[tabindex="0"]')).filter(function(n){return !n.disabled&&n.getClientRects().length;});var first=nodes[0],last=nodes[nodes.length-1];if(event.shiftKey&&(document.activeElement===first||!panel.contains(document.activeElement))){event.preventDefault();last.focus();}else if(!event.shiftKey&&(document.activeElement===last||!panel.contains(document.activeElement))){event.preventDefault();first.focus();}}});
(function restoreSearch(){var p=new URLSearchParams(location.search);setMessageDates('week');[['q','search-q'],['date_from','search-from'],['date_to','search-to']].forEach(function(pair){if(p.has(pair[0]))findNode(pair[1]).value=p.get(pair[0]);});if(findKindLabels[p.get('kind')])findNode('search-kind').value=p.get('kind');currentSearchPage=Math.max(1,Number(p.get('page'))||1);renderFindRecent();updateFindControls();['search-group','search-from','search-to'].forEach(function(id){findNode(id).addEventListener('change',updateFindControls);});
  if(p.has('group_id')){var pendingOption=document.createElement('option');pendingOption.value=p.get('group_id');pendingOption.textContent='群 '+p.get('group_id');findNode('search-group').appendChild(pendingOption);findNode('search-group').value=p.get('group_id');findNode('find-filters').open=true;}
  var restoreParams=searchParams().toString(),restoreToken=searchToken;
  api('GET','/api/groups').then(function(data){data.groups.forEach(function(group){var option=Array.from(findNode('search-group').options).find(function(o){return o.value===String(group.group_id);});if(!option){option=document.createElement('option');option.value=group.group_id;findNode('search-group').appendChild(option);}option.textContent=group.name;});}).catch(function(){findGroupsFailed=true;}).finally(function(){updateFindControls();refreshDateHints();if(p.get('q')&&searchToken===restoreToken&&findNode('search-q').value.trim()===p.get('q').trim())loadSearch(restoreParams);});
})();
</script>

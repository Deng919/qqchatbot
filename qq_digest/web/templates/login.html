<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="登录 QQ 群聊简报本地工作台">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23176f65'/><path d='M8 8h16v3H8zm0 6h12v3H8zm0 6h8v3H8z' fill='white'/></svg>">
  <title>登录 - 群聊简报</title>
  <style>
    :root { --bg:#f2f3f0; --surface:#fff; --border:#d9ded8; --border-strong:#b9c2bb; --text:#202622; --dim:#727c76; --header:#202824; --primary:#176f65; --primary-dark:#105c54; --red:#aa4039; --red-soft:#f8e9e7; }
    * { box-sizing: border-box; }
    body.login-shell { margin: 0; min-width: 320px; min-height: 100dvh; display: grid; grid-template-rows: 54px 1fr; background: var(--bg); color: var(--text); font-family: "Segoe UI Variable", "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; letter-spacing: 0; }
    .login-header { display: flex; align-items: center; padding: 0 max(20px, calc((100vw - 1384px) / 2)); background: var(--header); color: #fff; font-size: 16px; font-weight: 700; }
    .login-header span { margin-left: 8px; color: #99a59e; font-size: 10px; font-weight: 500; }
    .login-main { display: grid; place-items: center; padding: 32px 20px 64px; }
    .login-panel { width: min(380px, 100%); padding: 28px; background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--primary); border-radius: 4px; box-shadow: 0 18px 46px rgb(28 37 31 / .09); }
    h1 { margin: 0 0 5px; font-size: 21px; line-height: 1.3; }
    .subtitle { margin: 0 0 22px; color: var(--dim); font-size: 12px; }
    label { display: block; margin-bottom: 5px; color: #4f5953; font-size: 12px; font-weight: 600; }
    input { width: 100%; min-height: 42px; margin-bottom: 13px; padding: 8px 11px; background: #fff; border: 1px solid var(--border-strong); border-radius: 4px; color: var(--text); font: inherit; }
    input:hover { border-color: #919c94; }
    input:focus { outline: 3px solid rgb(23 111 101 / .14); border-color: var(--primary); }
    button { width: 100%; min-height: 42px; padding: 8px 12px; background: var(--primary); border: 1px solid var(--primary); border-radius: 4px; color: #fff; font-family: inherit; font-size: 14px; font-weight: 600; line-height: 1.4; cursor: pointer; transition: background 160ms ease, transform 120ms ease; }
    button:hover { background: var(--primary-dark); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid rgb(23 111 101 / .24); outline-offset: 2px; }
    .error { margin-bottom: 13px; padding: 9px 10px; background: var(--red-soft); border-left: 3px solid var(--red); border-radius: 3px; color: var(--red); font-size: 13px; }
    @media (max-width: 480px) { .login-main { place-items: start stretch; padding: 24px 16px; } .login-panel { width: 100%; padding: 22px; } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body class="login-shell">
  <header class="login-header">群聊简报 <span>QQ Digest</span></header>
  <main class="login-main">
    <section class="login-panel" aria-labelledby="login-title">
      <h1 id="login-title">登录本地工作台</h1>
      <p class="subtitle">查看群聊摘要并审核重点信息</p>
      {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="/login">
        <label for="password">密码</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required autofocus>
        <button type="submit">登录</button>
      </form>
    </section>
  </main>
</body>
</html>

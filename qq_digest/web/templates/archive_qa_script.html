<script>
var archiveQATicket=null,archiveQAToken=0,archiveQASourceToken=0,archiveQABusy=false,archiveQAGroupsReady=false;
function qaNode(id){return document.getElementById(id);}
function qaElement(tag,text){var node=document.createElement(tag);node.textContent=text;return node;}
function qaInvalidate(){archiveQAToken++;archiveQASourceToken++;archiveQATicket=null;qaNode('qa-preview').hidden=true;qaNode('qa-result').hidden=true;qaNode('qa-original').hidden=true;qaNode('qa-status').textContent='';qaControls();}
function qaControls(){qaNode('qa-preview-button').disabled=archiveQABusy||!archiveQAGroupsReady;qaNode('qa-send').disabled=archiveQABusy||!archiveQATicket;}
function qaScope(scope){var group=Array.from(qaNode('qa-group').options).find(function(option){return option.value===String(scope.group_id===null?'':scope.group_id);});return (scope.group_ids&&scope.group_ids.length?'已选 '+scope.group_ids.length+' 个群':group?group.textContent:'全部群')+' · '+scope.date_from+' 至 '+scope.date_to+' · '+scope.timezone;}
function qaTime(stamp,zone){return new Date(stamp).toLocaleString('zh-CN',{timeZone:zone});}
function archiveQAPreview(event){event.preventDefault();if(archiveQABusy||!archiveQAGroupsReady)return;qaInvalidate();var token=archiveQAToken;
  var groupScope;try{groupScope=GroupSelector.value(qaNode('qa-group'));}catch(e){qaNode('qa-status').textContent=e.message;return;}var payload={question:qaNode('qa-question').value.trim(),query:qaNode('qa-query').value.trim(),group_ids:groupScope,date_from:qaNode('qa-from').value,date_to:qaNode('qa-to').value};
  archiveQABusy=true;qaControls();qaNode('qa-status').textContent='正在查找消息…';
  return api('POST','/api/archive-qa/preview',payload).then(function(data){if(token!==archiveQAToken)return;archiveQATicket=data.ticket;qaNode('qa-preview').hidden=false;qaNode('qa-scope').textContent=qaScope(data.scope);qaNode('qa-preview-note').textContent='找到 '+data.matched_count+' 条匹配，选取 '+data.messages.length+' 条发送给 DeepSeek。'+(data.context_limited?'仅使用下列片段，不能确认未纳入的讨论。':'');var host=qaNode('qa-messages');host.textContent='';data.messages.forEach(function(item,index){var details=qaElement('details','');details.className='qa-message';details.appendChild(qaElement('summary','消息 '+(index+1)+' · '+item.group_name+' · '+qaTime(item.timestamp,data.scope.timezone)+' · '+(item.sender_name||item.sender_qq||'未知发送者')));var body=qaElement('p',item.excerpt);body.className='qa-text';details.appendChild(body);host.appendChild(details);});qaNode('qa-send').hidden=!data.messages.length;qaNode('qa-status').textContent=data.messages.length?'核对片段后发送，预览在 15 分钟内有效。':'无法确认：没有找到相关消息，请调整关键词或范围。';}).catch(function(error){if(token===archiveQAToken)qaNode('qa-status').textContent=error.message;}).finally(function(){archiveQABusy=false;qaControls();});
}
function archiveQAAsk(){if(archiveQABusy||!archiveQATicket)return;var token=archiveQAToken,ticket=archiveQATicket;archiveQABusy=true;qaControls();qaNode('qa-status').textContent='DeepSeek 正在回答…';
  return api('POST','/api/archive-qa/ask',{ticket:ticket}).then(function(data){if(token!==archiveQAToken)return;qaNode('qa-result').hidden=false;qaNode('qa-answer').textContent=data.answer;var host=qaNode('qa-sources');host.textContent='';data.sources.forEach(function(source,index){var button=qaElement('button','来源 '+(index+1)+' · '+source.group_name);button.type='button';button.className='btn btn-sm';button.onclick=function(){archiveQASource(ticket,source.source_id);};host.appendChild(button);});qaNode('qa-status').textContent='已根据 '+data.context_message_count+' 条片段回答。';qaNode('qa-result').scrollIntoView({block:'start',behavior:'smooth'});}).catch(function(error){if(token===archiveQAToken)qaNode('qa-status').textContent=error.message;}).finally(function(){archiveQABusy=false;qaControls();});
}
function archiveQASource(ticket,id){var token=++archiveQASourceToken;qaNode('qa-original').hidden=true;return api('GET','/api/archive-qa/sources/'+encodeURIComponent(ticket)+'/'+encodeURIComponent(id)).then(function(data){if(token!==archiveQASourceToken||ticket!==archiveQATicket)return;qaNode('qa-original').hidden=false;qaNode('qa-original-meta').textContent=data.group_name+' · '+qaTime(data.timestamp,data.scope.timezone)+' · '+(data.sender_name||data.sender_qq||'未知发送者');qaNode('qa-original-text').textContent=data.text;}).catch(function(error){if(token===archiveQASourceToken)qaNode('qa-status').textContent=error.message;});}
(function(){qaControls();['qa-question','qa-query','qa-group','qa-from','qa-to'].forEach(function(id){qaNode(id).addEventListener('input',qaInvalidate);});api('GET','/api/groups').then(function(data){data.groups.forEach(function(group){var option=qaElement('option',group.name);option.value=group.group_id;qaNode('qa-group').appendChild(option);});archiveQAGroupsReady=true;qaControls();}).catch(function(){qaNode('qa-status').textContent='群列表读取失败，请刷新重试。';qaControls();});})();
</script>

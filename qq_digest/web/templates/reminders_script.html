<script>
var reminderPage=1, reminderRules=[], reminderListToken=0, reminderEditToken=0, reminderEdit=null, reminderSaving=false, reminderChecking=false, reminderRuleToken=0, reminderGroupsReady=false;
var reminderKinds={keyword:'关键词',resource:'新资源候选',task_due:'待办到期',failure:'运行故障'};
function rn(id){return document.getElementById(id);}
function reminderText(tag,text,cls){var n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n;}
function reminderButton(text,action){var b=reminderText('button',text,'btn btn-sm');b.type='button';b.addEventListener('click',action);return b;}
function reminderError(error){rn('reminders-status').textContent=error.message||'操作失败，请重试';}
function remindersTab(tab){rn('reminders-inbox').hidden=tab!=='inbox';rn('reminders-rules').hidden=tab!=='rules';['inbox','rules'].forEach(function(key){rn('reminders-'+key+'-tab').setAttribute('aria-pressed',String(key===tab));});if(tab==='rules')remindersRules();else remindersLoad(reminderPage);}
async function remindersLoad(page){
  var token=++reminderListToken;
  try{var data=await api('GET','/api/reminders?'+new URLSearchParams({page:Math.max(1,page),page_size:20,unread_only:rn('reminders-unread').checked}));if(token!==reminderListToken)return;
    reminderPage=data.page;rn('reminders-count').textContent=data.total+' 条记录 · '+data.unread+' 条未读 · '+(data.queued||0)+' 条排队等待发布或投递';var host=rn('reminders-list');host.textContent='';
    if(!data.items.length)host.appendChild(reminderText('p','暂无提醒。新建规则后，程序运行期间每分钟检查一次。','header-meta'));
    data.items.forEach(function(item){var card=reminderText('article','','card reminder-card'+(item.read?' is-read':''));card.appendChild(reminderText('h3',item.title));card.appendChild(reminderText('p',item.rule_name+' · '+item.group_name+' · '+new Date(item.created_at).toLocaleString('zh-CN'),'header-meta'));card.appendChild(reminderText('p',item.body,'reminder-body'));
      var status=item.delivery_status||{},labels={published:'已发布',queued:'等待投递',sent:'系统已接受',failed:'投递失败',unknown:'投递结果未知',canceled:'已取消',disabled:'未选择'};
      card.appendChild(reminderText('p','程序内：'+(labels[status.in_app]||status.in_app)+' · Windows：'+(labels[status.windows]||status.windows),'header-meta'));
      var actions=reminderText('div','','reminder-actions');if(item.source_url&&/^\/(?:search|tasks|candidates|failures)(?:\?|$)/.test(item.source_url)){var link=reminderText('a','查看来源','btn btn-sm');link.href=item.source_url;actions.appendChild(link);}
      actions.appendChild(reminderButton(item.read?'标为未读':'标为已读',async function(){try{await api('PATCH','/api/reminders/'+item.event_id,{read:!item.read});remindersLoad(reminderPage);}catch(e){reminderError(e);}}));
      if(['failed','unknown'].includes(status.windows))actions.appendChild(reminderButton('重试 Windows 通知',async function(){try{await api('POST','/api/reminders/'+item.event_id+'/retry',{});rn('reminders-status').textContent='已加入重试队列；免打扰结束后检查投递。';remindersLoad(reminderPage);}catch(e){reminderError(e);}}));card.appendChild(actions);host.appendChild(card);
    });var pages=Math.max(1,Math.ceil(data.total/data.page_size));rn('reminders-page-label').textContent='第 '+reminderPage+' / '+pages+' 页';rn('reminders-prev').disabled=reminderPage<=1;rn('reminders-next').disabled=reminderPage>=pages;
  }catch(e){if(token===reminderListToken)reminderError(e);}
}
async function remindersRules(){var token=++reminderRuleToken;try{var data=await api('GET','/api/reminder-rules');if(token!==reminderRuleToken)return;reminderRules=data.rules;var host=rn('reminder-rules-list');host.textContent='';if(!data.rules.length)host.appendChild(reminderText('p','还没有规则，先创建一条提醒。','header-meta'));data.rules.forEach(function(rule){var card=reminderText('article','','card reminder-card');card.appendChild(reminderText('h3',rule.name+' · '+(rule.enabled?'已启用':'已停用')));card.appendChild(reminderText('p',reminderKinds[rule.kind]+' · '+(rule.group_ids.length?'指定 '+rule.group_ids.length+' 个群':'全部群')+' · '+rule.channels.map(function(c){return c==='windows'?'Windows':'程序内';}).join('、'),'header-meta'));card.appendChild(reminderText('p','免打扰 '+rule.quiet_start+'–'+rule.quiet_end+(rule.keywords.length?' · '+rule.keywords.join('、'):''),'header-meta'));var actions=reminderText('div','','reminder-actions');actions.appendChild(reminderButton('编辑',function(){remindersEdit(rule);}));actions.appendChild(reminderButton(rule.enabled?'停用':'启用',function(){remindersToggle(rule);}));actions.appendChild(reminderButton('删除规则',async function(){try{await api('DELETE','/api/reminder-rules/'+rule.rule_id+'?expected_revision='+rule.revision);rn('reminders-status').textContent='规则已删除，已有提醒记录保留。';remindersRules();}catch(e){reminderError(e);}}));card.appendChild(actions);host.appendChild(card);});}catch(e){if(token===reminderRuleToken)reminderError(e);}}
function reminderValues(){return {name:rn('reminder-name').value.trim(),kind:rn('reminder-kind').value,enabled:rn('reminder-enabled').checked,group_ids:Array.from(rn('reminder-groups').selectedOptions).map(function(o){return Number(o.value);}),keywords:rn('reminder-kind').value==='keyword'?rn('reminder-keywords').value.split(/\r?\n/).map(function(k){return k.trim();}).filter(Boolean):[],channels:['in_app','windows'].filter(function(c){return rn('reminder-'+(c==='in_app'?'in-app':'windows')).checked;}),quiet_start:rn('reminder-quiet-start').value,quiet_end:rn('reminder-quiet-end').value};}
function reminderPayload(rule){var values={};['name','kind','enabled','group_ids','keywords','channels','quiet_start','quiet_end'].forEach(function(key){values[key]=rule[key];});return values;}
async function remindersToggle(rule){try{var values=reminderPayload(rule);values.enabled=!rule.enabled;values.expected_revision=rule.revision;await api('PATCH','/api/reminder-rules/'+rule.rule_id,values);remindersRules();}catch(e){reminderError(e);}}
function remindersEdit(rule){if(!reminderGroupsReady){rn('reminders-status').textContent='群范围尚未加载，请稍后重试或刷新页面。';return;}if(reminderSaving)return;reminderEdit=rule||null;remindersChanged();rn('reminder-error').textContent='';rn('reminder-edit-title').textContent=rule?'编辑提醒规则':'新建提醒规则';rn('reminder-name').value=rule?rule.name:'';rn('reminder-kind').value=rule?rule.kind:'keyword';rn('reminder-keywords').value=rule?rule.keywords.join('\n'):'';rn('reminder-enabled').checked=rule?rule.enabled:true;rn('reminder-in-app').checked=!rule||rule.channels.includes('in_app');rn('reminder-windows').checked=!rule||rule.channels.includes('windows');rn('reminder-quiet-start').value=rule?rule.quiet_start:'22:00';rn('reminder-quiet-end').value=rule?rule.quiet_end:'08:00';Array.from(rn('reminder-groups').options).forEach(function(o){o.selected=Boolean(rule&&rule.group_ids.includes(Number(o.value)));});remindersKind();rn('reminder-dialog').showModal();rn('reminder-name').focus();}
function remindersKind(){rn('reminder-keyword-field').hidden=rn('reminder-kind').value!=='keyword';remindersChanged();}
function remindersChanged(){++reminderEditToken;rn('reminder-preview').textContent='';}
function remindersClose(){if(reminderSaving)return;remindersChanged();rn('reminder-dialog').close();}
async function remindersPreview(){var token=++reminderEditToken;rn('reminder-error').textContent='';try{var data=await api('POST','/api/reminder-rules/preview',reminderValues());if(token!==reminderEditToken||!rn('reminder-dialog').open)return;var host=rn('reminder-preview');host.textContent='历史匹配示例 '+data.total+' 条（最多展示 20 条）'+(data.truncated?' · 仅检查最近 200 条来源':'')+(data.quiet?' · 当前在免打扰时段':'')+'。预览不会发布提醒。';data.items.forEach(function(item){host.appendChild(reminderText('p',item.group_name+' · '+item.title+' · '+item.body,'reminder-body'));if(item.source_url&&/^\/(?:search|tasks|candidates|failures)(?:\?|$)/.test(item.source_url)){var link=reminderText('a','查看来源','btn btn-sm');link.href=item.source_url;host.appendChild(link);}});}catch(e){if(token===reminderEditToken)rn('reminder-error').textContent=e.message;}}
async function remindersSave(event){event.preventDefault();if(reminderSaving)return;reminderSaving=true;rn('reminder-form').inert=true;++reminderEditToken;rn('reminder-save').disabled=true;rn('reminder-error').textContent='';try{var payload=reminderValues(),path='/api/reminder-rules';if(reminderEdit){path+='/'+reminderEdit.rule_id;payload.expected_revision=reminderEdit.revision;}await api(reminderEdit?'PATCH':'POST',path,payload);rn('reminder-dialog').close();remindersRules();rn('reminders-status').textContent='规则已保存。关键词、资源和故障从当前开始检查，到期待办检查当前未完成的项目。';}catch(e){rn('reminder-error').textContent=e.message+(e.status===409?'，请关闭编辑框并重新打开最新规则。':'');}finally{reminderSaving=false;rn('reminder-form').inert=false;rn('reminder-save').disabled=false;}}
async function remindersCheck(){if(reminderChecking)return;reminderChecking=true;rn('reminders-check').disabled=true;try{var data=await api('POST','/api/reminders/check',{});rn('reminders-status').textContent='检查完成，新增 '+data.created+' 条提醒，'+(data.delivery?data.delivery.queued:data.queued)+' 条等待发布或投递。';remindersLoad(1);}catch(e){reminderError(e);}finally{reminderChecking=false;rn('reminders-check').disabled=false;}}
async function remindersInit(){
  api('GET','/api/groups').then(function(data){var host=rn('reminder-groups');data.groups.forEach(function(group){var o=reminderText('option',group.name);o.value=String(group.group_id);host.appendChild(o);});reminderGroupsReady=true;}).catch(reminderError);
  api('GET','/api/reminders/capabilities').then(function(data){rn('reminders-capability').textContent='每 60 秒检查 · 时区 '+data.timezone+' · '+(data.windows?'Windows 通知可用，系统设置决定横幅显示。':'浏览器仅展示程序内提醒；Windows 通知需要在桌面程序中运行，已选渠道保留排队。');}).catch(reminderError);
  rn('reminder-dialog').addEventListener('cancel',function(event){if(reminderSaving)event.preventDefault();else remindersChanged();});
  remindersLoad(1);remindersRules();
}
remindersInit();
</script>

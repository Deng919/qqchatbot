<style>
.message-context-browser{font-size:14px}.message-context-controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}.message-context-controls span,.message-context-status{font-size:12px;color:var(--text-soft);line-height:1.6}.message-context-scroll{height:min(52vh,480px);min-height:150px;overflow-y:auto;overscroll-behavior:contain;position:relative;border:1px solid var(--border);border-radius:8px;scrollbar-gutter:stable}.message-context-scroll:focus-visible{outline:2px solid var(--primary);outline-offset:2px}.message-context-row{padding:13px 12px;border-bottom:1px solid var(--border)}.message-context-row:last-child{border-bottom:0}.message-context-row.is-cited{background:var(--primary-soft);border-left:3px solid var(--primary)}.message-context-meta{font-size:12px;color:var(--text-soft);margin-bottom:8px}.message-context-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75}.message-context-status{margin:8px 0}.find-context-body{overflow:hidden!important;display:flex;flex-direction:column}.find-context-body>.message-context-browser{flex:1;min-height:0;display:flex;flex-direction:column}.find-context-body .message-context-scroll{flex:1;height:auto;min-height:0}.find-context-body .message-context-status,.find-context-body .message-context-controls{flex-shrink:0}
</style>
<script>
function destroyMessageContext(host){if(host&&host._messageContext)host._messageContext.destroy();}
function mountMessageContext(host,options){
  destroyMessageContext(host);host.textContent='';var active=true,busy=false,loaded=false,armed=false,items=[],first=null,last=null,hasBefore=false,hasAfter=false;
  function node(tag,cls,text){var n=document.createElement(tag);n.className=cls;if(text!==undefined)n.textContent=text;return n;}
  var root=node('section','message-context-browser'),top=node('div','message-context-controls'),before=node('button','btn btn-sm','查看更早消息'),count=node('span','',''),scroll=node('div','message-context-scroll'),status=node('p','message-context-status','上下文可能超出摘要日期。'),bottom=node('div','message-context-controls'),after=node('button','btn btn-sm','查看更晚消息');
  before.type=after.type='button';scroll.tabIndex=0;scroll.setAttribute('aria-label','上下文消息，可向前后滚动查看');status.setAttribute('role','status');top.appendChild(before);top.appendChild(count);bottom.appendChild(after);if(options.title)root.appendChild(node('h3','',options.title));root.appendChild(top);root.appendChild(scroll);root.appendChild(bottom);root.appendChild(status);host.appendChild(root);
  function current(){return active&&(!options.isCurrent||options.isCurrent());}
  function controls(){before.disabled=busy||!hasBefore;after.disabled=busy||!hasAfter;before.textContent=loaded&&!hasBefore?'已到最早消息':'查看更早消息';after.textContent=loaded&&!hasAfter?'已到最新消息':'查看更晚消息';count.textContent=busy?'正在加载…':'已加载 '+items.length+' 条';scroll.setAttribute('aria-busy',String(busy));}
  function render(){scroll.textContent='';items.forEach(function(item){var row=node('article','message-context-row'+(item.msg_id===options.citedId?' is-cited':'')),meta=node('div','message-context-meta',new Date(item.timestamp).toLocaleString('zh-CN')+' · '+(item.sender_qq||'未知发送者')+(item.msg_id===options.citedId?' · 原消息':'')),body=node('div','message-context-text');if(options.highlight)body.innerHTML=options.highlight(item.text);else body.textContent=item.text;row.appendChild(meta);row.appendChild(body);if(options.groupId&&item.msg_id===options.citedId){var save=node('button','btn btn-sm','保存到知识库');save.type='button';save.onclick=function(){openKnowledgeSave(options.groupId,item.msg_id,save);};row.appendChild(save);}scroll.appendChild(row);});}
  function load(direction){
    direction=direction||'around';if(!current()||busy||(direction==='before'&&!hasBefore)||(direction==='after'&&!hasAfter))return Promise.resolve();busy=true;armed=false;controls();var oldTop=scroll.scrollTop,oldHeight=scroll.scrollHeight,url=options.url;
    if(direction!=='around')url+=(url.includes('?')?'&':'?')+new URLSearchParams({direction:direction,cursor:direction==='before'?first:last}).toString();
    return api('GET',url).then(function(data){if(!current())return;var rows=data.messages||[],combined=direction==='before'?rows.concat(items):direction==='after'?items.concat(rows):rows,seen=new Set();items=combined.filter(function(item){var key=String(item.msg_id);if(seen.has(key))return false;seen.add(key);return true;});
      if(direction==='around'){first=data.first_id;last=data.last_id;hasBefore=data.has_before===true;hasAfter=data.has_after===true;}else if(direction==='before'){if(rows.length)first=data.first_id;hasBefore=data.has_before===true;}else{if(rows.length)last=data.last_id;hasAfter=data.has_after===true;}
      render();loaded=true;if(direction==='before')scroll.scrollTop=oldTop+scroll.scrollHeight-oldHeight;else if(direction==='after')scroll.scrollTop=oldTop;else{var cited=scroll.querySelector('.is-cited');if(cited)scroll.scrollTop=Math.max(0,cited.offsetTop-scroll.clientHeight/2+cited.offsetHeight/2);}
      status.textContent='本地同群消息 · 上下文可能超出摘要日期。';if(options.onLoaded)options.onLoaded(data);
    }).catch(function(error){if(!current())return;status.textContent='上下文加载失败：'+error.message+'；请重试。';if(!loaded){before.disabled=true;after.disabled=true;var retry=node('button','btn btn-sm','重试');retry.type='button';retry.onclick=function(){retry.remove();load('around');};status.appendChild(retry);}}).finally(function(){busy=false;if(current())controls();});
  }
  before.onclick=function(){load('before');};after.onclick=function(){load('after');};
  scroll.addEventListener('wheel',function(event){armed=true;if(!busy&&((event.deltaY<0&&scroll.scrollTop<=1&&hasBefore)||(event.deltaY>0&&scroll.scrollTop+scroll.clientHeight>=scroll.scrollHeight-1&&hasAfter))){event.preventDefault();load(event.deltaY<0?'before':'after');}},{passive:false});
  scroll.addEventListener('pointerdown',function(){armed=true;});scroll.addEventListener('touchstart',function(){armed=true;},{passive:true});scroll.addEventListener('keydown',function(){armed=true;});scroll.addEventListener('scroll',function(){if(!armed||busy||!loaded)return;if(scroll.scrollTop<60&&hasBefore)load('before');else if(scroll.scrollTop+scroll.clientHeight>scroll.scrollHeight-60&&hasAfter)load('after');});
  var controller={load:load,destroy:function(){active=false;},ready:null};host._messageContext=controller;controller.ready=load('around');return controller;
}
</script>

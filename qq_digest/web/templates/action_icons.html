<style>

  details[open]>summary.action-disclosure::before { transform:rotate(135deg);margin-bottom:4px; }
  summary.action-disclosure::after { content:none!important; }
  summary.summary-group-cover.action-disclosure::before { display:none; }
  .summary-group-toggle { display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:32px;flex-shrink:0;font-size:12px;font-weight:500; }

  .summary-group-stack[open] .summary-group-toggle::before { margin-top:4px; }

  @media (max-width:600px) {
    .workspace-app .page-toolbar-inner { flex-wrap:wrap; }

  }

<script>
(function(){

    back:'<path d="m14 5-7 7 7 7"/>',next:'<path d="m10 5 7 7-7 7"/>',up:'<path d="m5 15 7-7 7 7"/>',
    refresh:'<path d="M20 8a8 8 0 1 0 0 8m1-14v6h-6"/>',

    save:'<path d="M4 3h13l4 4v14H3V3Zm3 0v6h10V3M7 21v-8h10v8"/>',
    folder:'<path d="M3 7V4h6l3 3h9v14H3Zm0 3h18"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',
    settings:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="9" cy="18" r="2"/>',
    groups:'<circle cx="8" cy="7" r="3"/><path d="M2 21v-3a6 6 0 0 1 12 0v3m1-17a3 3 0 0 1 0 6m2 4a5 5 0 0 1 5 5v2"/>',
    bell:'<path d="M5 17V9a7 7 0 0 1 14 0v8l2 2H3Zm5 5h4"/>',

  };
  var names=Object.create(null);
  function group(icon,caption,labels,tone){labels.split('|').forEach(function(label){names[label]={icon:icon,caption:caption,tone:tone||''};});}
  group('star','收藏','收藏');group('star','已收藏','已收藏');
  group('eye','详情','查看详情|详情|查看|打开收藏|查看知识|查看资源记录');
  group('eye','原消息','查看原消息|查看原文|查看这次原文|查看原消息与图片|查看来源|关联的消息');
  group('book','摘要','完整摘要|打开摘要|打开当前摘要');
  group('link','原内容','打开原内容|打开资源');
  group('hide','不感兴趣','不感兴趣|对此商品不感兴趣|忽略');
  group('block','屏蔽','屏蔽此人|屏蔽原发布人','danger');
  group('restore','恢复','恢复显示|解除屏蔽|撤销|重新跟踪|恢复审核');
  group('check','已读','标为已读');group('unread','未读','标为未读');
  group('check','完成','完成|标为完成');group('restore','重新打开','重新打开');
  group('edit','编辑','编辑|更名');group('trash','删除','删除|取消收藏|删除规则','danger');
  // Removing a bookmark uses the same star as adding it, with the active state shown in blue.
  names['取消收藏']={icon:'star',caption:'取消收藏',tone:''};
  group('close','关闭','关闭');group('book','保存知识','保存到知识库');group('task','待办','加入待办');
  group('archive','归档','归档话题');group('restore','重试','重试|重试读取');
  group('back','上一页','上一页|较新版本|更近讨论');group('next','下一页','下一页|较旧版本|更早讨论');
  group('back','返回','← 返回列表|返回阅读|返回知识库|← 返回话题列表|返回之前阅读|← 返回摘要阅读');
  group('close','关闭','关闭保存窗口');group('up','收起','收起|收起，继续阅读');
  group('refresh','刷新','刷新用量|重新载入连接设置|刷新占用|重试 Windows 通知');
  group('restore','重置','清除筛选|清空筛选|重置为近七天');
  group('folder','文件夹','选择文件夹|打开当前位置|打开导出目录|打开备份目录');
  group('eye','未解析来源','未解析来源');group('hide','隐藏列表','不感兴趣列表');group('block','屏蔽名单','屏蔽名单');
  group('chat','询问摘要','询问这份摘要');group('check','已处理','标记已处理');
  group('settings','启用','启用');group('close','停用','停用');
  group('book','最近摘要','最近摘要');group('task','查看进展','查看进展');
  function labelled(icon,labels){labels.split('|').forEach(function(label){names[label]={icon:icon,caption:label,tone:'',labelled:true};});}
  labelled('play','生成摘要|开始生成|保留旧版并重新生成');
  labelled('refresh','更新消息|更新交易信息|更新话题|立即检查|立即巡检|扫描本地群聊|检查缺口|刷新数据库|测试连接');
  labelled('plus','添加群聊|添加所选群|添加|新建规则|从消息创建|新建连接');
  labelled('save','保存|保存修改|保存设置|保存规则|保存知识|保存纠错意见|保存自动运行设置|保存功能设置');
  labelled('download','导出摘要|立即备份');labelled('search','查找|筛选|筛选知识|预览匹配');
  var selector='button.btn,a.btn,.global-nav a,#workspace-tools-area a,.section-back',tip=null,active=null;
  var navIcons={'摘要':'book','阅读摘要':'book','查找':'search','群聊':'groups','设置':'settings','二手信息':'archive','知识库':'book','收藏':'star','待办':'task','话题跟踪':'chat','提醒':'bell','功能开关':'settings'};
  function disclosure(summary){
    if(!summary.classList.contains('action-disclosure'))summary.classList.add('action-disclosure');
    var expanded=summary.parentElement.open;summary.setAttribute('aria-expanded',String(expanded));
    summary.dataset.disclosureLabel=expanded?'收起':'展开';
  }

  function hide(){if(tip&&tip.matches(':popover-open'))tip.hidePopover();active=null;}
  function decorate(button){
    var label=button.textContent.trim(),entry=names[label];
    if(button.matches('.global-nav a,#workspace-tools-area a,.section-back'))entry={icon:navIcons[label]||'back',caption:label,labelled:true,tone:''};
    if(!entry&&/^(?:查看原消息|原消息|来源) \d+$/.test(label))entry={icon:'eye',caption:label,tone:''};
    if(!entry&&/^屏蔽(?:原发布人|转发人) \d+$/.test(label))entry={icon:'block',caption:label.startsWith('屏蔽转发人')?'屏蔽转发人':'屏蔽发布人',tone:'danger'};
    if(button.closest('#find-recent,#topics-suggestions'))entry=null;
    if(entry&&(button.getAttribute('type')==='submit'||(button.form&&button.type==='submit')||button.classList.contains('btn-primary'))&&!entry.labelled)entry=null;
    if(!entry){if(button.dataset.actionIcon){delete button.dataset.actionMode;delete button.dataset.actionIcon;delete button.dataset.actionCaption;delete button.dataset.actionTone;delete button.dataset.actionActive;button.style.removeProperty('--action-icon');if(button.dataset.actionOriginalLabel)button.setAttribute('aria-label',button.dataset.actionOriginalLabel);else button.removeAttribute('aria-label');}return;}
    if(!button.dataset.actionIcon&&button.hasAttribute('aria-label'))button.dataset.actionOriginalLabel=button.getAttribute('aria-label');
    button.dataset.actionMode=entry.labelled?'label':'icon';button.dataset.actionIcon=entry.icon;button.dataset.actionCaption=entry.caption;button.dataset.actionTone=entry.tone;
    button.dataset.actionActive=String(label==='已收藏'||label==='取消收藏');
    button.setAttribute('aria-label',button.dataset.actionOriginalLabel||label);
    button.style.setProperty('--action-icon','url("data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+paths[entry.icon]+'</svg>')+'")');
    if(active===button){if(button.disabled||!button.getClientRects().length)hide();else tip.textContent=button.getAttribute('aria-label');}
  }
  function refresh(root){if(root.nodeType!==1)return;if(root.matches(selector))decorate(root);root.querySelectorAll(selector).forEach(decorate);if(root.matches('summary'))disclosure(root);root.querySelectorAll('summary').forEach(disclosure);}
  function show(button){
    if(!button||button.disabled||(!button.dataset.actionIcon&&!button.dataset.disclosureLabel))return;
    if(button.matches('.summary-group-cover'))return;
    if(!tip){tip=document.createElement('div');tip.id='action-icon-tooltip';tip.setAttribute('role','tooltip');tip.setAttribute('popover','manual');document.body.appendChild(tip);}
    active=button;tip.textContent=button.dataset.disclosureLabel||button.getAttribute('aria-label');tip.showPopover();
    var rect=button.getBoundingClientRect(),box=tip.getBoundingClientRect();
    tip.style.left=Math.max(8,Math.min(innerWidth-box.width-8,rect.left+(rect.width-box.width)/2))+'px';
    tip.style.top=(rect.top>=box.height+12?rect.top-box.height-8:Math.min(innerHeight-box.height-8,rect.bottom+8))+'px';
  }
  document.addEventListener('pointerover',function(e){if(e.pointerType==='touch')return;var button=e.target.closest(selector+',summary');if(button&&!button.contains(e.relatedTarget))show(button);});
  document.addEventListener('pointerout',function(e){if(active&&active.contains(e.target)&&!active.contains(e.relatedTarget))hide();});
  document.addEventListener('focusin',function(e){show(e.target.closest(selector+',summary'));});
  document.addEventListener('focusout',hide);document.addEventListener('click',hide);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')hide();});
  document.addEventListener('scroll',hide,true);window.addEventListener('resize',hide);
  new MutationObserver(function(changes){var roots=new Set();changes.forEach(function(change){roots.add(change.target.nodeType===3?change.target.parentElement:change.target);});roots.forEach(refresh);if(active&&(!active.isConnected||!active.getClientRects().length))hide();}).observe(document.body,{childList:true,characterData:true,subtree:true,attributes:true,attributeFilter:['disabled','hidden','open']});
  document.addEventListener('toggle',function(e){if(e.target.matches('details'))refresh(e.target);},true);
  refresh(document.body);
})();
</script>

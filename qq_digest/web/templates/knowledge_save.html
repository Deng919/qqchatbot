<dialog id="knowledge-save-dialog" class="knowledge-save-dialog" aria-labelledby="knowledge-save-heading">
 <header class="knowledge-save-header"><h2 id="knowledge-save-heading">保存到知识库</h2><button class="btn btn-sm" type="button" onclick="closeKnowledgeSave()">关闭保存窗口</button></header>
 <p id="knowledge-save-scope" class="header-meta"></p>
 <form onsubmit="submitKnowledgeSave(event)">
  <div class="field"><label for="knowledge-save-title">标题</label><input id="knowledge-save-title" class="input" maxlength="200" required></div>
  <div class="field"><label for="knowledge-save-type">分类</label><select id="knowledge-save-type" class="input"><option value="experience">经验</option><option value="resource">资源</option></select></div>
  <div class="field"><label for="knowledge-save-reason">保存说明（可选）</label><textarea id="knowledge-save-reason" class="input" rows="2" maxlength="2000" placeholder="以后什么时候可以用到？"></textarea></div>
  <div class="field"><label for="knowledge-save-link">链接（可选）</label><input id="knowledge-save-link" class="input" type="url" maxlength="2048" placeholder="https://"></div>
  <details><summary>将保存的原消息全文</summary><div id="knowledge-save-preview" class="knowledge-save-preview"></div></details>
  <p id="knowledge-save-status" role="status"></p><div id="knowledge-save-result"></div><button id="knowledge-save-submit" class="btn btn-primary" type="submit" disabled>保存知识</button>
 </form>
</dialog>
<style>
.knowledge-save-dialog{width:min(540px,calc(100vw - 36px));max-height:calc(100vh - 40px);overflow:auto;border:1px solid var(--border);border-radius:16px;padding:24px;background:var(--surface);color:var(--text)}.knowledge-save-dialog::backdrop{background:rgb(20 32 27 / .35)}.knowledge-save-header{display:flex;justify-content:space-between;gap:16px;align-items:center}.knowledge-save-header h2{margin:0;font-size:22px}.knowledge-save-preview{white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto;line-height:1.7;margin:12px 0;padding:12px;background:var(--surface-subtle)}.knowledge-save-dialog select{width:100%}.knowledge-save-dialog #knowledge-save-result{margin:12px 0}.knowledge-save-dialog #knowledge-save-status{font-size:14px;overflow-wrap:anywhere}
</style>
<script>
var knowledgeSaveToken=0,knowledgeSaveTarget=null,knowledgeSaveBusy=false,knowledgeSaveReady=false,knowledgeSaveOpener=null;
function knowledgeSaveControls(){document.getElementById('knowledge-save-submit').disabled=knowledgeSaveBusy||!knowledgeSaveReady;document.getElementById('knowledge-save-submit').textContent=knowledgeSaveBusy?'正在保存…':'保存知识';['knowledge-save-title','knowledge-save-type','knowledge-save-reason','knowledge-save-link'].forEach(function(id){document.getElementById(id).disabled=knowledgeSaveBusy;});}
function openKnowledgeSave(groupId,msgId,opener){
 if(knowledgeSaveBusy)return;var token=++knowledgeSaveToken;knowledgeSaveTarget={group_id:Number(groupId),msg_id:String(msgId)};knowledgeSaveReady=false;knowledgeSaveOpener=opener||document.activeElement;['knowledge-save-title','knowledge-save-reason','knowledge-save-link'].forEach(function(id){document.getElementById(id).value='';});document.getElementById('knowledge-save-type').value='experience';document.getElementById('knowledge-save-preview').textContent='';document.getElementById('knowledge-save-result').textContent='';document.getElementById('knowledge-save-status').textContent='正在读取原消息…';document.getElementById('knowledge-save-scope').textContent='';knowledgeSaveControls();var dialog=document.getElementById('knowledge-save-dialog');if(!dialog.open)dialog.showModal();
 return api('GET','/api/knowledge/from-message?'+new URLSearchParams(knowledgeSaveTarget)).then(function(data){if(token!==knowledgeSaveToken||!dialog.open)return;document.getElementById('knowledge-save-scope').textContent=data.group_name+' · '+data.date;document.getElementById('knowledge-save-preview').textContent=data.text;if(!document.getElementById('knowledge-save-title').value.trim())document.getElementById('knowledge-save-title').value=data.text.trim().split('\n')[0].slice(0,80);knowledgeSaveReady=true;document.getElementById('knowledge-save-status').textContent='保留原文和来源。';document.getElementById('knowledge-save-title').focus();}).catch(function(e){if(token!==knowledgeSaveToken||!dialog.open)return;document.getElementById('knowledge-save-status').textContent='原消息读取失败：'+e.message;var retry=document.createElement('button');retry.type='button';retry.className='btn btn-sm';retry.textContent='重试读取';retry.onclick=function(){openKnowledgeSave(groupId,msgId,knowledgeSaveOpener);};document.getElementById('knowledge-save-result').appendChild(retry);}).finally(function(){if(token===knowledgeSaveToken)knowledgeSaveControls();});
}
function closeKnowledgeSave(){knowledgeSaveToken++;knowledgeSaveReady=false;document.getElementById('knowledge-save-dialog').close();if(knowledgeSaveOpener&&knowledgeSaveOpener.isConnected)knowledgeSaveOpener.focus({preventScroll:true});}
function submitKnowledgeSave(event){
 event.preventDefault();if(knowledgeSaveBusy||!knowledgeSaveReady)return;var token=knowledgeSaveToken,payload=Object.assign({},knowledgeSaveTarget,{title:document.getElementById('knowledge-save-title').value.trim(),item_type:document.getElementById('knowledge-save-type').value,reason:document.getElementById('knowledge-save-reason').value,link:document.getElementById('knowledge-save-link').value.trim()});if(!payload.title){document.getElementById('knowledge-save-status').textContent='请填写标题。';return;}knowledgeSaveBusy=true;knowledgeSaveControls();document.getElementById('knowledge-save-status').textContent='正在保存原文与来源…';
 return api('POST','/api/knowledge/from-message',payload).then(function(data){if(token!==knowledgeSaveToken||!document.getElementById('knowledge-save-dialog').open)return;knowledgeSaveReady=false;document.getElementById('knowledge-save-status').textContent=data.reused?'这条原消息已经入库，已保留原来的标题和说明。':'已保存到知识库。';var host=document.getElementById('knowledge-save-result');host.textContent='';var link=document.createElement('a');link.className='btn btn-sm';link.textContent='查看已保存知识';link.href='/knowledge?item_id='+data.item_id;host.appendChild(link);}).catch(function(e){if(token!==knowledgeSaveToken||!document.getElementById('knowledge-save-dialog').open)return;document.getElementById('knowledge-save-status').textContent='未保存：'+e.message+'。输入已保留，可以重试。';}).finally(function(){knowledgeSaveBusy=false;knowledgeSaveControls();});
}
document.getElementById('knowledge-save-dialog').addEventListener('cancel',function(event){event.preventDefault();closeKnowledgeSave();});document.getElementById('knowledge-save-dialog').addEventListener('keydown',function(event){event.stopPropagation();});
</script>

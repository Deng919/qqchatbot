<section class="card ai-settings-card" aria-labelledby="cockpit-settings-title">
  <div class="card-header" id="cockpit-settings-title">Cockpit AI</div>
  <p class="settings-note">摘要、问答、识图和二手识别共用此连接。密钥保存在本机，不在页面显示。</p>
  <form id="cockpit-form" onsubmit="saveCockpit(event)">
    <fieldset id="cockpit-fields" disabled>
      <div class="field"><label for="cockpit-url">接口地址</label><input id="cockpit-url" class="input" type="url" maxlength="2000" required placeholder="http://127.0.0.1:62406/v1"></div>
      <div class="field"><label for="cockpit-model">模型</label><input id="cockpit-model" class="input" maxlength="200" required></div>
      <div class="field"><label for="cockpit-key">API Key（留空保留已有密钥）</label><input id="cockpit-key" class="input" type="password" autocomplete="new-password" spellcheck="false" maxlength="4096"><span id="cockpit-key-status" class="settings-note"></span></div>
      <label><input id="cockpit-json" type="checkbox"> 请求 JSON 模式</label>
      <div class="settings-actions"><button class="btn btn-primary" type="submit">保存连接</button><button id="cockpit-test" class="btn" type="button" onclick="testCockpit()">测试已保存连接</button></div>
    </fieldset>
  </form>
  <p id="cockpit-status" class="settings-note" role="status"></p>
  <button class="btn" type="button" id="cockpit-reload" onclick="loadAISettings()">重新载入</button>
  <p class="settings-note">测试只发送示例请求，不含聊天内容。修改后需先保存。</p>
</section>
<style>.ai-settings-card{max-width:680px}.settings-note{margin:12px 0;color:var(--text-soft);font-size:13px}.settings-actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}#cockpit-fields{border:0;padding:0;margin:0;min-width:0}</style>
<script>
  var cockpitState=null,cockpitBusy=false,cockpitDirty=false;
  function cockpitNode(id){return document.getElementById('cockpit-'+id);}
  function cockpitControls(){cockpitNode('fields').disabled=cockpitBusy||!cockpitState||!cockpitState.available;cockpitNode('test').disabled=cockpitBusy||cockpitDirty;cockpitNode('reload').disabled=cockpitBusy;}
  function cockpitApply(data){cockpitState=data;cockpitNode('url').value=data.base_url;cockpitNode('model').value=data.model;cockpitNode('json').checked=data.json_mode;cockpitNode('key').value='';cockpitNode('key-status').textContent=data.key_configured?'已有本地密钥':'尚未配置密钥';cockpitDirty=false;}
  function cockpitStatus(text){cockpitNode('status').textContent=text;}
  async function loadAISettings(){if(cockpitBusy)return;cockpitBusy=true;cockpitControls();try{cockpitApply(await api('GET','/api/ai-settings'));cockpitStatus('已读取保存的连接。');}catch(error){cockpitStatus(error.message);}finally{cockpitBusy=false;cockpitControls();}}
  cockpitNode('form').addEventListener('input',function(){cockpitDirty=!!cockpitNode('key').value||!cockpitState||cockpitNode('url').value.trim()!==cockpitState.base_url||cockpitNode('model').value.trim()!==cockpitState.model||cockpitNode('json').checked!==cockpitState.json_mode;cockpitStatus(cockpitDirty?'设置尚未保存，请先保存再测试。':'已读取保存的连接。');cockpitControls();});
  async function saveCockpit(event){event.preventDefault();if(cockpitBusy||!cockpitState)return;cockpitBusy=true;cockpitControls();try{var data=await api('PUT','/api/ai-settings',{expected_revision:cockpitState.revision,base_url:cockpitNode('url').value.trim(),model:cockpitNode('model').value.trim(),json_mode:cockpitNode('json').checked,api_key:cockpitNode('key').value});cockpitApply(data);cockpitStatus('连接已保存。');}catch(error){cockpitStatus(error.message);}finally{cockpitBusy=false;cockpitControls();}}
  async function testCockpit(){if(cockpitBusy||cockpitDirty||!cockpitState)return;cockpitBusy=true;cockpitControls();try{await api('POST','/api/ai-settings/test',{expected_revision:cockpitState.revision});cockpitStatus('Cockpit 连接测试成功。');}catch(error){cockpitStatus(error.message);}finally{cockpitBusy=false;cockpitControls();}}
  document.addEventListener('qq-digest-check-unsaved',function(event){if(cockpitDirty||(typeof usageDraftDirty!=='undefined'&&usageDraftDirty))event.preventDefault();});
  loadAISettings();
</script>
{% include "ai_usage_settings.html" %}

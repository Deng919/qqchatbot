<script>
(function(){
  var selected=null,busy=false,state=null;
  var result=document.getElementById('version-result'),list=document.getElementById('version-list'),preview=document.getElementById('version-preview');
  function message(text){result.textContent=text;result.hidden=false;}
  function setBusy(value){busy=value;document.querySelectorAll('#versions-refresh,#version-confirm,#version-cancel,#version-list button,#version-recover').forEach(function(button){button.disabled=value;});}
  async function api(path,body){var response=await fetch('/api/desktop-updates'+path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});var data=await response.json();if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:'操作未完成，请刷新后重试');return data;}
  function pick(action,item){selected={action:action,item:item};document.getElementById('version-preview-title').textContent=action==='clean'?'清理旧版本':'切换版本';document.getElementById('version-preview-text').textContent=action==='clean'?'删除 '+item.version+' 的程序文件（'+size(item.size_bytes)+'），保留用户数据。':'备份数据后切换到 '+item.version+'，程序会关闭并重新打开。';document.getElementById('version-confirm').textContent=action==='clean'?'清理此版本':'备份并切换';preview.hidden=false;preview.scrollIntoView({block:'nearest',behavior:'smooth'});}
  function size(bytes){return (bytes/1024/1024).toFixed(1)+' MB';}
  async function load(){if(busy)return;setBusy(true);selected=null;preview.hidden=true;try{state=await api('');list.replaceChildren();document.getElementById('version-current').textContent=state.current;var current=state.versions.find(function(item){return item.version===state.current;});state.versions.forEach(function(item){var row=document.createElement('div');row.className='release-item';var details=document.createElement('div');details.className='release-details';var title=document.createElement('strong');title.textContent=item.version+(item.version===state.current?' · 当前':item.version===state.rollback?' · 可回退':'');var note=document.createElement('small');note.textContent=size(item.size_bytes)+(item.valid?'':' · 文件校验失败');details.append(title,note);var actions=document.createElement('div');actions.className='release-actions';if(item.version!==state.current&&item.valid&&current&&item.compatibility===current.compatibility){var change=document.createElement('button');change.className='btn';change.textContent=item.version===state.rollback?'回退到此版本':'切换到此版本';change.addEventListener('click',function(){pick('switch',item);});actions.append(change);}else if(item.version!==state.current&&item.valid){note.textContent+=' · 数据格式不兼容';}if(item.cleanable){var clean=document.createElement('button');clean.className='btn';clean.textContent='清理';clean.addEventListener('click',function(){pick('clean',item);});actions.append(clean);}else if(item.reasons&&item.reasons.length){var reason=document.createElement('small');reason.textContent=item.reasons.join('；');details.append(reason);}row.append(details,actions);list.append(row);});document.getElementById('version-empty').hidden=state.versions.length>1;var tx=state.transaction||{};document.getElementById('version-recover').hidden=!tx.recoverable;if(tx.status==='rolled_back')message('启动失败，已退回原版本。');else if(tx.error)message(tx.error);else if(tx.status==='success')message('版本切换完成。');else if(tx.status==='prepared'||tx.status==='waiting'||tx.status==='starting'||tx.status==='committing')message('正在切换版本…');else if(!tx.status)result.hidden=true;}catch(error){message(error.message);document.getElementById('version-current').textContent='无法读取';}finally{setBusy(false);}}
  document.getElementById('versions-refresh').addEventListener('click',load);
  document.getElementById('version-cancel').addEventListener('click',function(){selected=null;preview.hidden=true;});
  document.getElementById('version-confirm').addEventListener('click',async function(){if(!selected||busy)return;var operation=selected;setBusy(true);try{var data=await api('/'+operation.action,{version:operation.item.version,digest:operation.item.digest});selected=null;preview.hidden=true;if(operation.action==='switch'){message('备份完成，正在重新打开程序…');return;}message('旧版本已清理。');}catch(error){message(error.message);}finally{if(operation.action==='clean'){setBusy(false);await load();}else if(selected)setBusy(false);}});
  document.getElementById('version-recover').addEventListener('click',async function(){if(busy)return;setBusy(true);try{await api('/recover',{});message('正在恢复原版本…');}catch(error){message(error.message);setBusy(false);}});
  load();
})();
</script>

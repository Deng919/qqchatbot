{% include "group_batch_feedback.html" %}
<section class="card" aria-label="批量群操作" style="padding:16px;margin-bottom:20px">
  <div class="group-batch-toolbar"><div class="field"><label for="group-batch-select">选择群聊</label><select id="group-batch-select" data-group-selector="required"><option value="">选择群聊</option></select></div><button class="btn" type="button" onclick="openBatchGroupUpdate()">更新所选群消息</button><button class="btn" type="button" onclick="openBatchGroupSettings()">批量设置</button><button class="btn" type="button" onclick="readBatchGroupAttachments()">读取所选群附件</button></div>
  <div id="group-batch-feedback" role="status" hidden></div>
</section>
<dialog id="group-batch-settings-dialog" aria-labelledby="group-batch-settings-title"><h2 id="group-batch-settings-title">批量设置</h2><p id="group-batch-settings-count" class="header-meta"></p>
  <form id="group-batch-settings-form" onsubmit="saveBatchGroupSettings(event)">
    {% for key,label in [('enabled','关注'),('daily_summary','每日摘要'),('read_images','读取图片'),('read_files','读取文件'),('important_candidates','知识候选')] %}
    <div class="group-batch-settings-row"><label><input type="checkbox" data-batch-apply="{{ key }}">{{ label }}</label><select class="input" id="batch-value-{{ key }}"><option value="true">开启</option><option value="false">关闭</option></select></div>
    {% endfor %}
    <div class="group-batch-settings-row"><label><input type="checkbox" data-batch-apply="category">群分类</label><select class="input" id="batch-value-category"><option value="tech">技术</option><option value="resource">资源</option><option value="project">项目</option><option value="study">学习</option><option value="general">综合</option></select></div>
    <div class="group-batch-settings-row"><label><input type="checkbox" data-batch-apply="keywords">重点关键词</label><input class="input" id="batch-value-keywords" placeholder="逗号分隔，替换所选群关键词"></div>
    <div class="group-batch-settings-row"><label><input type="checkbox" data-batch-apply="collection_window_days">首次导入天数</label><input class="input" id="batch-value-collection_window_days" type="number" min="1" max="365" value="30"></div>
    <p id="group-batch-settings-error" role="status"></p><div class="actions"><button class="btn" type="button" onclick="document.getElementById('group-batch-settings-dialog').close()">取消</button><button class="btn btn-primary" type="submit">应用所选设置</button></div>
  </form>
</dialog>
<script>
var groupBatchBusy=false,groupBatchSettingsIds=[];
function syncBatchGroupFields(){document.querySelectorAll('[data-batch-apply]').forEach(function(input){document.getElementById('batch-value-'+input.dataset.batchApply).disabled=!input.checked;});}
document.querySelectorAll('[data-batch-apply]').forEach(function(input){input.addEventListener('change',syncBatchGroupFields);});
function batchGroupIds(){var ids=GroupSelector.value(document.getElementById('group-batch-select'));if(!ids||!ids.length)throw new Error('请选择至少一个群聊');return ids;}
function refreshGroupBatchSelections(){var select=document.getElementById('group-batch-select');if(!select)return;var chosen=select.groupSelector?select.groupSelector.ids():[];select.textContent='';var placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='选择群聊';select.appendChild(placeholder);configuredGroups.forEach(function(group){var option=document.createElement('option');option.value=group.group_id;option.textContent=group.name;select.appendChild(option);});if(select.groupSelector)select.groupSelector.setSelected(chosen);}
function openBatchGroupUpdate(){try{var ids=batchGroupIds(),p=new URLSearchParams();GroupSelector.appendParams(p,ids);location.href='/collect?'+p;}catch(e){toast(e.message,'error');}}
function openBatchGroupSettings(){if(groupBatchBusy)return;try{groupBatchSettingsIds=batchGroupIds().slice();}catch(e){toast(e.message,'error');return;}document.querySelectorAll('[data-batch-apply]').forEach(function(input){input.checked=false;});syncBatchGroupFields();document.getElementById('group-batch-settings-error').textContent='';document.getElementById('group-batch-settings-count').textContent='本次应用于 '+groupBatchSettingsIds.length+' 个群 · 只修改勾选项';document.getElementById('group-batch-settings-dialog').showModal();}
function setGroupBatchBusy(busy){groupBatchBusy=busy;document.getElementById('group-batch-select').disabled=busy;document.querySelectorAll('.group-batch-toolbar button').forEach(function(button){button.disabled=busy;});document.getElementById('group-batch-settings-form').inert=busy;}
function executeGroupBatch(url,payload){if(groupBatchBusy)return Promise.resolve();setGroupBatchBusy(true);var frozen=JSON.parse(JSON.stringify(payload)),host=document.getElementById('group-batch-feedback');host.hidden=false;host.textContent='正在处理 '+(payload.group_ids||payload.groups).length+' 个群…';return api('POST',url,frozen).then(function(data){renderGroupBatchFeedback(host,data,frozen,function(retry){executeGroupBatch(url,retry);});loadGroups();return data;}).catch(function(e){host.textContent=e.message;throw e;}).finally(function(){setGroupBatchBusy(false);});}
function saveBatchGroupSettings(event){event.preventDefault();if(groupBatchBusy)return;var patch={};document.querySelectorAll('[data-batch-apply]:checked').forEach(function(input){var key=input.dataset.batchApply,value=document.getElementById('batch-value-'+key).value;patch[key]=key==='keywords'?Array.from(new Set(value.split(/[,，]/).map(function(x){return x.trim();}).filter(Boolean))):key==='collection_window_days'?Number(value):key==='category'?value:value==='true';});if(!Object.keys(patch).length){document.getElementById('group-batch-settings-error').textContent='请勾选要修改的设置';return;}executeGroupBatch('/api/groups/batch/settings',{group_ids:groupBatchSettingsIds.slice(),patch:patch}).then(function(){document.getElementById('group-batch-settings-dialog').close();}).catch(function(e){document.getElementById('group-batch-settings-error').textContent=e.message;});}
function readBatchGroupAttachments(){try{var ids=batchGroupIds();executeGroupBatch('/api/groups/batch/attachments/read',{group_ids:ids}).catch(function(){});}catch(e){toast(e.message,'error');}}
function addSelectedDiscoveredGroups(){var select=document.getElementById('discover-batch-select');try{var ids=GroupSelector.value(select);if(!ids||!ids.length)throw new Error('请选择待添加的群');var unavailable=ids.filter(function(id){return !discoveredBatchGroups.some(function(group){return Number(group.group_id)===id;});});if(unavailable.length)throw new Error('以下已选群不在待添加列表中，请重新确认：'+unavailable.join('、'));var groups=discoveredBatchGroups.filter(function(group){return ids.includes(Number(group.group_id));}).map(function(group){return {group_id:Number(group.group_id),name:group.name};});executeGroupBatch('/api/groups/batch/add',{groups:groups}).catch(function(){});}catch(e){toast(e.message,'error');}}
</script>

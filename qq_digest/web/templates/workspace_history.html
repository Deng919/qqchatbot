<style>
  .page-heading { display:flex;align-items:center;gap:12px;min-width:0; }
  .workspace-history { display:flex;gap:3px;flex-shrink:0; }
  .workspace-history-button { display:grid;place-items:center;width:32px;min-height:34px;padding:0;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--text-soft);cursor:pointer; }
  .workspace-history-button:hover:not(:disabled) { background:var(--surface-strong);border-color:var(--border-strong);color:var(--text); }
  .workspace-history-button:disabled { opacity:.35;cursor:default; }
  .workspace-history-button svg { width:18px;height:18px; }
</style>
<nav class="workspace-history" aria-label="页面历史">
  <button id="workspace-back" class="workspace-history-button" type="button" aria-label="后退" disabled onclick="workspaceGo(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></button>
  <button id="workspace-forward" class="workspace-history-button" type="button" aria-label="前进" disabled onclick="workspaceGo(1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-7-7 7 7-7 7"/></svg></button>
</nav>
<script>
  var workspaceNavigationApproved=false;
  function workspaceHasUnsaved(){return !document.dispatchEvent(new Event('qq-digest-check-unsaved',{cancelable:true}));}
  function workspaceHistoryTarget(step) {
    if(window.qqDesktopPage)return window.qqDesktopPage.target(step);
    if(!window.navigation)return null;
    var entries=navigation.entries(),at=entries.findIndex(function(entry){return entry.key===navigation.currentEntry.key;}),entry=entries[at+step];
    if(!entry)return null;
    try{var url=new URL(entry.url);return url.origin===location.origin&&!/^\/(?:api(?:\/|$)|login\/?$|logout\/?$|desktop-start\/?$|desktop-info\/?$)/.test(url.pathname)?entry:null;}catch(error){return null;}
  }
  function workspaceHistoryUpdate() {
    document.getElementById('workspace-back').disabled=!workspaceHistoryTarget(-1);
    document.getElementById('workspace-forward').disabled=!workspaceHistoryTarget(1);
  }
  function workspaceGo(step) { if(workspaceHistoryTarget(step))history.go(step); }
  function workspaceHistoryPush() {
    if(!window.navigation||window.workspaceHistoryRestoring)return;
    var state=Object.assign({},history.state);
    if(state.qqDigestReading&&typeof summaryScrollPosition==='function')state.qqDigestReading=Object.assign({},state.qqDigestReading,{scroll:summaryScrollPosition()});
    history.replaceState(state,'',location.href);history.pushState(state,'',location.href);
  }
  if(!window.qqDesktopPage&&window.navigation){
    navigation.addEventListener('navigate',function(event){
      if(event.navigationType==='replace'||event.hashChange||event.downloadRequest||window.workspaceHistoryRestoring||workspaceNavigationApproved||!event.cancelable)return;
      if(workspaceHasUnsaved()&&!confirm('有未保存的修改，确定离开并放弃这些修改？')){event.preventDefault();return;}
      if(!event.destination.sameDocument||event.navigationType==='traverse'||event.navigationType==='reload')workspaceNavigationApproved=true;
    });
    navigation.addEventListener('navigateerror',function(){if(!window.workspaceHistoryRestoring)workspaceNavigationApproved=false;});
  }
  window.addEventListener('beforeunload',function(event){
    if(window.qqDesktopPage)return;
    if(workspaceNavigationApproved||window.workspaceHistoryRestoring){workspaceNavigationApproved=false;return;}
    if(workspaceHasUnsaved()){event.preventDefault();event.returnValue='';}
  });
  if(!window.qqDesktopPage&&window.navigation)navigation.addEventListener('currententrychange',function(event){
    if(event.navigationType==='traverse'&&event.from.sameDocument){window.workspaceHistoryRestoring=true;try{window.dispatchEvent(new Event('qq-digest-workspace-restore'));}finally{window.workspaceHistoryRestoring=false;workspaceNavigationApproved=false;}}
    workspaceHistoryUpdate();
  });
  window.addEventListener('pageshow',workspaceHistoryUpdate);
  document.addEventListener('keydown',function(event){
    if(event.altKey&&!event.ctrlKey&&!event.metaKey&&!event.shiftKey&&['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();workspaceGo(event.key==='ArrowLeft'?-1:1);}
  });
  workspaceHistoryUpdate();
</script>

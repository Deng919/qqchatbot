<script>
var marketListToken=0,marketDetailToken=0,marketBlockToken=0,marketPageNumber=1,marketSelected=null,marketSaving=false,marketBlocking=false,marketUpdating=false,marketProgressTimer=null;
function marketN(id){return document.getElementById(id);}
function marketNode(tag,cls,text){var node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;}
function marketButton(text,action){var node=marketNode('button','btn btn-sm',text);node.type='button';node.onclick=action;return node;}
function marketStatus(value){return {unknown:'状态未确认',sold:'已出',fulfilled:'已收'}[value]||'状态未确认';}
function marketDate(value){return value?new Date(value).toLocaleString('zh-CN'):'时间未注明';}
function marketParams(){var params=new URLSearchParams({page:String(marketPageNumber)});[['q','market-q'],['group_id','market-group'],['direction','market-direction'],['status','market-status'],['date_from','market-from'],['date_to','market-to'],['min_price','market-min'],['max_price','market-max']].forEach(function(pair){var value=marketN(pair[1]).value;if(value)params.set(pair[0],value);});if(marketN('market-favorites').checked)params.set('favorite','true');return params;}
function marketFilter(event){if(event)event.preventDefault();marketPageNumber=1;marketClose();marketLoad();}
function marketPage(step){marketPageNumber+=step;marketClose();marketLoad();}
function marketRecent(){marketN('market-from').value='';marketN('market-to').value='';marketN('market-min').value='';marketN('market-max').value='';marketN('market-status').value='all';marketFilter();}
function marketLoad(){var token=++marketListToken,params=marketParams();marketN('market-count').textContent='正在读取交易信息…';
 return api('GET','/api/secondhand?'+params).then(function(data){if(token!==marketListToken)return;
  if(!params.has('date_from'))marketN('market-from').value=data.date_from;if(!params.has('date_to'))marketN('market-to').value=data.date_to;marketPageNumber=data.page;
  var host=marketN('market-list');host.textContent='';marketN('market-count').textContent=data.date_from+' 至 '+data.date_to+' · '+data.total+' 件物品';
  if(!data.items.length)host.appendChild(marketNode('p','market-empty','没有匹配的交易信息。可调整筛选，或点击“更新交易信息”导入本地二手群。'));
  data.items.forEach(function(item){var row=marketNode('article','market-item');row.appendChild(marketButton((item.direction==='want'?'求购 · ':'')+item.title,function(){marketOpen(item.item_id);}));row.children[0].className='market-item-title';row.appendChild(marketNode('span','market-item-price',item.price_text||'价格未注明'));row.appendChild(marketNode('p','market-item-description',item.description||item.evidence));row.appendChild(marketNode('div','market-item-meta',marketStatus(item.status)+' · '+(item.seller_name||item.seller_qq||'卖家身份未确认')+' · '+(item.original_time_unknown?'原时间未确认，转发记录于 ':'')+marketDate(item.published_at)+' · '+item.group_count+' 个群 / '+item.source_count+' 条来源'+(item.favorite?' · 已收藏':'')+(item.possible_duplicate?' · 疑似重复':'')+(item.incomplete?' · 来源信息不完整':'')));host.appendChild(row);});
  var pages=Math.max(1,Math.ceil(data.total/data.page_size));marketN('market-pages').hidden=pages<=1;marketN('market-prev').disabled=data.page<=1;marketN('market-next').disabled=data.page>=pages;marketN('market-page-label').textContent=data.page+' / '+pages;
 }).catch(function(error){if(token===marketListToken)marketN('market-count').textContent='读取失败：'+error.message;});}
function marketClearSource(host){host._marketSourceToken=(host._marketSourceToken||0)+1;destroyMessageContext(host._marketContext);host._marketContext=null;host.textContent="";}
function marketOpen(key){marketClearSource(marketN("market-context"));var token=++marketDetailToken;marketSelected=null;marketSaving=false;marketN('market-dialog').showModal();marketN('market-title').textContent='正在读取…';marketN('market-description').textContent='';marketN('market-sources').textContent='';marketN('market-meta').textContent='';marketN('market-detail-note').textContent='';marketN('market-favorite').disabled=true;marketN('market-block-seller').hidden=true;destroyMessageContext(marketN('market-context'));
 return api('GET','/api/secondhand/items/'+encodeURIComponent(key)).then(function(data){if(token!==marketDetailToken)return;marketSelected=data;var item=data.item;marketN('market-title').textContent=item.title;marketN('market-description').textContent=item.description||item.evidence;marketN('market-meta').textContent=(item.price_text||'价格未注明')+' · '+marketStatus(item.status)+' · '+(item.seller_name||'')+(item.seller_qq?' QQ '+item.seller_qq:' · 卖家身份未确认');marketN('market-favorite').disabled=false;marketN('market-favorite').textContent=data.favorite?'取消收藏':'收藏';marketN('market-block-seller').hidden=!item.seller_qq;marketN('market-block-seller').textContent='屏蔽原发布人 '+(item.seller_qq||'');
 data.sources.forEach(function(source){var card=marketNode('section','market-source');card.appendChild(marketNode('div','header-meta',source.group_name+(source.original_time_unknown?' · 原发布时间未确认，记录于 ':' · 原发布时间 ')+marketDate(source.published_at)+(source.forwarded_at?' · 转发于 '+marketDate(source.forwarded_at):'')));card.appendChild(marketNode('p','',source.evidence));card.appendChild(marketNode('p','header-meta',(source.price_text||'价格未注明')+' · '+marketStatus(source.status)+(source.incomplete?' · 原时间或附件信息不完整':'')));var actions=marketNode('div','actions');actions.appendChild(marketButton('查看原消息与图片',function(){marketSource(source,marketN('market-context'));}));if(source.forwarder_qq)actions.appendChild(marketButton('屏蔽转发人 '+source.forwarder_qq,function(){marketRequestBlock(source.forwarder_qq);}));card.appendChild(actions);marketN('market-sources').appendChild(card);});
 }).catch(function(error){if(token===marketDetailToken)marketN('market-detail-note').textContent='详情读取失败：'+error.message;});}
function marketClose(){marketDetailToken++;marketSelected=null;marketN('market-dialog').close();marketClearSource(marketN('market-context'));}
function marketFavorite(){if(!marketSelected||marketSaving)return;var selected=marketSelected,token=marketDetailToken;marketSaving=true;marketN('market-favorite').disabled=true;api('PATCH','/api/secondhand/items/'+selected.item_id,{favorite:!selected.favorite}).then(function(){if(token!==marketDetailToken)return;selected.favorite=!selected.favorite;marketN('market-favorite').textContent=selected.favorite?'取消收藏':'收藏';marketLoad();}).catch(function(error){if(token===marketDetailToken)marketN('market-detail-note').textContent='收藏保存失败：'+error.message;}).finally(function(){if(token===marketDetailToken){marketSaving=false;marketN('market-favorite').disabled=false;}});}
function marketSource(source,host){destroyMessageContext(host._marketContext);host.textContent='';var token=(host._marketSourceToken||0)+1;host._marketSourceToken=token;var attachments=marketNode('div','market-source-images'),context=marketNode('div','');host.appendChild(attachments);host.appendChild(context);host._marketContext=context;var dialog=host===marketN('market-context')?marketN('market-dialog'):marketN('market-unavailable-dialog');function current(){return host._marketSourceToken===token&&dialog.open;}
 mountMessageContext(context,{groupId:source.group_id,citedId:source.msg_id,url:'/api/secondhand/source?'+new URLSearchParams({group_id:source.group_id,msg_id:source.msg_id}),isCurrent:current});
 api('GET','/api/secondhand/attachments?'+new URLSearchParams({group_id:source.group_id,msg_id:source.msg_id})).then(function(data){if(!current())return;if(data.source_incomplete)attachments.appendChild(marketNode('p','header-meta','附件原库读取不完整，可能有未获取的图片。'));data.items.forEach(function(item){var box=marketNode('section','market-source');box.appendChild(marketNode('p','',item.name+' · '+({disabled:'图片读取未开启',pending:'等待读取',missing:'原图未下载',error:'读取失败',success:'已识别',partial:'部分识别',budget_paused:'达到调用上限'}[item.status]||item.status)));if(item.text)box.appendChild(marketNode('p','market-text',item.text));if(item.url&&item.url.startsWith('/api/secondhand/image?')){var image=marketNode('img','market-original-image');image.alt=item.name;image.loading='lazy';image.src=item.url;image.onerror=function(){image.remove();box.appendChild(marketNode('p','header-meta','原图未下载或无法核实来源。'));};box.appendChild(image);}attachments.appendChild(box);});}).catch(function(error){if(current())attachments.textContent='附件信息读取失败：'+error.message;});}
function marketShowBlocks(){marketN('market-blocks-dialog').showModal();marketN('market-block-note').textContent='';marketLoadBlocks();}
function marketLoadBlocks(){var token=++marketBlockToken;api('GET','/api/secondhand/blocks').then(function(data){if(token!==marketBlockToken)return;var host=marketN('market-block-list');host.textContent='';if(!data.items.length)host.appendChild(marketNode('p','header-meta','暂无屏蔽账号'));data.items.forEach(function(item){var row=marketNode('div','market-block-row');row.appendChild(marketNode('span','','QQ '+item.qq));row.appendChild(marketButton('解除屏蔽',function(){var button=this;button.disabled=true;api('DELETE','/api/secondhand/blocks/'+item.qq).then(function(){marketLoadBlocks();marketLoad();}).catch(function(error){marketN('market-block-note').textContent=error.message;button.disabled=false;});}));host.appendChild(row);});}).catch(function(error){if(token===marketBlockToken)marketN('market-block-note').textContent=error.message;});}
function marketRequestBlock(qq){marketN('market-block-qq').value=String(qq);marketShowBlocks();marketN('market-block-note').textContent='确认屏蔽 QQ '+qq+'，其在二手板块的所有来源将隐藏。';}
function marketBlockSeller(){if(marketSelected&&marketSelected.item.seller_qq)marketRequestBlock(marketSelected.item.seller_qq);}
function marketBlock(event){if(event)event.preventDefault();if(marketBlocking)return;var raw=marketN('market-block-qq').value.trim(),qq=Number(raw);if(!/^\d+$/.test(raw)||!Number.isSafeInteger(qq)||qq<=0){marketN('market-block-note').textContent='请输入有效 QQ 号';return;}marketBlocking=true;marketN('market-block-submit').disabled=true;api('POST','/api/secondhand/blocks',{qq:qq}).then(function(){marketN('market-block-note').textContent='已屏蔽；聊天原记录保留。';marketN('market-block-qq').value='';marketClose();marketLoadBlocks();marketLoad();}).catch(function(error){marketN('market-block-note').textContent='屏蔽失败：'+error.message;}).finally(function(){marketBlocking=false;marketN('market-block-submit').disabled=false;});}
function marketLoadGroups(){return api('GET','/api/secondhand/groups').then(function(data){var select=marketN('market-group'),old=select.value;select.textContent='';var all=marketNode('option','','全部二手群');all.value='';select.appendChild(all);marketN('market-group-settings').textContent='';marketN('market-groups-title').textContent='已接入 '+data.groups.length+' 个二手群';data.groups.forEach(function(group){var option=marketNode('option','',group.name);option.value=String(group.group_id);select.appendChild(option);var row=marketNode('div','market-group-row');row.appendChild(marketNode('span','',group.name+(group.enabled?'':' · 已停用')+' · 图片读取'+(group.read_images?'已开':'未开')));var link=marketNode('a','','管理群聊');link.href='/groups';row.appendChild(link);marketN('market-group-settings').appendChild(row);});select.value=old;marketN('market-groups-description').textContent=data.groups.length?'仅整理上述群聊，不影响普通群摘要。':'尚未导入，点击“更新交易信息”识别并导入本地二手群。';});}
function marketProgress(){clearTimeout(marketProgressTimer);api('GET','/api/secondhand/progress').then(function(data){if(data.running){marketUpdating=true;marketN('market-refresh').disabled=true;marketN('market-progress').hidden=false;marketN('market-progress').textContent=data.message;marketProgressTimer=setTimeout(marketProgress,1500);}else if(marketUpdating&&!marketOwnUpdate){marketUpdating=false;marketN('market-refresh').disabled=false;marketN('market-progress').textContent='更新已结束，请查看列表与未解析来源。';marketLoadGroups();marketLoad();}}).catch(function(){if(marketUpdating)marketProgressTimer=setTimeout(marketProgress,3000);});}
var marketOwnUpdate=false;
function marketRefresh(){if(marketUpdating)return;marketUpdating=true;marketOwnUpdate=true;marketN('market-refresh').disabled=true;marketN('market-progress').hidden=false;marketN('market-progress').textContent='正在导入本地二手群并整理交易信息…';marketProgressTimer=setTimeout(marketProgress,1000);api('POST','/api/secondhand/refresh',{date_from:marketN('market-from').value||null,date_to:marketN('market-to').value||null}).then(function(result){marketN('market-progress').textContent='本次读取 '+result.collected+' 条消息，新增归档 '+result.inserted+' 条；整理 '+result.processed+' 条来源，提取 '+result.offers+' 条商品记录。'+(result.unavailable?' '+result.unavailable+' 条图片／转发未解析。':'')+(result.failed?' '+result.failed+' 条识别失败，可重试。':'')+'\n'+(result.warnings||[]).join('\n');marketLoadGroups();marketLoad();}).catch(function(error){marketN('market-progress').textContent='更新失败：'+error.message+'。已有条目保留，可重试。';}).finally(function(){clearTimeout(marketProgressTimer);marketUpdating=false;marketOwnUpdate=false;marketN('market-refresh').disabled=false;});}
function marketUnavailable(){marketClearSource(marketN('market-unavailable-context'));marketN('market-unavailable-dialog').showModal();var host=marketN('market-unavailable-list');host.textContent='正在读取…';api('GET','/api/secondhand/unavailable').then(function(data){host.textContent='';if(!data.items.length)host.appendChild(marketNode('p','','没有记录到未解析来源；图片读取关闭或源库不完整仍可能造成缺失，见群设置和更新结果。'));data.items.forEach(function(source){var row=marketNode('section','market-source');row.appendChild(marketNode('p','',source.group_name+' · '+source.note));row.appendChild(marketButton('查看原消息',function(){marketSource(source,marketN('market-unavailable-context'));}));host.appendChild(row);});}).catch(function(error){host.textContent=error.message;});}
function marketInit(){marketLoadGroups().then(marketLoad).catch(function(error){marketN('market-count').textContent='群列表读取失败：'+error.message;});marketProgress();marketN('market-dialog').addEventListener('cancel',function(){marketDetailToken++;marketSelected=null;marketClearSource(marketN('market-context'));});marketN('market-unavailable-dialog').addEventListener('cancel',function(){marketClearSource(marketN('market-unavailable-context'));});}
marketInit();
</script>

<script>
var marketListToken=0,marketDetailToken=0,marketBlockToken=0,marketPageNumber=1,marketSelected=null,marketSaving=false,marketBlocking=false,marketUpdating=false,marketProgressTimer=null,marketLane='sale',marketCategory='all',marketCategories=[];
function marketN(id){return document.getElementById(id);}
function marketNode(tag,cls,text){var node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;}
function marketButton(text,action){var node=marketNode('button','btn btn-sm',text);node.type='button';node.onclick=action;return node;}
function marketStatus(value){return {unknown:'状态未确认',sold:'已出',fulfilled:'已收'}[value]||'状态未确认';}
function marketFlags(item){var flags=(item.behavior_flags||[]).slice();if(item.bundle_mode==='bundle'||item.bundle_mode==='collection')flags.unshift((item.bundle_mode==='bundle'?'打包交易':'同帖清单')+' · '+(item.bundle_count||0)+'项');return flags;}
function marketTags(item){var host=marketNode('div','market-item-tags');marketFlags(item).forEach(function(flag){host.appendChild(marketNode('span','market-tag',flag));});return host;}
function marketDate(value){return value?new Date(value).toLocaleString('zh-CN'):'时间未注明';}
function marketParams(){var params=new URLSearchParams({page:String(marketPageNumber),grouped:'true',lane:marketLane,category:marketCategory});[['q','market-q'],['group_id','market-group'],['status','market-status'],['date_from','market-from'],['date_to','market-to'],['min_price','market-min'],['max_price','market-max']].forEach(function(pair){var value=marketN(pair[1]).value;if(value)params.set(pair[0],value);});if(marketN('market-favorites').checked)params.set('favorite','true');return params;}
function marketSwitchLane(lane){marketLane=lane;marketPageNumber=1;marketClose();marketN('market-list').textContent='';marketLaneTabs(null);return marketLoad();}
function marketSwitchCategory(category){marketCategory=category;marketPageNumber=1;marketClose();marketN('market-list').textContent='';marketCategoryTabs();marketLaneTabs(null);return marketLoad();}
function marketCategoryLabel(category){var match=marketCategories.find(function(entry){return entry.id===category;});return match?match.label:category==='all'?'全部商品':'其他与综合';}
function marketCategoryTabs(categories){if(categories)marketCategories=categories;var host=marketN('market-categories'),focused=document.activeElement&&document.activeElement.dataset.marketCategory;host.textContent='';
 var total=marketCategories.reduce(function(sum,entry){return sum+entry.count;},0);
 [{id:'all',label:'全部商品',count:total}].concat(marketCategories).forEach(function(entry){var button=marketButton('',function(){marketSwitchCategory(entry.id);});button.dataset.marketCategory=entry.id;button.className='market-category'+(entry.id===marketCategory?' is-active':'');button.setAttribute('aria-pressed',entry.id===marketCategory?'true':'false');button.appendChild(marketNode('span','market-category-name',entry.label));button.appendChild(marketNode('span','market-category-count',entry.count));host.appendChild(button);if(focused===entry.id)button.focus();});
 marketN('market-selection-title').textContent=marketCategoryLabel(marketCategory);
 marketN('market-overview-label').textContent=marketCategoryLabel(marketCategory)+' · 交易概览';
}
function marketLaneTabs(counts){[['sale','闲置出售','折叠重复发布'],['want','求购','汇总求购需求'],['promotion','推广与服务','按发布人与分类归拢']].forEach(function(pair){var button=marketN('market-lane-'+pair[0]);button.className='market-lane'+(pair[0]===marketLane?' is-active':'');button.setAttribute('aria-pressed',pair[0]===marketLane?'true':'false');button.textContent='';button.appendChild(marketNode('span','market-lane-label',pair[1]));button.appendChild(marketNode('strong','market-lane-count',counts&&counts[pair[0]]!==undefined?counts[pair[0]]:'—'));button.appendChild(marketNode('span','market-lane-caption',pair[2]));});marketN('market-lane-note').textContent=marketLane==='promotion'?'同一发布人的同类推广收在一张卡片，展开核对各项报价。':marketLane==='want'?'重复求购集中展示，展开可核对持续时间和每次发布。':'重复发布已折叠；打包交易保留整条，展开查看包含的物品。';}
function marketCardTitle(item){if(item.lane==='promotion')return (item.seller_name||('QQ '+item.seller_qq))+' 的推广与服务';var parts=item.components||[];if(parts.length&&(item.title.length>40||/[\n\r]/.test(item.title)))return parts.slice(0,2).map(function(part){return part.title;}).join('、')+(parts.length>2?'等 '+parts.length+' 件':'');return item.title;}
function marketPublication(publication){var promise=marketOpen(publication.item_id),token=marketDetailToken;return promise.then(function(){if(token===marketDetailToken&&marketSelected)marketSource(publication,marketN('market-context'));});}
function marketCard(item){
 var row=marketNode('article','market-item'),heading=marketNode('div','market-item-heading');
 if(item.lane!=='promotion')row.dataset.marketItemId=item.item_id;
 row.appendChild(marketNode('div','market-item-category',marketCategoryLabel(item.category)));
 var title=marketButton(marketCardTitle(item),function(){marketOpen(item.item_id);});title.className='market-item-title';heading.appendChild(title);
 heading.appendChild(marketNode('span','market-item-price',item.lane==='promotion'?'逐项报价':item.price_text||'价格未注明'));row.appendChild(heading);
 var publications=item.publications||[],count=item.publication_count||item.source_count||1;
 row.appendChild(marketNode('p','market-item-description',item.lane==='promotion'?'按发布人归拢的服务清单，展开查看项目、价格和原文。':item.description||item.evidence));
 if(item.components&&item.components.length){var bundle=marketNode('details','market-bundle');bundle.appendChild(marketNode('summary','',(item.bundle_mode==='bundle'?'打包交易':'同帖清单')+' · '+(item.bundle_count||item.components.length)+'项'));var components=marketNode('ul','market-inline-components');item.components.forEach(function(component){var line=marketNode('li');line.appendChild(marketNode('span','',component.title));if(component.price_text)line.appendChild(marketNode('span','',component.price_text));components.appendChild(line);});bundle.appendChild(components);row.appendChild(bundle);}
 if(publications.length>1||item.lane==='promotion'){
  var history=marketNode('details','market-history');history.appendChild(marketNode('summary','',item.lane==='promotion'?'展开项目与报价 · '+publications.length+'条记录':(count>1?'重复发布已折叠 · '+count+'次发布':'相关发布')+' · 活跃 '+(item.active_days||1)+' 天'));
  var timeline=marketNode('div','market-timeline');publications.forEach(function(publication){var record=marketNode('section','market-publication');record.dataset.marketItemId=publication.item_id;record.appendChild(marketNode('div','market-publication-heading',publication.title+' · '+(publication.price_text||'价格未注明')));record.appendChild(marketNode('p','header-meta',marketDate(publication.published_at)+' · '+publication.group_name));record.appendChild(marketNode('p','market-publication-evidence',publication.evidence));record.appendChild(marketButton('查看这次原文',function(){marketPublication(publication);}));if(item.lane==='promotion')record.appendChild(marketButton('对此商品不感兴趣',function(){marketDismiss(publication,this);}));timeline.appendChild(record);});history.appendChild(timeline);row.appendChild(history);
 }
 var footer=marketNode('div','market-card-footer');footer.appendChild(marketNode('p','market-item-meta',(item.seller_name||item.seller_qq||'发布人待确认')+' · '+item.group_count+' 个群 · '+marketDate(item.published_at)+(item.original_time_unknown?' · 原时间待确认':'')+(item.favorite?' · 已收藏':'')+(item.status!=='unknown'?' · '+marketStatus(item.status):'')+(item.incomplete?' · 来源不完整':'')+(item.behavior_flags&&item.behavior_flags.includes('长期求购')?' · 持续求购 '+item.span_days+' 天':'')));
 var actions=marketNode('div','market-card-actions');actions.appendChild(marketButton('查看详情',function(){marketOpen(item.item_id);}));if(item.lane==='promotion')actions.appendChild(marketNode('span','header-meta','展开项目可逐项选择不感兴趣'));else actions.appendChild(marketButton('不感兴趣',function(){return marketDismiss(item,this);}));if(item.seller_qq)actions.appendChild(marketButton('屏蔽此人',function(){marketRequestBlock(item.seller_qq);}));footer.appendChild(actions);row.appendChild(footer);return row;
}
function marketInterestNote(text,keys){var host=marketN('market-interest-note');host.hidden=false;host.textContent='';host.appendChild(marketNode('span','',text));if(keys&&keys.length)host.appendChild(marketButton('撤销',function(){var button=this;if(button.disabled)return;button.disabled=true;api('POST','/api/secondhand/dismissed/restore',{keys:keys}).then(function(){host.hidden=true;marketLoad();}).catch(function(error){button.disabled=false;host.appendChild(marketNode('span','','恢复失败：'+error.message));});}));}
function marketDismiss(item,button){if(button.disabled)return Promise.resolve();button.disabled=true;var ids=[item.item_id];return api('POST','/api/secondhand/dismiss',{item_ids:ids}).then(function(data){marketN('market-list').querySelectorAll('[data-market-item-id]').forEach(function(current){if(current.dataset.marketItemId===item.item_id)current.remove();});var row=button.closest('.market-publication')||button.closest('.market-item');if(row)row.remove();marketInterestNote('已隐藏此商品及同卖家的同名重复发布。',data.keys);return marketLoad();}).catch(function(error){marketInterestNote('隐藏失败：'+error.message);}).finally(function(){button.disabled=false;});}
var marketDismissedToken=0;
function marketShowDismissed(){marketN('market-dismissed-dialog').showModal();marketLoadDismissed();}
function marketLoadDismissed(){var token=++marketDismissedToken,host=marketN('market-dismissed-list');host.textContent='正在读取…';return api('GET','/api/secondhand/dismissed').then(function(data){if(token!==marketDismissedToken)return;host.textContent='';if(!data.items.length)host.appendChild(marketNode('p','header-meta','暂无不感兴趣的商品。'));data.items.forEach(function(item){var row=marketNode('div','market-dismissed-row');row.appendChild(marketNode('span','',item.title));row.appendChild(marketButton('恢复显示',function(){var button=this;if(button.disabled)return;button.disabled=true;api('POST','/api/secondhand/dismissed/restore',{keys:[item.key]}).then(function(){row.remove();marketLoadDismissed();marketLoad();}).catch(function(error){row.appendChild(marketNode('p','header-meta','恢复失败：'+error.message));}).finally(function(){button.disabled=false;});}));host.appendChild(row);});}).catch(function(error){if(token===marketDismissedToken){host.textContent='读取失败：'+error.message+' ';host.appendChild(marketButton('重试',marketLoadDismissed));}});}
function marketFilter(event){if(event)event.preventDefault();marketPageNumber=1;marketClose();marketLoad();}
function marketPage(step){marketPageNumber+=step;marketClose();marketLoad();}
function marketRecent(){marketN('market-from').value='';marketN('market-to').value='';marketN('market-min').value='';marketN('market-max').value='';marketN('market-status').value='all';marketFilter();}
function marketLoad(){var token=++marketListToken,params=marketParams();marketN('market-count').textContent='正在读取交易信息…';
 return api('GET','/api/secondhand?'+params).then(function(data){if(token!==marketListToken)return;
  if(!params.has('date_from'))marketN('market-from').value=data.date_from;if(!params.has('date_to'))marketN('market-to').value=data.date_to;marketPageNumber=data.page;
  var host=marketN('market-list');host.textContent='';marketCategoryTabs(data.categories);marketLaneTabs(data.lane_counts);marketN('market-count').textContent=data.date_from+' 至 '+data.date_to+' · '+data.total+' 条整理结果';
  if(!data.items.length){var empty=marketNode('div','market-empty');empty.appendChild(marketNode('p','','当前分类和筛选下没有交易信息。'));empty.appendChild(marketButton('查看全部分类',function(){marketSwitchCategory('all');}));host.appendChild(empty);}
  data.items.forEach(function(item){host.appendChild(marketCard(item));});
  var pages=Math.max(1,Math.ceil(data.total/data.page_size));marketN('market-pages').hidden=pages<=1;marketN('market-prev').disabled=data.page<=1;marketN('market-next').disabled=data.page>=pages;marketN('market-page-label').textContent=data.page+' / '+pages;
 }).catch(function(error){if(token===marketListToken){var count=marketN('market-count');count.textContent='列表刷新失败：'+error.message+' ';count.appendChild(marketButton('重试',function(){return marketLoad();}));}});}
function marketClearSource(host){host._marketSourceToken=(host._marketSourceToken||0)+1;destroyMessageContext(host._marketContext);host._marketContext=null;host.textContent="";}
function marketOpen(key){marketClearSource(marketN("market-context"));var token=++marketDetailToken;marketSelected=null;marketSaving=false;marketN('market-dialog').showModal();marketN('market-title').textContent='正在读取…';marketN('market-description').textContent='';marketN('market-components').textContent='';marketN('market-sources').textContent='';marketN('market-meta').textContent='';marketN('market-detail-note').textContent='';marketN('market-favorite').disabled=true;marketN('market-block-seller').hidden=true;destroyMessageContext(marketN('market-context'));
 return api('GET','/api/secondhand/items/'+encodeURIComponent(key)).then(function(data){if(token!==marketDetailToken)return;marketSelected=data;var item=data.item;marketN('market-title').textContent=item.title;marketN('market-description').textContent=item.description||item.evidence;marketN('market-meta').textContent=(item.price_text||'价格未注明')+' · '+marketStatus(item.status)+' · '+(item.seller_name||'')+(item.seller_qq?' QQ '+item.seller_qq:' · 卖家身份未确认')+' · '+(item.source_count||0)+' 条来源 / '+(item.group_count||0)+' 个群 · 同发布人相关发布 '+(item.repeat_count||item.source_count||0)+' 次 / 活跃 '+(item.active_days||0)+' 天'+(marketFlags(item).length?' · '+marketFlags(item).join(' · '):'');var components=marketN('market-components');components.textContent='';if(item.components&&item.components.length){components.appendChild(marketNode('strong','',item.bundle_mode==='bundle'?'打包包含':'同帖物品清单'));var list=marketNode('ul');item.components.forEach(function(component){list.appendChild(marketNode('li','',component.title+' · '+component.evidence+(component.price_text?' · '+component.price_text:'')));});components.appendChild(list);}marketN('market-favorite').disabled=false;marketN('market-favorite').textContent=data.favorite?'取消收藏':'收藏';marketN('market-block-seller').hidden=!item.seller_qq;marketN('market-block-seller').textContent='屏蔽原发布人 '+(item.seller_qq||'');
 data.sources.forEach(function(source){var card=marketNode('section','market-source');card.appendChild(marketNode('div','header-meta',source.group_name+(source.original_time_unknown?' · 原发布时间未确认，记录于 ':' · 原发布时间 ')+marketDate(source.published_at)+(source.forwarded_at?' · 转发于 '+marketDate(source.forwarded_at):'')));card.appendChild(marketNode('p','',source.evidence));card.appendChild(marketNode('p','header-meta',(source.price_text||'价格未注明')+' · '+marketStatus(source.status)+(source.incomplete?' · 原时间或附件信息不完整':'')));var actions=marketNode('div','actions');actions.appendChild(marketButton('查看原消息与图片',function(){marketSource(source,marketN('market-context'));}));if(source.forwarder_qq)actions.appendChild(marketButton('屏蔽转发人 '+source.forwarder_qq,function(){marketRequestBlock(source.forwarder_qq);}));card.appendChild(actions);marketN('market-sources').appendChild(card);});
 }).catch(function(error){if(token===marketDetailToken)marketN('market-detail-note').textContent='详情读取失败：'+error.message;});}
function marketClose(){marketDetailToken++;marketSelected=null;marketN('market-dialog').close();marketClearSource(marketN('market-context'));}
function marketFavorite(){if(!marketSelected||marketSaving)return;var selected=marketSelected,token=marketDetailToken;marketSaving=true;marketN('market-favorite').disabled=true;api('PATCH','/api/secondhand/items/'+selected.item_id,{favorite:!selected.favorite}).then(function(){if(token!==marketDetailToken)return;selected.favorite=!selected.favorite;marketN('market-favorite').textContent=selected.favorite?'取消收藏':'收藏';marketLoad();}).catch(function(error){if(token===marketDetailToken)marketN('market-detail-note').textContent='收藏保存失败：'+error.message;}).finally(function(){if(token===marketDetailToken){marketSaving=false;marketN('market-favorite').disabled=false;}});}
function marketSource(source,host){destroyMessageContext(host._marketContext);host.textContent='';var token=(host._marketSourceToken||0)+1;host._marketSourceToken=token;var context=marketNode('div','');host.appendChild(context);host._marketContext=context;var dialog=host===marketN('market-context')?marketN('market-dialog'):marketN('market-unavailable-dialog');function current(){return host._marketSourceToken===token&&dialog.open;}
 mountMessageContext(context,{groupId:source.group_id,citedId:source.msg_id,url:'/api/secondhand/source?'+new URLSearchParams({group_id:source.group_id,msg_id:source.msg_id}),isCurrent:current});}
function marketShowBlocks(){marketN('market-blocks-dialog').showModal();marketN('market-block-note').textContent='';marketLoadBlocks();}
function marketLoadBlocks(){var token=++marketBlockToken;marketN('market-block-list').textContent='正在读取…';return api('GET','/api/secondhand/blocks').then(function(data){if(token!==marketBlockToken)return;var host=marketN('market-block-list');host.textContent='';if(!data.items.length)host.appendChild(marketNode('p','header-meta','暂无屏蔽账号'));data.items.forEach(function(item){var row=marketNode('div','market-block-row');row.appendChild(marketNode('span','','QQ '+item.qq));row.appendChild(marketButton('解除屏蔽',function(){var button=this;button.disabled=true;api('DELETE','/api/secondhand/blocks/'+item.qq).then(function(){row.remove();marketLoadBlocks();marketLoad();}).catch(function(error){marketN('market-block-note').textContent=error.message;}).finally(function(){button.disabled=false;});}));host.appendChild(row);});}).catch(function(error){if(token===marketBlockToken){marketN('market-block-note').textContent=error.message;var host=marketN('market-block-list');host.textContent='屏蔽名单读取失败，请重试。';host.appendChild(marketButton('重试',marketLoadBlocks));}});}
function marketRequestBlock(qq){marketN('market-block-qq').value=String(qq);marketShowBlocks();marketN('market-block-note').textContent='确认屏蔽 QQ '+qq+'，其在二手板块的所有来源将隐藏。';}
function marketBlockSeller(){if(marketSelected&&marketSelected.item.seller_qq)marketRequestBlock(marketSelected.item.seller_qq);}
function marketBlock(event){if(event)event.preventDefault();if(marketBlocking)return;var raw=marketN('market-block-qq').value.trim(),qq=Number(raw);if(!/^\d+$/.test(raw)||!Number.isSafeInteger(qq)||qq<=0){marketN('market-block-note').textContent='请输入有效 QQ 号';return;}marketBlocking=true;marketN('market-block-submit').disabled=true;api('POST','/api/secondhand/blocks',{qq:qq}).then(function(){marketN('market-block-note').textContent='已屏蔽；聊天原记录保留。';marketN('market-block-qq').value='';marketClose();marketLoadBlocks();marketLoad();}).catch(function(error){marketN('market-block-note').textContent='屏蔽失败：'+error.message;}).finally(function(){marketBlocking=false;marketN('market-block-submit').disabled=false;});}
function marketLoadGroups(){return api('GET','/api/secondhand/groups').then(function(data){var select=marketN('market-group'),old=select.value;select.textContent='';var all=marketNode('option','','全部二手群');all.value='';select.appendChild(all);marketN('market-group-settings').textContent='';marketN('market-groups-title').textContent='已接入 '+data.groups.length+' 个二手群';data.groups.forEach(function(group){var option=marketNode('option','',group.name);option.value=String(group.group_id);select.appendChild(option);var row=marketNode('div','market-group-row');row.appendChild(marketNode('span','',group.name+(group.enabled?'':' · 已停用')+' · 图片读取'+(group.read_images?'已开':'未开')));var link=marketNode('a','','管理群聊');link.href='/groups';row.appendChild(link);marketN('market-group-settings').appendChild(row);});select.value=old;marketN('market-groups-description').textContent=data.groups.length?'仅整理上述群聊，不影响普通群摘要。':'尚未导入，点击“更新交易信息”识别并导入本地二手群。';});}
function marketProgress(){clearTimeout(marketProgressTimer);api('GET','/api/secondhand/progress').then(function(data){if(data.running){marketUpdating=true;marketN('market-refresh').disabled=true;marketN('market-progress').hidden=false;marketN('market-progress').textContent=data.message;marketProgressTimer=setTimeout(marketProgress,1500);}else if(marketUpdating&&!marketOwnUpdate){marketUpdating=false;marketN('market-refresh').disabled=false;marketN('market-progress').textContent='更新已结束，请查看列表与未解析来源。';marketLoadGroups();marketLoad();}}).catch(function(){if(marketUpdating)marketProgressTimer=setTimeout(marketProgress,3000);});}
var marketOwnUpdate=false;
function marketRefresh(){if(marketUpdating)return;marketUpdating=true;marketOwnUpdate=true;marketN('market-refresh').disabled=true;marketN('market-progress').hidden=false;marketN('market-progress').textContent='正在导入本地二手群并整理交易信息…';marketProgressTimer=setTimeout(marketProgress,1000);api('POST','/api/secondhand/refresh',{date_from:marketN('market-from').value||null,date_to:marketN('market-to').value||null}).then(function(result){marketN('market-progress').textContent='本次读取 '+result.collected+' 条消息，新增归档 '+result.inserted+' 条；整理 '+result.processed+' 条来源，提取 '+result.offers+' 条商品记录。'+(result.unavailable?' '+result.unavailable+' 条图片／转发未解析。':'')+(result.failed?' '+result.failed+' 条识别失败，可重试。':'')+'\n'+(result.warnings||[]).join('\n');marketLoadGroups();marketLoad();}).catch(function(error){marketN('market-progress').textContent='更新失败：'+error.message+'。已有条目保留，可重试。';}).finally(function(){clearTimeout(marketProgressTimer);marketUpdating=false;marketOwnUpdate=false;marketN('market-refresh').disabled=false;});}
function marketUnavailable(){marketClearSource(marketN('market-unavailable-context'));marketN('market-unavailable-dialog').showModal();var host=marketN('market-unavailable-list');host.textContent='正在读取…';api('GET','/api/secondhand/unavailable').then(function(data){host.textContent='';if(!data.items.length)host.appendChild(marketNode('p','','没有记录到未解析来源；图片读取关闭或源库不完整仍可能造成缺失，见群设置和更新结果。'));data.items.forEach(function(source){var row=marketNode('section','market-source');row.appendChild(marketNode('p','',source.group_name+' · '+source.note));row.appendChild(marketButton('查看原消息',function(){marketSource(source,marketN('market-unavailable-context'));}));host.appendChild(row);});}).catch(function(error){host.textContent=error.message;});}
function marketInit(){marketLoadGroups().then(marketLoad).catch(function(error){marketN('market-count').textContent='群列表读取失败：'+error.message;});marketProgress();marketN('market-dialog').addEventListener('cancel',function(){marketDetailToken++;marketSelected=null;marketClearSource(marketN('market-context'));});marketN('market-unavailable-dialog').addEventListener('cancel',function(){marketClearSource(marketN('market-unavailable-context'));});}
marketInit();
</script>

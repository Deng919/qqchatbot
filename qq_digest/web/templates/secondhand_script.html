function marketProgress(){clearTimeout(marketProgressTimer);api('GET','/api/secondhand/progress').then(function(data){if(data.running){marketUpdating=true;marketN('market-refresh').disabled=true;marketN('market-progress').hidden=false;marketN('market-progress').textContent=data.message;marketProgressTimer=setTimeout(marketProgress,1500);}else if(marketUpdating&&!marketOwnUpdate){marketUpdating=false;marketN('market-refresh').disabled=false;marketN('market-progress').textContent='更新已结束，请查看列表与未解析来源。';marketLoadGroups();marketLoad();}}).catch(function(){if(marketUpdating)marketProgressTimer=setTimeout(marketProgress,3000);});}

function marketRefresh(){if(marketUpdating)return;marketUpdating=true;marketOwnUpdate=true;marketN('market-refresh').disabled=true;marketN('market-progress').hidden=false;marketN('market-progress').textContent='正在导入本地二手群并整理交易信息…';marketProgressTimer=setTimeout(marketProgress,1000);api('POST','/api/secondhand/refresh',{date_from:marketN('market-from').value||null,date_to:marketN('market-to').value||null}).then(function(result){marketN('market-progress').textContent='本次读取 '+result.collected+' 条消息，新增归档 '+result.inserted+' 条；整理 '+result.processed+' 条来源，提取 '+result.offers+' 条商品记录。'+(result.unavailable?' '+result.unavailable+' 条图片／转发未解析。':'')+(result.failed?' '+result.failed+' 条识别失败，可重试。':'')+'\n'+(result.warnings||[]).join('\n');marketLoadGroups();marketLoad();}).catch(function(error){marketN('market-progress').textContent='更新失败：'+error.message+'。已有条目保留，可重试。';}).finally(function(){clearTimeout(marketProgressTimer);marketUpdating=false;marketOwnUpdate=false;marketN('market-refresh').disabled=false;});}
function marketUnavailable(){var token=++marketUnavailableToken;marketClearSource(marketN('market-unavailable-context'));marketN('market-unavailable-dialog').showModal();var host=marketN('market-unavailable-list');function current(){return token===marketUnavailableToken&&marketN('market-unavailable-dialog').open;}host.textContent='正在读取…';api('GET','/api/secondhand/unavailable').then(function(data){if(!current())return;host.textContent='';if(!data.items.length)host.appendChild(marketNode('p','','没有记录到未解析来源；图片读取关闭或源库不完整仍可能造成缺失，见群设置和更新结果。'));data.items.forEach(function(source){var row=marketNode('section','market-source');row.appendChild(marketNode('p','',source.group_name+' · '+source.note));row.appendChild(marketButton('查看原消息',function(){marketSource(source,marketN('market-unavailable-context'));}));host.appendChild(row);});}).catch(function(error){if(current())host.textContent=error.message;});}
function marketInitialLoad(){marketN('market-count').textContent='正在读取群列表…';return marketLoadGroups().then(marketLoad).catch(function(error){var host=marketN('market-count');host.textContent='群列表读取失败：'+error.message+' ';host.appendChild(marketButton('重试',marketInitialLoad));});}
function marketInit(){marketInitialLoad();marketProgress();window.setInterval(function(){marketRefreshAges();},60000);marketN('market-dialog').addEventListener('cancel',function(){marketDetailToken++;marketSelected=null;marketClearSource(marketN('market-context'));});marketN('market-unavailable-dialog').addEventListener('cancel',function(){marketClearSource(marketN('market-unavailable-context'));});}
marketInit();
</script>

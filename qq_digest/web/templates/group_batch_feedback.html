<script>
function groupBatchRetryPayload(payload,results){var failed=results.filter(function(row){return row.status==='failed';}).map(function(row){return Number(row.group_id);}),retry=JSON.parse(JSON.stringify(payload));if(retry.groups)retry.groups=retry.groups.filter(function(row){return failed.includes(Number(row.group_id));});else retry.group_ids=failed;return retry;}
function renderGroupBatchFeedback(host,data,payload,retryAction){
  host.textContent='';var results=data.results||[],success=results.filter(function(row){return row.status==='success';}).length,failed=results.filter(function(row){return row.status==='failed';}).length,skipped=results.filter(function(row){return row.status==='skipped';}).length,heading=document.createElement('p');heading.textContent='完成 '+success+' 个群'+(skipped?' · 跳过 '+skipped+' 个群':'')+(failed?' · 失败 '+failed+' 个群':'');host.appendChild(heading);
  results.forEach(function(row){var article=document.createElement('div');article.className='group-batch-result';var name=(row.group_name||row.name||'群 '+row.group_id),line=document.createElement('p');line.textContent=name+' · '+(row.status==='failed'?'失败：'+(row.error||'请重试'):row.status==='skipped'?'已存在，跳过':row.status==='success'?'完成':row.status)+(row.total!==undefined?' · 读取 '+formatNumber(row.total)+' 条':'')+(row.inserted!==undefined?' · 新增 '+formatNumber(row.inserted)+' 条':'');article.appendChild(line);if(row.missing_days&&row.missing_days.length){var gaps=document.createElement('p');gaps.className='header-meta';gaps.textContent=(payload.dry_run?'待补缺口：':row.status==='success'?'本次补齐：':'更新前缺口：')+row.missing_days.map(function(day){return day.date+'（'+day.count+' 条）';}).join('、');article.appendChild(gaps);}host.appendChild(article);});
  if(failed&&retryAction){var retry=document.createElement('button');retry.className='btn btn-sm';retry.type='button';retry.textContent='重试失败的 '+failed+' 个群';var frozen=groupBatchRetryPayload(payload,results);retry.onclick=function(){retry.disabled=true;retryAction(frozen);};host.appendChild(retry);}
}
</script>
<style>.group-batch-result{padding:10px 0;border-top:1px solid var(--border)}.group-batch-result p{margin:4px 0;overflow-wrap:anywhere}.group-batch-toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin:14px 0}.group-batch-toolbar>.field{min-width:220px;flex:1}.group-batch-settings-row{display:grid;grid-template-columns:minmax(150px,1fr) minmax(140px,1fr);align-items:center;gap:12px;margin:12px 0}.group-batch-settings-row label{display:flex;gap:8px;align-items:center}#group-batch-settings-dialog{width:min(620px,calc(100vw - 30px));max-height:85vh;overflow:auto;border:1px solid var(--border);border-radius:12px;padding:22px}#group-batch-settings-dialog::backdrop{background:#142b2760}@media(max-width:700px){.group-batch-toolbar>.field{min-width:0;flex-basis:100%}.group-batch-settings-row{grid-template-columns:1fr}}
</style>

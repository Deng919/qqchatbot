<section id="summary-reading-controls" aria-label="摘要阅读条件">
  <div class="summary-date-shortcuts" role="group" aria-label="日期快捷选择">
    <button class="btn btn-sm" type="button" data-summary-days="today" onclick="summarySetDates('today')">今天</button>
    <button class="btn btn-sm" type="button" data-summary-days="week" onclick="summarySetDates('week')">最近七天</button>
    <button class="btn btn-sm" id="summary-all-dates" type="button" onclick="summaryAllDates()">历史摘要</button>
    <button class="btn btn-sm" id="summary-return-reading" type="button" onclick="summaryReturnToReading()" hidden>返回之前阅读</button>
  </div>
  <div class="filter-toolbar report-filters" aria-label="筛选摘要">
    <div class="field"><label for="report-group">群聊</label><select id="report-group" onchange="filterReports()"><option value="">全部群聊</option></select></div>
    <div class="field"><label for="report-from">开始日期</label><input class="input" id="report-from" type="date" onchange="filterReports()"></div>
    <div class="field"><label for="report-to">结束日期</label><input class="input" id="report-to" type="date" onchange="filterReports()"></div>
    <div class="field" id="summary-kind-field" hidden><label for="report-kind">摘要范围</label><select id="report-kind" onchange="filterReports()"><option value="all">全部摘要</option><option value="daily">单日摘要</option><option value="range">自选日期摘要（含旧报告）</option></select></div>
    <button class="btn" type="button" onclick="clearReportFilters()">清除筛选</button>
  </div>
  <div class="summary-view-bar">
    <div class="summary-view-tabs" role="group" aria-label="阅读方式">
      <button class="btn" id="summary-points-tab" type="button" aria-pressed="true" onclick="summarySetView('points')">要点阅读</button>
      <button class="btn" id="summary-groups-tab" type="button" aria-pressed="false" onclick="summarySetView('groups')">按群阅读</button>
    </div>
    <details class="summary-more" id="summary-more"><summary class="btn btn-sm">更多</summary><button class="btn btn-sm" type="button" onclick="summarySetView('manage')">管理报告</button></details>
  </div>
  <div class="summary-feed-tools" id="summary-feed-tools">
    <div class="field"><label for="summary-read-filter">要点范围</label><select id="summary-read-filter" onchange="summaryFilterPoints()"><option value="all">全部要点</option><option value="unread">未读要点</option><option value="new">上次打开后新增</option></select></div>
    <p id="summary-reading-note" class="header-meta"></p>
  </div>
</section>
<section id="summary-run-result" class="summary-result" role="status" hidden><p id="summary-run-message"></p>
  <div id="summary-generation-progress" class="generation-progress" hidden>
    <div class="generation-progress-heading"><strong id="summary-progress-stage" aria-live="polite"></strong><span id="summary-progress-count"></span></div>
    <progress id="summary-progress-bar" max="1" value="0" aria-label="摘要生成进度"></progress>
    <div class="generation-progress-meta"><span id="summary-progress-counts"></span><span id="summary-progress-time"></span></div>
    <p id="summary-progress-connection" class="generation-progress-connection" aria-live="polite"></p>
  </div><div id="summary-run-actions" class="actions"></div>
</section>
<section id="summary-reading-section" aria-label="摘要内容">
  <p id="summary-reading-count" class="header-meta" aria-live="polite"></p>
  <p id="summary-reading-warning" class="summary-warning" role="status" hidden></p>
  <div id="summary-points" class="summary-cards" aria-live="polite"><div class="empty">正在读取摘要要点…</div></div>
  <div id="summary-groups" class="summary-cards" hidden aria-live="polite"></div>
  <div id="summary-reading-pages" class="summary-pages" hidden><button class="btn btn-sm" id="summary-reading-prev" type="button" onclick="summaryChangePage(-1)">上一页</button><span id="summary-reading-page-label"></span><button class="btn btn-sm" id="summary-reading-next" type="button" onclick="summaryChangePage(1)">下一页</button></div>
</section>
<div id="summary-source-backdrop" class="range-summary-backdrop" hidden onclick="summaryCloseSource()"></div>
<aside id="summary-source-panel" class="range-summary-panel" role="dialog" aria-modal="true" aria-labelledby="summary-source-title" hidden>
  <div class="range-panel-header"><div><h2 id="summary-source-title">原消息与上下文</h2><p id="summary-source-scope"></p></div><button id="summary-source-close" class="btn btn-sm" type="button" onclick="summaryCloseSource()">关闭</button></div>
  <div id="summary-source-choices" class="actions"></div><div id="summary-source-messages" aria-live="polite"></div>
</aside>

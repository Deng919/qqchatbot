name: Windows public beta

on:
  push:
    tags: ['v0.2.0-beta.1']
    branches: ['main']
    paths: ['.github/workflows/public-beta.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.2.0-beta.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install ".[test,desktop,desktop-build]"
      - name: Test public distribution and installation
        run: >-
          python -m pytest -q
          tests/test_public_distribution.py tests/test_public_installer.py
          tests/test_public_build.py tests/test_runtime_paths.py
          tests/test_desktop.py tests/test_desktop_settings.py
          tests/test_desktop_updates.py tests/test_desktop_releases.py
          tests/test_desktop_update_web.py tests/test_backup_restore.py
          tests/test_first_use.py tests/test_first_use_web.py
          tests/test_ai_client.py tests/test_ai_settings.py
      - name: Build DeepSeek-only desktop
        run: python scripts/build_desktop.py --public --release-dir D:\Apps\QQDigestDesktop-0.2.0-beta.1
      - name: Build installer
        run: python scripts/build_installer.py
      - name: Keep installation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QQDigest-0.2.0-beta.1-Windows-x64
          path: |
            D:\Downloads\QQDigest-0.2.0-beta.1-Windows-x64-Setup.exe
            D:\Downloads\QQDigest-0.2.0-beta.1-Windows-x64-Setup.exe.sha256
      - name: Publish prerelease
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create v0.2.0-beta.1
          D:\Downloads\QQDigest-0.2.0-beta.1-Windows-x64-Setup.exe
          D:\Downloads\QQDigest-0.2.0-beta.1-Windows-x64-Setup.exe.sha256
          --verify-tag --prerelease --latest=false
          --title "QQ Digest 0.2.0-beta.1 · Windows 试用版"
          --notes-file docs/PUBLIC_BETA.md
